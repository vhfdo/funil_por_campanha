// ── Filtros cruzados ────────────────────────────────────────────────────────
// JSON.stringify usa aspas duplas, que fecham o atributo onclick="..." antes
// da hora e matam o clique. Escapamos pra entidade HTML.
const attr = v => JSON.stringify(String(v)).replace(/"/g, '&quot;');

function toggleFiltro(tipo, valor) {
  const ligando = filtros[tipo] !== valor;
  rastrear(ligando ? 'filtrar' : 'limpar_filtro', `${tipo}: ${valor}`);
  filtros[tipo] = filtros[tipo] === valor ? null : valor;
  render();
}

// Clique no mapa de calor. Celula liga dia E hora; o rotulo da lateral
// liga so o dia; o do topo, so a hora. Clicar no que ja esta ativo desliga.
function filtrarMomento(dia, hora) {
  const d = dia  === null ? null : String(dia);
  const h = hora === null ? null : String(hora);

  const jaAtivo = (d === null || filtros.diaSemana === d)
               && (h === null || filtros.hora === h)
               && (d !== null || h !== null);

  if (jaAtivo) {
    if (d !== null) filtros.diaSemana = null;
    if (h !== null) filtros.hora = null;
    rastrear('limpar_filtro', 'momento');
  } else {
    if (d !== null) filtros.diaSemana = d;
    if (h !== null) filtros.hora = h;
    rastrear('filtrar', `momento: ${d !== null ? DIAS_SEMANA[Number(d)] : 'todos'}`
      + ` ${h !== null ? h + 'h' : ''}`);
  }
  render();
}

function limparFiltros(silencioso) {
  if (!silencioso && Object.values(filtros).some(Boolean)) rastrear('limpar_filtros');
  filtros = { rede: null, etapa: null, proprietario: null, funil: null,
              cargo: null, motivo: null, score: null,
              diaSemana: null, hora: null };
  if (!silencioso) render();
}

// Qual filtro esta redesenhando o funil, pra mostrar no titulo do card
function labelFiltroFunil() {
  return filtros.proprietario || filtros.funil || filtros.cargo || filtros.rede || '';
}

function labelFiltros() {
  const ativos = Object.entries(filtros).filter(([, v]) => v);
  if (!ativos.length) return '';
  // Dia e hora sao numeros guardados como texto; sem traduzir, a barra
  // mostraria "1 · 21" em vez de "Segunda · 21h"
  const legivel = ([tipo, v]) => {
    if (tipo === 'diaSemana') return DIAS_SEMANA[Number(v)] || v;
    if (tipo === 'hora')      return String(v).padStart(2, '0') + 'h';
    if (tipo === 'score')     return 'score ' + v + '.0–' + v + '.9';
    return v;
  };
  return `Filtrando: ${ativos.map(legivel).join(' · ')} — limpar ×`;
}

// ── Dados derivados do produto ativo, já com filtros aplicados ──────────────
function dadosVisiveis() {
  const ehConsolidado = produtoAtivo === CONSOLIDADO;
  const nomes = ehConsolidado ? PRODUTOS_REAIS : [produtoAtivo];

  // Le uma data "DD/MM/AAAA hh:mm" (ou so DD/MM) e diz se cai na janela.
  // Todo bloco que sai do backlog precisa passar por aqui: a aba traz o mes
  // inteiro, entao sem esse corte os cards ficavam parados no total do mes
  // enquanto o seletor de data mexia so nos KPIs.
  const noPeriodo = (texto) => {
    const dia = (texto || '').trim().slice(0, 5);   // DD/MM
    return dia.includes('/') && dentroDoPeriodo(dia);
  };

  // Junta os produtos: no consolidado sao os cinco, senao e' so um.
  const leadsMap = {};      // data → {leads, mqls}
  const investPorRede = {};
  const investPorDia  = {};
  let ganhos = [];

  for (const nome of nomes) {
    const p = dados.produtos[nome];
    if (!p) continue;

    for (const d of p.leadsPorDia) {
      if (!dentroDoPeriodo(d.data)) continue;
      if (!leadsMap[d.data]) leadsMap[d.data] = { data: d.data, leads: 0, mqls: 0 };
      leadsMap[d.data].leads += d.leads;
      leadsMap[d.data].mqls  += d.mqls;
    }

    // O investimento e' somado dia a dia, nao pelo total fechado do mes:
    // so assim ele acompanha o seletor de data. O investDiaRede da API tem
    // a quebra por rede E por dia, que e' exatamente o que precisamos —
    // o total por rede vira a soma dos dias que caem na janela.
    const diaPorRede = p.investDiaRede || {};
    const temQuebra  = Object.keys(diaPorRede).length > 0;

    if (temQuebra) {
      for (const [rede, dias] of Object.entries(diaPorRede)) {
        if (filtros.rede && filtros.rede !== rede) continue;
        for (const [dia, val] of Object.entries(dias)) {
          if (!dentroDoPeriodo(dia)) continue;
          investPorRede[rede] = (investPorRede[rede] || 0) + val;
          investPorDia[dia]   = (investPorDia[dia] || 0) + val;
        }
      }
    } else {
      // API antiga, sem investDiaRede: melhor mostrar o total do mes do que
      // zerar o investimento e estourar o CPL e o ROAS.
      for (const [rede, total] of Object.entries(p.investPorRede || {})) {
        if (filtros.rede && filtros.rede !== rede) continue;
        investPorRede[rede] = (investPorRede[rede] || 0) + total;
      }
      for (const [dia, val] of Object.entries(p.investPorDia || {})) {
        investPorDia[dia] = (investPorDia[dia] || 0) + val;
      }
    }

    // O ganho tambem respeita o filtro de rede: sem isso o ROAS dividia o
    // faturamento inteiro pelo investimento de uma rede so.
    ganhos = ganhos.concat(
      p.ganhos.filter(g =>
        dentroDoPeriodo(g.data) &&
        (!filtros.rede || redeDoLead(g) === filtros.rede)
      )
    );
  }

  let leadsPorDia = Object.values(leadsMap).sort((a, b) => paraData(a.data) - paraData(b.data));
  const investimento = Object.values(investPorRede).reduce((s, v) => s + v, 0);

  // ── Backlog do(s) produto(s), ja com os filtros aplicados ────────────
  // Comparamos sem acento porque a planilha grava "PFCC MEXICO" e a aba
  // se chama "PFCC MÉXICO".
  const alvos = nomes.map(semAcento);
  let backlog = dados.backlog
    .filter(b => alvos.includes(semAcento(b.produto)))
    .filter(b => noPeriodo(b.aplicacao));

  if (filtros.etapa)        backlog = backlog.filter(b => b.etapa === filtros.etapa);
  if (filtros.proprietario) backlog = backlog.filter(b => b.proprietario === filtros.proprietario);
  if (filtros.funil)        backlog = backlog.filter(b => b.funil === filtros.funil);
  if (filtros.cargo)        backlog = backlog.filter(b => normalizarCargo(b.cargo) === filtros.cargo);
  if (filtros.rede)         backlog = backlog.filter(b => redeDoLead(b) === filtros.rede);
  // A faixa e' a parte inteira do score: clicar em "6" pega 6.0 ate 6.9
  if (filtros.score)        backlog = backlog.filter(b =>
    b.score !== null && b.score !== undefined
    && String(Math.floor(b.score)) === filtros.score);
  // O mapa de calor e' o SELETOR de dia e hora, entao ele nao pode se
  // filtrar a si mesmo: clicar numa celula vazia zerava o backlog, o mapa
  // sumia da tela e nao sobrava onde clicar pra desfazer.
  //
  // Ele recebe o backlog com todos os outros filtros aplicados, mas sem o
  // de momento — as celulas fora do recorte sao apagadas no desenho, nao
  // removidas do dado.
  const backlogMapa = backlog;

  if (filtros.diaSemana || filtros.hora) {
    backlog = backlog.filter(b => {
      const m = momentoDoLead(b);
      if (!m) return false;   // sem hora nao da pra dizer se cai no recorte
      if (filtros.diaSemana && String(m.dia)  !== filtros.diaSemana) return false;
      if (filtros.hora      && String(m.hora) !== filtros.hora)      return false;
      return true;
    });
  }

  // ── Etapas do funil ──────────────────────────────────────────────────
  // Sai sempre do backlog, nao da aba ETAPA. A aba traz todos os deals
  // abertos de qualquer periodo, enquanto o backlog e' so o mes corrente —
  // usar as duas fontes deixava o funil sem bater com os proprietarios.
  //
  // O filtro de etapa fica de fora do proprio funil, senao ele viraria
  // uma barra unica ao clicar numa etapa.
  const etapas = (() => {
    // Só negócios em aberto: o backlog traz perdidos e ganhos também, e
    // contá-los aqui inflava as etapas de um funil que se diz "em aberto".
    let base = dados.backlog
      .filter(b => alvos.includes(semAcento(b.produto)) && b.status === 'open')
      .filter(b => noPeriodo(b.aplicacao));
    if (filtros.proprietario) base = base.filter(b => b.proprietario === filtros.proprietario);
    if (filtros.funil)        base = base.filter(b => b.funil === filtros.funil);
    if (filtros.cargo)        base = base.filter(b => normalizarCargo(b.cargo) === filtros.cargo);
    if (filtros.rede)         base = base.filter(b => redeDoLead(b) === filtros.rede);
    if (filtros.diaSemana || filtros.hora) {
      base = base.filter(b => {
        const m = momentoDoLead(b);
        if (!m) return false;
        if (filtros.diaSemana && String(m.dia)  !== filtros.diaSemana) return false;
        if (filtros.hora      && String(m.hora) !== filtros.hora)      return false;
        return true;
      });
    }

    const contagem = {};
    for (const b of base) {
      if (metrica === 'mqls' && !b.mql) continue;
      const e = (b.etapa || '').trim() || '—';
      contagem[e] = (contagem[e] || 0) + 1;
    }
    return Object.entries(contagem).map(([etapa, qtd]) => ({ etapa, qtd }));
  })();

  const filtraFunil = !!(filtros.proprietario || filtros.funil || filtros.cargo || filtros.rede);

  // Leads e MQL por rede saem do backlog — a aba LEADS so tem o total
  const porRede = {};
  for (const rede of Object.keys(investPorRede)) {
    porRede[rede] = { leads: 0, mqls: 0, investimento: investPorRede[rede] };
  }
  for (const b of backlog) {
    const rede = redeDoLead(b);
    if (!porRede[rede]) porRede[rede] = { leads: 0, mqls: 0, investimento: 0 };
    porRede[rede].leads++;
    if (b.mql) porRede[rede].mqls++;
  }
  // CPL so existe onde ha investimento: o Organico entra no volume mas fica
  // sem CPL, senao a linha despencaria pra zero.
  // MQL e' subconjunto de leads, entao o denominador e' so leads.
  for (const r of Object.values(porRede)) {
    r.cpl = (r.investimento > 0 && r.leads)
      ? r.investimento / r.leads
      : null;
  }

  // MQL dos tres funis principais, dia a dia. A aba LEADS so tem o total,
  // entao isso sai do backlog usando a data da ultima aplicacao.
  const mqlTresFunisPorDia = {};
  for (const b of backlog) {
    if (!b.mql) continue;
    if (!FUNIS_PRINCIPAIS.includes((b.funil || '').toUpperCase())) continue;
    const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
    if (!dia.includes('/')) continue;
    mqlTresFunisPorDia[dia] = (mqlTresFunisPorDia[dia] || 0) + 1;
  }
  const mqlTresFunis = Object.values(mqlTresFunisPorDia).reduce((s, v) => s + v, 0);

  // Filtros vindos do backlog reescrevem a contagem de leads e MQL:
  // com filtro ativo, contar da aba LEADS daria o total do produto inteiro.
  const filtrandoBacklog = !!(filtros.etapa || filtros.proprietario
    || filtros.funil || filtros.cargo || filtros.rede || filtros.score
    || filtros.diaSemana || filtros.hora);

  // Com filtro ativo o grafico tambem passa a sair do backlog. A aba LEADS
  // so tem o total do dia, sem quebra por rede/dono/etapa — se ela continuasse
  // alimentando as barras, elas ficariam paradas enquanto o resto filtrava.
  if (filtrandoBacklog) {
    const porDia = {};
    for (const b of backlog) {
      const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
      if (!dia.includes('/')) continue;
      if (!dentroDoPeriodo(dia)) continue;
      if (!porDia[dia]) porDia[dia] = { data: dia, leads: 0, mqls: 0 };
      porDia[dia].leads++;
      if (b.mql) porDia[dia].mqls++;
    }
    leadsPorDia = Object.values(porDia).sort((a, b) => paraData(a.data) - paraData(b.data));
  }

  const leads = filtrandoBacklog
    ? backlog.length
    : leadsPorDia.reduce((s, d) => s + d.leads, 0);
  const mqls = filtrandoBacklog
    ? backlog.filter(b => b.mql).length
    : leadsPorDia.reduce((s, d) => s + d.mqls, 0);

  // ── Reunioes agendadas no mes, do(s) produto(s) em foco ─────────────
  let reunioes = (dados.reunioes || [])
    .filter(r => alvos.includes(semAcento(r.produto)))
    .filter(r => noPeriodo(r.dataReuniao));
  if (filtros.proprietario) reunioes = reunioes.filter(r => r.proprietario === filtros.proprietario);
  if (filtros.funil)        reunioes = reunioes.filter(r => r.funil === filtros.funil);
  if (filtros.cargo)        reunioes = reunioes.filter(r => normalizarCargo(r.cargo) === filtros.cargo);
  if (filtros.rede)         reunioes = reunioes.filter(r => redeDoLead(r) === filtros.rede);

  const ganhosValidos = ganhos.filter(g => g.vale === 'sim');
  const faturamento   = ganhosValidos.reduce((s, g) => s + g.valor, 0);
  const qtdGanhos     = ganhosValidos.length;

  // ── Descartes do periodo ─────────────────────────────────────────────
  // Exige as DUAS datas dentro da janela: o lead entrou no periodo E foi
  // descartado nele. Sem a checagem da aplicacao, entrava base antiga
  // descartada agora e o total passava do volume de leads do mes.
  let descartes = (dados.perdidos || [])
    .filter(p => alvos.includes(semAcento(p.produto)))
    .filter(p => noPeriodo(p.dataPerda) && noPeriodo(p.aplicacao));
  // Os rotulos vazios viram "—" e "(sem motivo)" no agrupamento; o filtro
  // precisa normalizar igual, senao clicar nessas barras nao casa com nada.
  const rot = (t, vazio) => (t || '').trim() || vazio;
  if (filtros.etapa)        descartes = descartes.filter(p => rot(p.etapa, '—') === filtros.etapa);
  if (filtros.proprietario) descartes = descartes.filter(p => rot(p.proprietario, '—') === filtros.proprietario);
  if (filtros.funil)        descartes = descartes.filter(p => p.funil === filtros.funil);
  if (filtros.cargo)        descartes = descartes.filter(p => normalizarCargo(p.cargo) === filtros.cargo);
  if (filtros.rede)         descartes = descartes.filter(p => redeDoLead(p) === filtros.rede);
  if (filtros.motivo)       descartes = descartes.filter(p => rot(p.motivo, '(sem motivo)') === filtros.motivo);

  // ── Taxas ────────────────────────────────────────────────────────────
  // Conexao: dos MQLs criados, quantos chegaram a Contatado ou alem.
  const mqlsBacklog = backlog.filter(b => b.mql);
  const conectados  = mqlsBacklog.filter(b =>
    ETAPAS_CONECTADAS.some(e => semAcento(b.etapa).includes(e)));

  const taxas = {
    // Que % dos leads vira MQL
    qualificacao: leads ? mqls / leads * 100 : null,
    // Que % dos MQLs teve algum contato
    conexao: mqlsBacklog.length
      ? conectados.length / mqlsBacklog.length * 100 : null,
    // Que % dos MQLs virou reuniao agendada
    agendamento: mqls ? reunioes.length / mqls * 100 : null,
    // Que % das reunioes virou venda
    vendasCall: reunioes.length ? qtdGanhos / reunioes.length * 100 : null,
    // Funil inteiro: do lead ate a venda, e do MQL ate a venda.
    // Atencao ao numerador: o ganho pode ser de um lead que entrou meses
    // atras, entao esta taxa nao e' de coorte — e' venda do periodo sobre
    // lead do periodo. Serve pra acompanhar tendencia, nao pra prever.
    leadVenda: leads ? qtdGanhos / leads * 100 : null,
    mqlVenda:  mqls  ? qtdGanhos / mqls  * 100 : null,
  };

  return {
    leadsPorDia, ganhos, backlog, backlogMapa,
    investPorRede, investPorDia, porRede, etapas,
    ehConsolidado, mqlTresFunisPorDia, mqlTresFunis, filtraFunil,
    reunioes, taxas, descartes,
    kpis: {
      leads, mqls, investimento,
      ganhos: qtdGanhos, faturamento,
      roas:  investimento ? faturamento / investimento : 0,
      // MQL ja esta contido em leads — dividir so por leads
      cpl:   leads ? investimento / leads : 0,
      cpmql: mqls      ? investimento / mqls      : 0,
      cac:   qtdGanhos ? investimento / qtdGanhos : 0,
    },
  };
}

// ── CPMQL dia a dia, por produto ────────────────────────────────────────────
// Investimento do dia dividido pelos MQL do dia. Devolve uma serie por
// produto — no Consolidado sao cinco linhas, numa aba de produto e' uma so.
//
// O filtro de rede entra nas duas pontas: so o investimento daquela rede e
// so os leads que vieram dela. Dividir gasto de uma rede pelos MQL de todas
// daria um CPMQL fantasia.
function cpmqlPorDiaProduto() {
  const nomes = produtoAtivo === CONSOLIDADO ? PRODUTOS_REAIS : [produtoAtivo];
  const dias = new Set();
  const series = [];

  for (const nome of nomes) {
    const p = dados.produtos[nome];
    if (!p) continue;

    // Investimento por dia
    const invDia = {};
    const diaPorRede = p.investDiaRede || {};
    for (const [rede, porDia] of Object.entries(diaPorRede)) {
      if (filtros.rede && filtros.rede !== rede) continue;
      for (const [dia, val] of Object.entries(porDia)) {
        if (!dentroDoPeriodo(dia)) continue;
        invDia[dia] = (invDia[dia] || 0) + val;
        dias.add(dia);
      }
    }

    // MQL por dia, com os mesmos filtros da tela
    const alvo = semAcento(nome);
    let base = dados.backlog.filter(b => semAcento(b.produto) === alvo && b.mql);
    if (filtros.etapa)        base = base.filter(b => b.etapa === filtros.etapa);
    if (filtros.proprietario) base = base.filter(b => b.proprietario === filtros.proprietario);
    if (filtros.funil)        base = base.filter(b => b.funil === filtros.funil);
    if (filtros.cargo)        base = base.filter(b => normalizarCargo(b.cargo) === filtros.cargo);
    if (filtros.rede)         base = base.filter(b => redeDoLead(b) === filtros.rede);
    if (filtros.score)        base = base.filter(b =>
      b.score !== null && b.score !== undefined
      && String(Math.floor(b.score)) === filtros.score);

    const mqlDia = {};
    for (const b of base) {
      const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
      if (!dia.includes('/') || !dentroDoPeriodo(dia)) continue;
      mqlDia[dia] = (mqlDia[dia] || 0) + 1;
      dias.add(dia);
    }

    series.push({ nome, invDia, mqlDia });
  }

  const labels = [...dias].sort((a, b) => paraData(a) - paraData(b));

  return {
    labels,
    series: series.map(s => ({
      nome: s.nome,
      // null onde falta investimento ou MQL: o ponto some em vez de
      // desabar pra zero e achatar a escala do grafico inteiro
      dados: labels.map(d => {
        const inv = s.invDia[d] || 0;
        const mql = s.mqlDia[d] || 0;
        return inv && mql ? Math.round(inv / mql) : null;
      }),
      // Guardados pro tooltip explicar de onde saiu o numero
      invDia: s.invDia,
      mqlDia: s.mqlDia,
    })),
  };
}

// Quanto deveria estar a esta altura do mes, no ritmo da meta
function metaAteHoje(meta) {
  if (!meta) return null;
  const hoje = new Date();
  const fim  = document.getElementById('dataFim').value;
  const dia  = fim ? new Date(fim + 'T00:00:00').getDate() : hoje.getDate();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  return Math.round(meta / diasNoMes * dia);
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  if (!dados) return;
  const v = dadosVisiveis();
  if (!v) {
    document.getElementById('conteudo').innerHTML = '<div class="empty">Sem dados para este produto.</div>';
    return;
  }

  // Periodo de comparacao: reaproveita dadosVisiveis() inteiro trocando
  // as datas na hora da chamada (ver comPeriodo). Assim herda automatico
  // todos os filtros ja ativos — rede, etapa, funil etc — e nao precisa
  // duplicar a logica so pra calcular outra janela.
  //
  // Fica aqui no topo porque o bloco do TME, logo abaixo, ja precisa dele:
  // declarar mais adiante dava "Cannot access 'vComp' before
  // initialization" e a tela nem carregava.
  const vComp = comparando
    ? comPeriodo(
        document.getElementById('compInicio').value,
        document.getElementById('compFim').value,
        () => dadosVisiveis())
    : null;
  const kComp = vComp ? vComp.kpis : null;

  document.getElementById('filtroAtivo').textContent = labelFiltros();

  // O aviso fica ao lado do contador de leads, onde o olho ja passa.
  // O texto base vem de uma variavel e nao do proprio elemento: ler o
  // textContent na primeira renderizacao pegaria "Buscando dados..." e
  // esse texto ficaria colado ali pra sempre.
  const elStatus = document.getElementById('statusTexto');
  if (elStatus) {
    elStatus.innerHTML = textoStatus + avisoComparacao()
      + (comparando ? rotuloComparacao() : '');
  }

  // O TME fica no cabecalho, fora do #conteudo — entao e' preenchido aqui,
  // em toda renderizacao, pra acompanhar os filtros como o resto da tela
  const boxTME = document.getElementById('tmeHeader');
  if (boxTME) boxTME.innerHTML = cardTME(v, vComp);

  if (modoBase)      { renderBase(v); return; }
  if (modoGanhos)    { renderGanhos(v); return; }
  if (modoDescartes) { renderDescartes(v); return; }
  if (modoCampanhas) { renderCampanhas(v); return; }
  if (modoReport)    { renderReport(v); return; }

  const k = v.kpis;
  const metas = METAS[produtoAtivo] || {};

  // Atalho: selo de variacao pro campo `campo` de k, contra o mesmo campo
  // em kComp. Sem periodo de comparacao ligado, badgeDelta ja devolve ''.
  const dv = (campo, menorMelhor = false, fmt = fmtNum) =>
    kComp ? badgeDelta(k[campo], kComp[campo], { menorMelhor, fmt }) : '';

  // Um KPI pode ter meta. Quando tem, mostramos o alvo do mes, quanto
  // deveria estar hoje e uma barra de progresso.
  //
  // CAC e CPMQL sao "quanto menor, melhor": pra eles nao existe ritmo
  // acumulado, so a comparacao direta com o teto.
  function kpiCard(label, valor, opts = {}) {
    const { meta, fmt = fmtNum, azul = false, bruto = null,
            menorMelhor = false, semRitmo = false,
            gastoMenorMelhor = false, delta = '' } = opts;

    // O valor e o selo de variacao ficam juntos, pra nao repetir esse
    // bloco em cada um dos tres formatos de card abaixo.
    const linhaValor = `<div class="kpi-val ${azul ? 'blue' : ''}">${valor}</div>${delta}`;

    if (!meta) {
      return `<div class="kpi-card">
        <div class="kpi-label">${label}</div>
        ${linhaValor}
      </div>`;
    }

    if (menorMelhor || semRitmo) {
      const dentro = menorMelhor ? bruto <= meta : bruto >= meta;
      const cor = bruto ? (dentro ? 'var(--green)' : 'var(--red)') : 'var(--gray)';
      const pct = meta ? Math.min(bruto / meta * 100, 100) : 0;
      return `<div class="kpi-card">
        <div class="kpi-label">${label}</div>
        ${linhaValor}
        <div class="kpi-linha"><span>${menorMelhor ? 'Teto' : 'Meta'}</span>
          <span style="color:${cor}">${fmt(meta)}</span></div>
        <div class="kpi-barra"><div style="width:${pct}%;background:${cor}"></div></div>
      </div>`;
    }

    const alvoHoje = metaAteHoje(meta);
    const pct = Math.min(bruto / meta * 100, 100);
    // Volume: estar acima do ritmo e' bom. Gasto: e' o contrario — passar
    // do previsto pra data significa que o orcamento vai estourar antes do
    // fim do mes.
    const noRitmo = alvoHoje === null
      ? true
      : (gastoMenorMelhor ? bruto <= alvoHoje : bruto >= alvoHoje);
    const cor = noRitmo ? 'var(--green)' : 'var(--red)';
    return `<div class="kpi-card">
      <div class="kpi-label">${label}</div>
      ${linhaValor}
      <div class="kpi-linha"><span>Projeção</span>
        <span style="color:${cor}">${fmt(alvoHoje)}</span></div>
      <div class="kpi-linha"><span>Meta</span><span>${fmt(meta)}</span></div>
      <div class="kpi-barra"><div style="width:${pct}%;background:${cor}"></div></div>

  }

  const kpisHtml = [
    kpiCard('Leads', fmtNum(k.leads),
      { azul:true, meta: metas.leads, bruto: k.leads, delta: dv('leads') }),
    kpiCard('MQL', fmtNum(k.mqls),

    kpiCard('Investimento', fmtBRL(k.investimento),
      { meta: metas.investimento, bruto: k.investimento,
        fmt: fmtBRL, gastoMenorMelhor: true,
        // Investimento maior nao e' "ruim" por si — quem decide isso e'
        // o card de Previsto. Aqui o selo so' informa, sem menorMelhor.
        delta: dv('investimento') }),
    kpiCard('Vol. Ganhos', fmtNum(k.ganhos),
      { meta: metas.vendas, bruto: k.ganhos, delta: dv('ganhos') }),
    kpiCard('Faturamento', fmtBRL(k.faturamento),
      { meta: metas.faturamento, bruto: k.faturamento, fmt: fmtBRL,
        delta: dv('faturamento') }),
    kpiCard('ROAS', fmtRoas(k.roas),
      { meta: metas.roas, bruto: k.roas, fmt: fmtRoas, semRitmo: true,
        delta: dv('roas', false, fmtRoas) }),
    kpiCard('CPL', fmtBRL(k.cpl),
      { meta: metas.cpl, bruto: k.cpl, fmt: fmtBRL, menorMelhor: true,
        delta: dv('cpl', true, fmtBRL) }),
    kpiCard('CPMQL', fmtBRL(k.cpmql),
      { meta: metas.cpmql, bruto: k.cpmql, fmt: fmtBRL, menorMelhor: true,
        delta: dv('cpmql', true, fmtBRL) }),
    kpiCard('CAC', fmtBRL(k.cac),
      { meta: metas.cac, bruto: k.cac, fmt: fmtBRL, menorMelhor: true,
        delta: dv('cac', true, fmtBRL) }),
    cardReaplicacao(v, vComp),
    cardPrevisto(v, vComp),
  ].join('');

  document.getElementById('conteudo').innerHTML = `
    <div class="kpi-strip" style="grid-template-columns:repeat(11,1fr)">${kpisHtml}</div>

    <div class="redes-grid">${cardsRedes(v, vComp)}</div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        Investimento · Leads · MQL
        <span class="card-tag" style="background:#7ee0a8;color:#0a0a0a">
          ${fmtNum(v.mqlTresFunis)} nos 3 funis</span>
      </div>
      <div class="chart-box" style="height:300px"><canvas id="chartLeads"></canvas></div>
    </div>

    <div class="grid-meio">
      <div class="card">
        <div class="card-title">
          Leads · MQL · CPL por rede
          <span class="card-tag">clique pra filtrar</span>
        </div>
        <div class="chart-box baixo"><canvas id="chartRedes"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          Funis
          <span class="card-tag">leads → mql</span>
        </div>
        <div class="card-body" style="max-height:230px">${tabelaFunis(v, null, vComp)}</div>
      </div>
      <div class="card">
        <div class="card-title">
          ${PRODUTOS_COM_SCORE.includes(produtoAtivo) ? 'Pontuação' : 'Cargos'}
          <span class="card-tag">${
            PRODUTOS_COM_SCORE.includes(produtoAtivo)
              ? 'MQL a partir de ' + SCORE_MINIMO
              : '% dos leads'}</span>
        </div>
        <div class="card-body" style="max-height:230px">${
          PRODUTOS_COM_SCORE.includes(produtoAtivo)
            ? tabelaScore(v)
            : tabelaCargos(v, vComp)}</div>
      </div>
      <div class="card">
        <div class="card-title">
          Proprietários
          <span class="card-tag">${qtdProprietarios(v)} · ${fmtNum(v.backlog.length)} leads</span>
        </div>
        <div class="table-scroll" style="max-height:230px">${tabelaProprietarios(v, vComp)}</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        Quando os leads chegam
        <span class="card-tag">${
          filtros.diaSemana || filtros.hora
            ? 'clique de novo pra limpar'
            : 'clique pra filtrar'}</span>
      </div>
      ${mapaCalor(v)}
    </div>

    <div class="grid-topo">
      <div class="card">
        <div class="card-title">
          Vendas e faturamento
          ${(METAS[produtoAtivo] || {}).faturamento
            ? `<span class="card-tag">meta ${fmtBRL(METAS[produtoAtivo].faturamento)}</span>`
            : ''}
        </div>
        <div class="chart-box baixo"><canvas id="chartGanhos"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          Comparativo entre produtos
          ${comparando

                     title="Comparando com o período em 'vs' no cabeçalho">vs período anterior</span>`
            : `<span class="card-tag">no período selecionado</span>`}

        <div class="table-scroll">${tabelaProdutos()}</div>

    </div>

    <div class="grid-topo">

          Vendas: novo x reaplicação

        </div>
        <div class="card-body" style="max-height:280px">${vendasPorOrigem(v)}</div>
      </div>
      <div class="card">
        <div class="card-title">
          Cargo de quem comprou
          <span class="card-tag">clique pra filtrar</span>
        </div>
        <div class="card-body" style="max-height:280px">${perfilDosGanhos(v, 'cargo')}</div>
      </div>
    </div>

    <div class="grid-topo">
      <div class="card">
        <div class="card-title">

      <div class="card">

      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        CPMQL por dia
        <span class="card-tag">${produtoAtivo === CONSOLIDADO

          filtros.rede ? ' · ' + filtros.rede : ''} · em R$</span>
      </div>
      <div class="chart-box" style="height:360px"><canvas id="chartCpmqlProdutos"></canvas></div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">
        ${metrica === 'mqls' ? 'MQL' : 'Leads'} em aberto · rastreio completo
        <span class="busca-wrap">
          <input type="text" id="campoBuscaAbertos" class="campo-busca"
                 placeholder="filtrar por campanha, criativo, cargo, nome..."
                 value="${(buscaAbertos || '').replace(/"/g, '&quot;')}"
                 oninput="buscarAbertos(this.value)">

                 onclick="buscarAbertos('')" title="limpar">×</button>` : ''}

        <span style="display:flex;align-items:center;gap:10px">
          <span class="card-tag">${fmtNum(leadsAbertos(v).length)} em aberto${
            labelFiltros()
              ? ' · ' + labelFiltros().replace('Filtrando: ', '').replace(' — limpar ×', '')

      ${[
        ['Tx. Qualificação',   'qualificacao', `${fmtNum(v.kpis.mqls)} de ${fmtNum(v.kpis.leads)} leads`],
        ['Tx. Conexão',        'conexao',      'MQLs que chegaram a Contatado+'],
        ['Tx. Agendamento',    'agendamento',  `${fmtNum(v.reunioes.length)} reuniões`],
        ['Tx. Vendas s/ Call', 'vendasCall',   `${fmtNum(v.kpis.ganhos)} vendas`],
        ['Lead → Ganho',       'leadVenda',    `${fmtNum(v.kpis.ganhos)} de ${fmtNum(v.kpis.leads)} leads`],
        ['MQL → Ganho',        'mqlVenda',     `${fmtNum(v.kpis.ganhos)} de ${fmtNum(v.kpis.mqls)} MQL`],
      ].map(([nome, chave, detalhe]) => {
        const valor = v.taxas[chave];
        // Taxa e' percentual: o selo mostra a variacao em pontos
        // percentuais, nao a variacao relativa — subir de 2% pra 3% e'
        // +1 p.p., dizer "+50%" confundiria.
        const ant = vComp ? vComp.taxas[chave] : null;
        const delta = (comparando && valor !== null && ant !== null)
          ? (() => {
              const d = valor - ant;
              const cor = Math.abs(d) < 0.2 ? 'var(--gray-light)'
                        : d > 0 ? 'var(--green)' : 'var(--red)';
              return `<span class="kpi-delta" style="color:${cor}"
                title="Período de comparação: ${ant.toFixed(1)}%">${
                d > 0 ? '▲' : d < 0 ? '▼' : '·'} ${
                Math.abs(d).toFixed(1)} p.p.</span>`;
            })()
          : '';
        return `
        <div class="taxa">
          <div class="taxa-nome">${nome}</div>
          <div class="taxa-val" style="color:${valor === null ? 'var(--gray)' : 'var(--blue)'}">${
            valor === null ? '—' : valor.toFixed(1) + '%'}</div>
          <div class="taxa-detalhe">${detalhe}${delta}</div>
        </div>`;
      }).join('')}
    </div>

  `;

  desenharGraficos(v, vComp);
}

// ── Report: uma pagina, so o essencial ──────────────────────────────────────
function renderReport(v) {
  const k = v.kpis;
  const metas = METAS[produtoAtivo] || {};
  const reaplicacoes = v.backlog.filter(b => b.reaplicacao).length;
  const pctReapl = k.leads ? (reaplicacoes / k.leads * 100) : 0;

  // Card com meta: mostra o alvo do mes e onde deveria estar hoje.
  // Investimento inverte a leitura — gastar acima do ritmo e' o alerta.
  function card(label, valor, opts = {}) {
    const { meta, fmt = fmtNum, azul = false, bruto = null,
            nota = '', gastoMenorMelhor = false, semRitmo = false } = opts;

    let extra = nota ? `<div class="kpi-linha"><span>${nota}</span></div>` : '';

    // ROAS e' razao, nao acumulado: nao faz sentido "projecao ate hoje"
    if (meta && semRitmo) {
      const cor = bruto >= meta ? 'var(--green)' : 'var(--red)';
      extra = `
        <div class="kpi-linha"><span>Meta</span>
          <span style="color:${cor}">${fmt(meta)}</span></div>
        <div class="kpi-barra"><div style="width:${
          Math.min(bruto / meta * 100, 100)}%;background:${cor}"></div></div>`;
    } else if (meta) {
      const alvo = metaAteHoje(meta);
      const dentro = gastoMenorMelhor ? bruto <= alvo : bruto >= alvo;
      const cor = dentro ? 'var(--green)' : 'var(--red)';
      const pct = Math.min(bruto / meta * 100, 100);
      extra = `
        <div class="kpi-linha"><span>Projeção</span>
          <span style="color:${cor}">${fmt(alvo)}</span></div>
        <div class="kpi-linha"><span>Meta</span><span>${fmt(meta)}</span></div>
        <div class="kpi-barra"><div style="width:${pct}%;background:${cor}"></div></div>`;
    }

    return `<div class="kpi-card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-val ${azul ? 'blue' : ''}">${valor}</div>
      ${extra}
    </div>`;
  }

  document.getElementById('conteudo').innerHTML = `
    <div class="report-kpis">
      ${card('Vol. Leads', fmtNum(k.leads),
          { azul:true, meta: metas.leads, bruto: k.leads })}
      ${card('Vol. MQL', fmtNum(k.mqls),
          { azul:true, meta: metas.mqls, bruto: k.mqls })}
      ${card('Reaplicação', fmtNum(reaplicacoes),
          { nota: `${pctReapl.toFixed(0)}% dos leads` })}
      ${card('Investimento', fmtBRL(k.investimento),
          { meta: metas.investimento, bruto: k.investimento,
            fmt: fmtBRL, gastoMenorMelhor: true })}
      ${card('CPL', fmtBRL(k.cpl))}
      ${card('CPMQL', fmtBRL(k.cpmql))}
      ${card('Vol. Ganhos', fmtNum(k.ganhos),
          { meta: metas.vendas, bruto: k.ganhos })}
      ${card('Faturamento', fmtBRL(k.faturamento),
          { meta: metas.faturamento, bruto: k.faturamento, fmt: fmtBRL })}
      ${card('ROAS', fmtRoas(k.roas),
          { meta: metas.roas, bruto: k.roas, fmt: fmtRoas, semRitmo: true })}
    </div>

    <div class="report-grid">
      <div class="card">
        <div class="card-title">Investimento · Leads · MQL</div>
        <div class="chart-box report-chart"><canvas id="chartLeads"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Funil</div>
        <div class="card-body report-funil">${funilHtml(v)}</div>
      </div>
    </div>

    <div class="report-grid-2">
      <div class="card">
        <div class="card-title">CPL por dia</div>
        <div class="chart-box report-chart-2"><canvas id="chartCpl"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Funis</div>
        <div class="card-body report-funis">${tabelaFunis(v, 9)}</div>
      </div>
    </div>

    <div class="taxas report-taxas">
      ${[
        ['Tx. Qualificação',   v.taxas.qualificacao, `${fmtNum(v.kpis.mqls)} de ${fmtNum(v.kpis.leads)}`],
        ['Tx. Conexão',        v.taxas.conexao,      'chegaram a Contatado+'],
        ['Tx. Agendamento',    v.taxas.agendamento,  `${fmtNum(v.reunioes.length)} reuniões`],
        ['Tx. Vendas s/ Call', v.taxas.vendasCall,   `${fmtNum(v.kpis.ganhos)} vendas`],
      ].map(([nome, valor, detalhe]) => `
        <div class="taxa">
          <div class="taxa-nome">${nome}</div>
          <div class="taxa-val" style="color:${valor === null ? 'var(--gray)' : 'var(--blue)'}">${
            valor === null ? '—' : valor.toFixed(1) + '%'}</div>
          <div class="taxa-detalhe">${detalhe}</div>
        </div>`).join('')}
    </div>

    ${v.ehConsolidado ? `
      <div class="card report-comparativo">
        <div class="card-title">Comparativo entre produtos</div>
        ${tabelaProdutos()}
      </div>` : ''}
  `;

  desenharGraficos(v);
}

// ── Exportar a base filtrada em CSV ─────────────────────────────────────────
// Exporta exatamente o que esta na tela: os mesmos filtros de produto,
// periodo, rede, etapa, funil, cargo e proprietario.
//
// Separador ponto e virgula e BOM no inicio: e' o que o Excel brasileiro
// espera. Sem o BOM os acentos saem corrompidos.
function exportarBaseCSV() {
  const v = dadosVisiveis();
  if (!v || !v.backlog.length) return;

  rastrear('exportar_base', `${v.backlog.length} leads`);

  const cabecalho = [
    'ID', 'Produto', 'Nome', 'Cargo', 'MQL', 'Funil', 'Etapa',
    'Proprietário', 'Rede', 'Score', 'Status', 'Motivo Perda', 'Data Perda',
    'Reaplicação', 'Aplicação', 'Valor', 'utm_campaign', 'utm_source',
  ];

  // Campo com ; aspas ou quebra de linha estraga o CSV — envolvemos em
  // aspas e dobramos as internas.
  const escapa = t => {
    const s = String(t ?? '').replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };

  const linhas = v.backlog
    .slice()
    .sort((a, b) => (b.aplicacao || '').localeCompare(a.aplicacao || ''))
    .map(b => [
      b.id,
      b.produto,
      b.nome,
      b.cargo,
      b.mql ? 'Sim' : 'Não',
      b.funil,
      b.etapa,
      b.proprietario,
      redeDoLead(b),
      // Virgula decimal pro Excel BR reconhecer como numero
      b.score === null || b.score === undefined
        ? '' : String(b.score).replace('.', ','),
      b.status,
      b.motivoPerda,
      b.dataPerda,
      b.reaplicacao ? 'Sim' : 'Não',
      b.aplicacao,
      // Virgula decimal: assim o Excel BR entende como numero
      String(b.valor || 0).replace('.', ','),
      b.campanha,
      b.source,
    ].map(escapa).join(';'));

  const csv = '\uFEFF' + [cabecalho.join(';'), ...linhas].join('\n');

  const hoje = new Date().toISOString().slice(0, 10);
  const filtro = Object.values(filtros).filter(Boolean).join('-') || 'completa';
  const nome = `base_${produtoAtivo}_${filtro}_${hoje}`
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w-]/g, '_').toLowerCase() + '.csv';

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Base: os leads por tras dos numeros ─────────────────────────────────────
// Respeita todos os filtros ativos, entao serve de drill-down: filtre por
// proprietario e etapa no dashboard, venha aqui e veja exatamente quais
// negocios sao — com o ID abrindo direto no Pipedrive.
function renderBase(v) {
  const leads = v.backlog;

  if (!leads.length) {
    document.getElementById('conteudo').innerHTML = `
      <div class="card"><div class="empty">
        Nenhum lead para os filtros atuais.
      </div></div>`;
    return;
  }

  const mqls  = leads.filter(b => b.mql).length;
  const reapl = leads.filter(b => b.reaplicacao).length;
  const donos = new Set(leads.map(b => b.proprietario || '—')).size;

  // Perdidos DESTA safra: entraram no periodo e ja foram descartados.
  // Diferente da aba Descartes, este numero fecha com o total de leads.
  const perdas    = leads.filter(b => b.status === 'lost');
  const perdidos  = perdas.length;
  const aggMotivo = {};
  for (const b of perdas) {
    const m = (b.motivoPerda || '').trim() || '(sem motivo)';
    aggMotivo[m] = (aggMotivo[m] || 0) + 1;
  }
  const topoMotivos = Object.entries(aggMotivo)
    .sort((a, b) => b[1] - a[1]).slice(0, 8);

  const corta = (t, n) => {
    const s = (t || '').trim();
    if (!s) return '<span style="color:var(--gray)">—</span>';
    return s.length > n ? s.slice(0, n) + '…' : s;

  document.getElementById('conteudo').innerHTML = `

        <div class="kpi-label">Leads na seleção</div>

        <div class="kpi-label">MQL</div>
        <div class="kpi-val blue">${fmtNum(mqls)}</div>

          leads.length ? (mqls / leads.length * 100).toFixed(0) : 0}% da seleção</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Reaplicação</div>
        <div class="kpi-val">${fmtNum(reapl)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Perdidos</div>
        <div class="kpi-val">${fmtNum(perdidos)}</div>
        ${perdidos ? `<div class="kpi-linha"><span>${

      </div>
      <div class="kpi-card">
        <div class="kpi-label">Proprietários</div>
        <div class="kpi-val">${fmtNum(donos)}</div>
      </div>
    </div>

    ${topoMotivos.length ? `
    <div class="card" style="margin-top:16px">
      <div class="card-title">
        Por que a safra do mês foi descartada
        <span class="card-tag">${fmtNum(perdidos)} de ${fmtNum(leads.length)} leads</span>
      </div>
      <div class="card-body">
        <div class="funil">
          ${topoMotivos.map(([nome, qtd]) => `
            <div class="funil-step" style="cursor:default">
              <div class="funil-label" title="${nome}">${nome}</div>
              <div class="funil-track">
                <div class="funil-bar" style="width:${
                  Math.max(qtd / topoMotivos[0][1] * 100, 3)}%;background:#8a4a4a">
                  <span class="funil-val">${fmtNum(qtd)}</span>
                </div>
              </div>

        </div>
      </div>
    </div>` : ''}

    <div class="card" style="margin-top:16px">
      <div class="card-title">
        Leads · clique no ID para abrir no Pipedrive

}

// ── Ganhos: de onde veio cada venda ─────────────────────────────────────────
function renderGanhos(v) {
  // So entram os ganhos validados manualmente na planilha
  let validos = v.ganhos.filter(g => g.vale === 'sim');

  // Busca livre: varre as utms, o nome e o produto de uma vez
  const termo = semAcento(buscaGanhos);
  if (termo) {
    validos = validos.filter(g => [
      g.campanha, g.source, g.medium, g.content, g.term,
      g.nome, g.produto, redeDoLead(g),
    ].some(campo => semAcento(campo).includes(termo)));
  }

  if (!validos.length) {
    const semBusca = v.ganhos.filter(g => g.vale === 'sim').length;
    document.getElementById('conteudo').innerHTML = `
      <div class="card"><div class="empty">
        ${buscaGanhos && semBusca
          ? `Nenhuma venda encontrada para "${buscaGanhos}".<br><br>
             <button class="btn" onclick="buscarGanhos('')">Limpar busca</button>`
          : `Nenhum ganho com "sim" na coluna Vale? no período.<br><br>
             <span style="font-size:11px">A marcação é manual, na aba GANHOS da planilha.</span>`}
      </div></div>`;
    return;
  }

  const total = validos.reduce((s, g) => s + g.valor, 0);
  const ticket = total / validos.length;

  // Agrupa pela utm escolhida no seletor, e sempre por rede
  const rotulos = {
    campanha: 'utm_campaign', source: 'utm_source', medium: 'utm_medium',
    content:  'utm_content',  term:   'utm_term',   produto: 'produto',
  };
  const porChave = {};
  const porRede  = {};
  for (const g of validos) {
    const k = (g[agrupaGanhos] || '').trim() || `(sem ${rotulos[agrupaGanhos]})`;
    if (!porChave[k]) porChave[k] = { qtd: 0, valor: 0, rede: redeDoLead(g) };
    porChave[k].qtd++;
    porChave[k].valor += g.valor;

    const r = redeDoLead(g);
    if (!porRede[r]) porRede[r] = { qtd: 0, valor: 0 };
    porRede[r].qtd++;
    porRede[r].valor += g.valor;
  }

  const campanhas = Object.entries(porChave).sort((a, b) => b[1].valor - a[1].valor);
  const redes     = Object.entries(porRede).sort((a, b) => b[1].valor - a[1].valor);

  document.getElementById('conteudo').innerHTML = `
    <div class="kpi-strip" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi-card">
        <div class="kpi-label">Vendas ${buscaGanhos ? 'na busca' : 'validadas'}</div>
        <div class="kpi-val blue">${fmtNum(validos.length)}</div>
        ${(() => {
          // Quantos negocios da planilha viraram estas linhas. Sem mostrar,
          // quem confere no Pipedrive acha que sumiu venda.
          const neg = validos.reduce((s, g) => s + (g.negocios || 1), 0);
          if (buscaGanhos) {
            return `<div class="kpi-linha"><span>de ${
              fmtNum(v.ganhos.filter(g => g.vale === 'sim').length)} no total</span></div>`;
          }
          return neg > validos.length
            ? `<div class="kpi-linha"><span>${fmtNum(neg)} negócios</span>
                 <span style="color:var(--amber)">−${fmtNum(neg - validos.length)}</span></div>`
            : '';
        })()}
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Faturamento</div>
        <div class="kpi-val">${fmtBRL(total)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Ticket médio</div>
        <div class="kpi-val">${fmtBRL(ticket)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Campanhas</div>
        <div class="kpi-val">${fmtNum(campanhas.length)}</div>
      </div>
    </div>

    <div class="grid-topo">
      <div class="card">
        <div class="card-title">
          Faturamento por ${rotulos[agrupaGanhos]}
          <span class="agrupa-switch">
            ${Object.entries(rotulos).map(([campo, rot]) => `
              <button class="agrupa-btn ${campo === agrupaGanhos ? 'ativo' : ''}"
                      onclick="agruparGanhosPor('${campo}')">${
                rot.replace('utm_', '')}</button>`).join('')}
          </span>
        </div>
        <div class="table-scroll" style="max-height:340px">
          <table>
            <thead><tr>
              <th>${rotulos[agrupaGanhos]}</th><th>Rede</th>
              <th class="num">Vendas</th><th class="num">Faturamento</th><th class="num">%</th>
            </tr></thead>
            <tbody>
              ${campanhas.map(([nome, d]) => `
                <tr>
                  <td title="${nome}">${nome.length > 46 ? nome.slice(0, 46) + '…' : nome}</td>
                  <td style="color:var(--gray-light)">${d.rede}</td>
                  <td class="num">${fmtNum(d.qtd)}</td>
                  <td class="num" style="color:var(--green)">${fmtBRL(d.valor)}</td>
                  <td class="num">${(d.valor / total * 100).toFixed(1)}%</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Faturamento por rede</div>
        <div class="card-body">
          <div class="funil">
            ${redes.map(([nome, d]) => {
              const maior = Math.max(...redes.map(([, x]) => x.valor), 1);
              return `<div class="funil-step" style="cursor:default">
                <div class="funil-label">${nome}</div>
                <div class="funil-track">
                  <div class="funil-bar" style="width:${
                    Math.max(d.valor / maior * 100, 3)}%;background:#3a7ca8">
                    <span class="funil-val">${fmtBRL(d.valor)}</span>
                  </div>
                </div>
                <div class="funil-pct">${fmtNum(d.qtd)}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-title">
        Vendas validadas · rastreio completo
        <span class="busca-wrap">
          <input type="text" id="campoBusca" class="campo-busca"
                 placeholder="filtrar por campanha, criativo, nome..."
                 value="${(buscaGanhos || '').replace(/"/g, '&quot;')}"
                 oninput="buscarGanhos(this.value)">
          ${buscaGanhos ? `<button class="busca-limpar"
                 onclick="buscarGanhos('')" title="limpar">×</button>` : ''}
        </span>
        <span class="card-tag">${fmtNum(validos.length)} negócios</span>
      </div>
      <div class="table-scroll" style="max-height:420px">
        <table class="tabela-utm">
          <thead><tr>
            <th>Data</th><th>Nome</th><th>Produto</th><th class="num">Valor</th>
            <th class="num">Neg.</th><th>Rede</th>
            <th>utm_campaign</th><th>utm_source</th><th>utm_medium</th>
            <th>utm_content</th><th>utm_term</th>
          </tr></thead>
          <tbody>
            ${validos
              .sort((a, b) => paraData(b.data) - paraData(a.data))
              .map(g => {
                // Campanhas sao longas demais pra tabela; o texto inteiro
                // fica no title, visivel ao passar o mouse.
                const corta = (t, n) => {
                  const s = (t || '').trim();
                  if (!s) return '<span style="color:var(--gray)">—</span>';
                  return s.length > n ? s.slice(0, n) + '…' : s;
                };
                return `
                <tr>
                  <td class="num">
                    <a class="link-pipe" href="${URL_PIPEDRIVE}${g.id}"
                       target="_blank" rel="noopener"
                       onclick="rastrear('abrir_pipedrive', '${g.id}')">${g.id}</a>
                  </td>
                  <td>${g.data}</td>
                  <td>${g.nome || '—'}</td>
                  <td style="color:var(--gray-light)">${corta(g.produto, 18)}</td>
                  <td class="num" style="color:var(--green)">${fmtBRL(g.valor)}</td>
                  <td class="num" title="${g.negocios > 1
                    ? 'Negócios somados: ' + (g.ids || []).join(', ')
                    : 'Um negócio'}" style="color:${
                    g.negocios > 1 ? 'var(--amber)' : 'var(--gray)'}">${
                    g.negocios > 1 ? g.negocios : '1'}</td>
                  <td>${redeDoLead(g)}</td>
                  <td class="utm" title="${g.campanha || ''}">${corta(g.campanha, 34)}</td>
                  <td class="utm" title="${g.source || ''}">${corta(g.source, 14)}</td>
                  <td class="utm" title="${g.medium || ''}">${corta(g.medium, 14)}</td>
                  <td class="utm" title="${g.content || ''}">${corta(g.content, 26)}</td>
                  <td class="utm" title="${g.term || ''}">${corta(g.term, 20)}</td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}


// ── Descartes: a safra do periodo que ja morreu ─────────────────────────────
// So entra quem ENTROU e foi DESCARTADO dentro da janela selecionada. Assim o
// numero fecha com o volume de leads do periodo e a taxa de descarte faz
// sentido — se pegasse todo deal perdido no mes, entraria base antiga e o
// total passaria do volume de leads.
function renderDescartes(v) {
  // O seletor Leads/MQL do topo vale aqui tambem: em modo MQL a tela inteira
  // passa a falar so dos descartes que eram MQL.
  const soMql = metrica === 'mqls';
  const termo = semAcento(buscaDescartes);

  // A busca refina o que ja passou pelos filtros das barras — varre nome,
  // cargo, motivo, etapa, dono, campanha e as utms de uma vez.
  const perdas = (v.descartes || [])
    .filter(p => !soMql || p.mql)
    .filter(p => !termo || [
      p.nome, p.cargo, p.motivo, p.etapa, p.funil, p.proprietario,
      p.campanha, p.source, p.medium, p.content, p.term,
      p.nomeProduto, redeDoLead(p), String(p.id),
    ].some(campo => semAcento(campo).includes(termo)));

  // Denominador: comparar descarte de MQL com volume de leads daria uma
  // taxa sem sentido, entao ele acompanha a metrica selecionada.
  const universo = soMql ? v.kpis.mqls : v.kpis.leads;

  if (!perdas.length) {
    document.getElementById('conteudo').innerHTML = `
      <div class="card"><div class="empty">
        ${buscaDescartes
          ? `Nenhum descarte encontrado para "${buscaDescartes}".<br><br>
             <button class="btn" onclick="buscarDescartes('')">Limpar busca</button>`
          : `Nenhum lead entrou e foi descartado dentro do período selecionado.<br><br>
             <span style="font-size:11px">Só entram aqui os leads com data de aplicação
             E data de perda dentro da janela. A aba BACKLOG PERDIDOS é preenchida pelo
             update_all.py — se ela ainda não existe na planilha, rode o script.</span>`}
      </div></div>`;
    return;
  }

  const mqls   = perdas.filter(p => p.mql).length;
  const valor  = perdas.reduce((s, p) => s + (p.valor || 0), 0);
  const donos  = new Set(perdas.map(p => p.proprietario || '—')).size;

  // Agrupa por um campo qualquer e devolve ordenado do maior pro menor
  const agrupar = (chave) => {
    const agg = {};
    for (const p of perdas) {
      const k = chave(p);
      if (!agg[k]) agg[k] = { qtd: 0, mqls: 0 };
      agg[k].qtd++;
      if (p.mql) agg[k].mqls++;
    }
    return Object.entries(agg).sort((a, b) => b[1].qtd - a[1].qtd);
  };

  // Motivo em branco vira rotulo proprio: saber o tamanho do "sem motivo"
  // e' o que diz se da pra confiar no ranking dos outros.
  const motivos = agrupar(p => (p.motivo || '').trim() || '(sem motivo)');
  const etapas  = agrupar(p => (p.etapa || '').trim() || '—');
  const redes   = agrupar(p => redeDoLead(p));
  const donosLt = agrupar(p => p.proprietario || '—');

  const semMotivo = motivos.find(([n]) => n === '(sem motivo)');
  const pctSem = semMotivo ? (semMotivo[1].qtd / perdas.length * 100) : 0;

  // Barras horizontais clicaveis: cada uma liga o filtro da sua dimensao,
  // e o clique de novo desliga. Mesmo comportamento do funil do dashboard.
  const barras = (lista, cor, tipo, limite) => {
    let itens = lista;
    let resto = null;
    if (limite && itens.length > limite) {
      const corta = itens.slice(limite);
      resto = { qtd: corta.reduce((s, [, d]) => s + d.qtd, 0), n: corta.length };
      itens = itens.slice(0, limite);
    }
    const maior = Math.max(...itens.map(([, d]) => d.qtd), 1);
    return '<div class="funil">' + itens.map(([nome, d]) => {
      const sel = filtros[tipo] === nome;
      return `
      <div class="funil-step ${sel ? 'selecionado' : ''}"
           onclick="toggleFiltro('${tipo}', ${attr(nome)})">
        <div class="funil-label" title="${nome}">${nome}</div>
        <div class="funil-track">
          <div class="funil-bar" style="width:${
            Math.max(d.qtd / maior * 100, 3)}%;background:${sel ? 'var(--amber)' : cor}">
            <span class="funil-val">${fmtNum(d.qtd)}</span>
          </div>
        </div>
        <div class="funil-pct" title="${fmtNum(d.mqls)} eram MQL">${
          (d.qtd / perdas.length * 100).toFixed(0)}%</div>
      </div>`;
    }).join('') + (resto ? `
      <div class="funil-step" style="opacity:.55;cursor:default">
        <div class="funil-label">+${resto.n} outros</div>
        <div class="funil-track">
          <div class="funil-bar" style="width:${
            Math.max(resto.qtd / maior * 100, 3)}%;background:#3a4a55">
            <span class="funil-val">${fmtNum(resto.qtd)}</span>
          </div>
        </div>
        <div class="funil-pct"></div>
      </div>` : '') + '</div>';
  };

  const corta = (t, n) => {
    const s = (t || '').trim();
    if (!s) return '<span style="color:var(--gray)">—</span>';
    return s.length > n ? s.slice(0, n) + '…' : s;
  };

  document.getElementById('conteudo').innerHTML = `
    <div class="kpi-strip" style="grid-template-columns:repeat(5,1fr)">
      <div class="kpi-card">
        <div class="kpi-label">${soMql ? 'MQL descartados' : 'Descartes no período'}</div>
        <div class="kpi-val blue">${fmtNum(perdas.length)}</div>
        <div class="kpi-linha"><span>de ${fmtNum(universo)} ${
          soMql ? 'MQL' : 'leads'}</span>
          <span style="color:var(--amber)">${
            universo ? (perdas.length / universo * 100).toFixed(1) : 0}%</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">${soMql ? 'Ticket médio' : 'MQL descartados'}</div>
        <div class="kpi-val blue">${
          soMql ? fmtBRL(valor / perdas.length) : fmtNum(mqls)}</div>
        ${soMql
          ? `<div class="kpi-linha"><span>por MQL descartado</span></div>`
          : `<div class="kpi-linha"><span>de ${fmtNum(v.kpis.mqls)} MQL</span>
               <span style="color:var(--amber)">${

// ── Exportar os descartes filtrados em CSV ──────────────────────────────────
// Mesmo formato do CSV da Base: ; como separador e BOM, pro Excel BR abrir
// sem acento quebrado.
function exportarDescartesCSV() {
  const v = dadosVisiveis();
  // Exporta o que esta na tela — inclusive o recorte do seletor Leads/MQL
  const termoCsv = semAcento(buscaDescartes);
  const linhasFonte = (v ? v.descartes || [] : [])
    .filter(p => metrica !== 'mqls' || p.mql)
    .filter(p => !termoCsv || [
      p.nome, p.cargo, p.motivo, p.etapa, p.funil, p.proprietario,
      p.campanha, p.source, p.medium, p.content, p.term,
      p.nomeProduto, redeDoLead(p), String(p.id),
    ].some(campo => semAcento(campo).includes(termoCsv)));
  if (!linhasFonte.length) return;

  rastrear('exportar_descartes', `${linhasFonte.length} descartes`);

  const cabecalho = [
    'ID', 'Produto', 'Nome', 'Cargo', 'MQL', 'Funil', 'Etapa',
    'Proprietário', 'Rede', 'Data Perda', 'Motivo', 'Valor',
    'Última Aplicação', 'utm_campaign', 'utm_source',
  ];

  const escapa = t => {
    const s = String(t ?? '').replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };

  const linhas = linhasFonte.map(p => [
    p.id, p.produto, p.nome, p.cargo,
    p.mql ? 'Sim' : 'Não',
    p.funil, p.etapa, p.proprietario,
    redeDoLead(p),
    p.dataPerda,
    p.motivo,
    String(p.valor || 0).replace('.', ','),
    p.aplicacao, p.campanha, p.source,
  ].map(escapa).join(';'));

  const csv = '\uFEFF' + [cabecalho.join(';'), ...linhas].join('\n');

  const hoje = new Date().toISOString().slice(0, 10);
  const filtro = Object.values(filtros).filter(Boolean).join('-') || 'completa';
  const nome = `descartes_${produtoAtivo}_${filtro}_${hoje}`
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w-]/g, '_').toLowerCase() + '.csv';

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Campanhas: investimento x resultado, no nivel escolhido ─────────────────
// O investimento vem das abas de midia (uma linha por dia/campanha/conjunto/
// anuncio) e os leads vem do backlog pelas utms. O casamento e' por TEXTO:
//   Campaign Name  <->  utm_campaign
//   Ad Set Name    <->  utm_medium
//   Ad Name        <->  utm_content
//
// Normalizamos os dois lados (minusculas, sem acento, espaco colapsado)
// porque a utm quase nunca sai identica ao nome cadastrado na plataforma.
// Ainda assim sobra divergencia — por isso a tela mostra quanto do
// investimento e quantos leads NAO casaram, em vez de esconder.
const chaveCamp = s => (s || '').toString().toLowerCase().trim()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\s+/g, ' ');

// O Google e' o caso especial: a utm_campaign do lead vem como ID numerico
// ("23874401647"), enquanto a planilha de investimento tem o ID numa coluna
// e o nome legivel em outra. Entao a CHAVE do cruzamento e o ROTULO exibido
// sao coisas diferentes — juntar os dois num campo so faria o investimento
// (que casa por nome) nunca encontrar os leads (que casam por ID).
const soDigitos = s => /^\d{6,}$/.test(String(s || '').trim());

function dadosCampanhas(v) {
  const nomes = produtoAtivo === CONSOLIDADO ? PRODUTOS_REAIS : [produtoAtivo];

  // Qual utm corresponde ao nivel escolhido
  const campoUtm = { campanha: 'campanha', conjunto: 'medium', anuncio: 'content' }[nivelCampanha];

  const agg = {};
  // rotulo so e' gravado na primeira vez; quem chega depois nao sobrescreve.
  // Excecao: um nome de verdade substitui um rotulo que era so o ID, pra
  // tabela mostrar "[TD][PJ][GA]..." em vez de "750051931311".
  const pega = (k, rotulo, rede) => {
    if (!agg[k]) {
      agg[k] = {
        chave: k, rotulo, rede: rede || '', investimento: 0,
        leads: 0, mqls: 0, ganhos: 0, faturamento: 0,
        // Quebra diaria, montada junto com os totais: e' o que o
        // drill-down desenha. Calcular de novo depois seria repetir toda
        // a logica de chave (ID do Google vs nome) e abrir espaco pros
        // dois lados divergirem.
        porDia: {},
      };
    } else if (soDigitos(agg[k].rotulo) && rotulo && !soDigitos(rotulo)) {
      agg[k].rotulo = rotulo;
    }
    return agg[k];
  };

  // Acumula no dia certo dentro de uma linha da tabela
  const noDia = (d, dia) => {
    if (!d.porDia[dia]) d.porDia[dia] = { inv: 0, leads: 0, mqls: 0 };
    return d.porDia[dia];
  };

  // ── Investimento ────────────────────────────────────────────────────
  let investSemNome = 0;
  for (const nome of nomes) {
    const p = dados.produtos[nome];
    if (!p || !p.investLinhas) continue;
    for (const l of p.investLinhas) {
      if (!dentroDoPeriodo(l.data)) continue;
      if (filtros.rede && filtros.rede !== l.rede) continue;

      const rotulo = (l[nivelCampanha] || '').trim();
      // No nivel campanha, o ID manda na chave quando existe — e' ele que
      // aparece na utm do lead. O nome fica so como rotulo.
      const usaId = nivelCampanha === 'campanha' && l.idCampanha;
      const k = usaId ? l.idCampanha : chaveCamp(rotulo);

      if (!k) { investSemNome += l.valor; continue; }
      const d = pega(k, rotulo || l.idCampanha, l.rede);
      d.investimento += l.valor;
      noDia(d, l.data).inv += l.valor;
    }
  }

  // ── Leads e MQL ─────────────────────────────────────────────────────
  const alvos = nomes.map(semAcento);
  let leadsSemCasar = 0;
  let base = dados.backlog
    .filter(b => alvos.includes(semAcento(b.produto)))
    .filter(b => {
      const dia = (b.aplicacao || '').trim().slice(0, 5);
      return dia.includes('/') && dentroDoPeriodo(dia);
    });
  if (filtros.rede) base = base.filter(b => redeDoLead(b) === filtros.rede);

  for (const b of base) {
    const rotulo = (b[campoUtm] || '').trim();
    if (!rotulo) { leadsSemCasar++; continue; }
    // utm numerica = campanha do Google; casa com o ID da planilha
    const k = (nivelCampanha === 'campanha' && soDigitos(rotulo))
      ? rotulo.trim() : chaveCamp(rotulo);
    // Linha sem investimento tambem entra: campanha organica ou utm que
    // nao bate com o nome da plataforma precisa aparecer, nem que seja
    // com investimento zero
    const d = pega(k, rotulo, redeDoLead(b));
    d.leads++;
    if (b.mql) d.mqls++;

    const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
    if (dia.includes('/')) {
      const nd = noDia(d, dia);
      nd.leads++;
      if (b.mql) nd.mqls++;
    }
  }

  // ── Ganhos ──────────────────────────────────────────────────────────
  const campoGanho = { campanha: 'campanha', conjunto: 'medium', anuncio: 'content' }[nivelCampanha];
  for (const nome of nomes) {
    const p = dados.produtos[nome];
    if (!p) continue;
    for (const g of p.ganhos) {
      if (g.vale !== 'sim' || !dentroDoPeriodo(g.data)) continue;
      if (filtros.rede && redeDoLead(g) !== filtros.rede) continue;
      const rotulo = (g[campoGanho] || '').trim();
      if (!rotulo) continue;
      const k = (nivelCampanha === 'campanha' && soDigitos(rotulo))
        ? rotulo.trim() : chaveCamp(rotulo);
      const d = pega(k, rotulo, redeDoLead(g));
      d.ganhos++;
      d.faturamento += g.valor;
    }
  }

  // ── Derivadas ───────────────────────────────────────────────────────
  let linhas = Object.values(agg).map(d => ({
    ...d,
    // null onde nao da pra calcular: barra em vez de R$ 0, que enganaria
    cpl:   d.investimento && d.leads ? d.investimento / d.leads : null,
    cpmql: d.investimento && d.mqls  ? d.investimento / d.mqls  : null,
    cac:   d.investimento && d.ganhos ? d.investimento / d.ganhos : null,
    roas:  d.investimento ? d.faturamento / d.investimento : null,
    txMql: d.leads ? d.mqls / d.leads * 100 : null,
  }));

  const termo = chaveCamp(buscaCampanha);
  if (termo) linhas = linhas.filter(l => chaveCamp(l.rotulo).includes(termo));

  const sinal = ordemCampDir === 'asc' ? 1 : -1;
  linhas.sort((a, b) => {
    const x = a[ordemCampCol], y = b[ordemCampCol];
    // Sem valor sempre no fim, independente do sentido
    if (x === null && y === null) return 0;
    if (x === null) return 1;
    if (y === null) return -1;
    if (typeof x === 'string') return sinal * x.localeCompare(y);
    return sinal * (x - y);
  });

  return { linhas, investSemNome, leadsSemCasar };
}

function renderCampanhas(v) {
  const { linhas, investSemNome, leadsSemCasar } = dadosCampanhas(v);

  const totais = linhas.reduce((s, l) => ({
    investimento: s.investimento + l.investimento,
    leads: s.leads + l.leads,
    mqls: s.mqls + l.mqls,
    ganhos: s.ganhos + l.ganhos,
    faturamento: s.faturamento + l.faturamento,
  }), { investimento: 0, leads: 0, mqls: 0, ganhos: 0, faturamento: 0 });

  // O investimento dos CARDS vem das colunas fixas da planilha, sem filtro
  // de pais nem exclusao de workshop. Esta tabela usa a leitura detalhada,
  // que aplica os dois. A diferenca e' esperada — mas se ninguem mostrar,
  // alguem vai comparar os dois numeros e achar que um esta quebrado.
  const totalCards = v.kpis.investimento;
  const diferenca  = totalCards - totais.investimento;

  const rotuloNivel = { campanha: 'Campanha', conjunto: 'Conjunto', anuncio: 'Anúncio' }[nivelCampanha];

  const seletor = ['campanha', 'conjunto', 'anuncio'].map(n => `
    <button class="agrupa-btn ${n === nivelCampanha ? 'ativo' : ''}"
            onclick="trocarNivelCampanha('${n}')">${
      n === 'anuncio' ? 'anúncio' : n}</button>`).join('');

  // Seletor de rede: e' o mesmo filtros.rede do dashboard, entao a escolha
  // continua valendo ao voltar pras outras abas. "Todas" limpa o filtro.
  const seletorRede = `
    <button class="agrupa-btn ${!filtros.rede ? 'ativo' : ''}"
            onclick="filtrarRedeCampanha(null)">todas</button>`
    + REDES.map(r => `
    <button class="agrupa-btn ${filtros.rede === r ? 'ativo' : ''}"
            onclick="filtrarRedeCampanha(${attr(r)})">${r}</button>`).join('');

  if (!linhas.length) {
    document.getElementById('conteudo').innerHTML = `
    <div class="aviso-validacao">
      <span class="icone">⚠</span>
      <span class="texto">
        <span class="titulo">Em validação — não use para reportar</span>
        Esta aba cruza o investimento das plataformas com as utms dos leads.
        O casamento é por texto, então campanha com utm divergente aparece
        sem lead — e o número fica menor que o real. Os cards do dashboard
        seguem sendo a fonte oficial de investimento. Confira na planilha
        antes de levar qualquer número daqui para apresentação.
      </span>
    </div>
      <div class="card">
        <div class="card-title">
          Campanhas
          <span class="agrupa-switch">${seletor}</span>
          <span class="agrupa-switch">${seletorRede}</span>
        </div>
        <div class="empty">
          ${buscaCampanha
            ? `Nada encontrado para "${buscaCampanha}".<br><br>
               <button class="btn" onclick="buscarCampanha('')">Limpar busca</button>`
            : `Sem dados de ${rotuloNivel.toLowerCase()} no período.<br><br>
               <span style="font-size:11px">As abas de INVESTIMENTO precisam ter as colunas
               Campaign Name, Ad Set Name e Ad Name — o dashboard as encontra pelo cabeçalho.</span>`}
        </div>
      </div>`;
    return;
  }

  // A linha aberta pode ter sumido: o usuario trocou de nivel, filtrou por
  // outra rede ou digitou na busca. Nesse caso o card simplesmente nao
  // aparece, e o clique seguinte reabre.
  const aberta = campanhaAberta
    ? linhas.find(l => l.chave === campanhaAberta) : null;

  // Cabecalho ordenavel
  const col = (campo, texto, classe) => {
    const ativa = ordemCampCol === campo;
    const seta = ordemCampDir === 'asc' ? ' ↑' : ' ↓';
    return `<th class="${classe || ''} ordenavel ${ativa ? 'ativa' : ''}"
              onclick="ordenarCampanha('${campo}')">${texto}${ativa ? seta : ''}</th>`;
  };

  const num = (val, fmt) => val === null
    ? '<span style="color:var(--gray)">—</span>' : fmt(val);

  document.getElementById('conteudo').innerHTML = `
    <div class="aviso-validacao">
      <span class="icone">⚠</span>
      <span class="texto">
        <span class="titulo">Em validação — não use para reportar</span>
        Esta aba cruza o investimento das plataformas com as utms dos leads.
        O casamento é por texto, então campanha com utm divergente aparece
        sem lead — e o número fica menor que o real. Os cards do dashboard
        seguem sendo a fonte oficial de investimento. Confira na planilha
        antes de levar qualquer número daqui para apresentação.
      </span>

    <div class="kpi-strip" style="grid-template-columns:repeat(6,1fr)">
      <div class="kpi-card">
        <div class="kpi-label">${rotuloNivel}s</div>
        <div class="kpi-val blue">${fmtNum(linhas.length)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Investimento</div>
        <div class="kpi-val">${fmtBRL(totais.investimento)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Leads</div>
        <div class="kpi-val blue">${fmtNum(totais.leads)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">MQL</div>
        <div class="kpi-val blue">${fmtNum(totais.mqls)}</div>
        <div class="kpi-linha"><span>${
          totais.leads ? (totais.mqls / totais.leads * 100).toFixed(0) : 0}% dos leads</span></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Vol. Ganhos</div>
        <div class="kpi-val">${fmtNum(totais.ganhos)}</div>
      </div>
      <div class="kpi-card">

        <div class="kpi-linha"><span>ROAS</span><span>${
          totais.investimento
            ? fmtRoas(totais.faturamento / totais.investimento) : '—'}</span></div>
      </div>
    </div>

    ${(investSemNome || leadsSemCasar || Math.abs(diferenca) > 1) ? `
    <div class="card" style="margin-top:16px">
      ${Math.abs(diferenca) > 1 ? `
      <div class="calor-nota" style="color:var(--gray-light)">
        Os cards do dashboard somam ${fmtBRL(totalCards)} neste período —
        ${fmtBRL(Math.abs(diferenca))} ${diferenca > 0 ? 'a mais' : 'a menos'} que esta tabela.
        Não é erro: os cards leem a coluna de valor da planilha inteira, enquanto
        aqui saem as campanhas de outro país e as que não são de aquisição
        (workshop, summit, pesquisa e afins).
      </div>` : ''}
      ${(investSemNome || leadsSemCasar) ? `
      <div class="calor-nota" style="color:var(--amber)">
        ⚠ ${investSemNome ? fmtBRL(investSemNome) + ' de investimento sem '

              + rotuloNivel.toLowerCase() : ''}
        — estes ficam fora da tabela.
      </div>` : ''}
    </div>` : ''}

    ${aberta ? `
    <div class="card" style="margin-top:16px;border-color:var(--blue)">

        <span title="${aberta.rotulo}">${
          aberta.rotulo.length > 70 ? aberta.rotulo.slice(0, 70) + '…' : aberta.rotulo}</span>

          ${buscaCampanha ? `<button class="busca-limpar"
                 onclick="buscarCampanha('')" title="limpar">×</button>` : ''}
        </span>
        <span style="display:flex;align-items:center;gap:10px">
          <span class="card-tag">${fmtNum(linhas.length)} linhas${
            filtros.rede ? ' · ' + filtros.rede : ''}</span>
          <button class="btn-mini" onclick="exportarCampanhasCSV()">↓ CSV</button>
        </span>
      </div>
      <div class="table-scroll" style="max-height:620px">
        <table class="tabela-utm">
          <thead><tr>
            ${col('rotulo', rotuloNivel)}
            <th>Rede</th>
            ${col('investimento', 'Investimento', 'num')}
            ${col('leads', 'Leads', 'num')}
            ${col('mqls', 'MQL', 'num')}
            ${col('txMql', 'Tx MQL', 'num')}
            ${col('cpl', 'CPL', 'num')}
            ${col('cpmql', 'CPMQL', 'num')}
            ${col('ganhos', 'Vol. Ganhos', 'num')}
            ${col('faturamento', 'Ganhos', 'num')}
            ${col('cac', 'CAC', 'num')}
