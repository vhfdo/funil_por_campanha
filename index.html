<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral — Board Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --panel:#111; --panel2:#1a1a1a; --border:#222;
    --blue:#4a9eed; --gray:#666; --gray-light:#999; --white:#f0f0f0;
    --amber:#d9a441; --red:#c0392b; --green:#4ade80;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1500px;margin:0 auto;padding:26px 22px 50px;}

  /* ── Cabeçalho ── */
  .header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--blue);padding-bottom:20px;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4vw,52px);line-height:1;}
  .eyebrow{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);
    letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;}
  .header-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    padding:9px 18px;border:1px solid var(--blue);background:transparent;color:var(--blue);
    cursor:pointer;transition:all .15s;}
  .btn:hover{background:var(--blue);color:var(--bg);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .user-info{font-family:'DM Mono',monospace;font-size:11px;color:var(--white);
    text-transform:uppercase;letter-spacing:.06em;}

  .metrica-switch{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);}
  .metrica-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 16px;background:var(--panel);color:var(--white);
    border:none;cursor:pointer;transition:all .12s;}
  .metrica-btn:hover{color:var(--gray-light);}
  .metrica-btn.active{background:var(--blue);color:var(--bg);}

  .date-range{display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border);padding:8px 14px;}
  .date-range:focus-within{border-color:var(--blue);}
  .date-label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--white);}
  .date-sep{font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);padding:0 4px;}
  .date-input{font-family:'DM Mono',monospace;font-size:12px;background:transparent;
    border:none;color:var(--white);outline:none;cursor:pointer;width:118px;}
  .date-input::-webkit-calendar-picker-indicator{
    filter:invert(.4) sepia(1) saturate(3) hue-rotate(190deg);cursor:pointer;opacity:.7;}

  /* ── Abas de produto ── */
  .produtos{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:8px;}
  .produto-tab{flex:1;background:var(--panel);padding:14px 12px;cursor:pointer;
    transition:background .12s;border-bottom:2px solid transparent;text-align:center;}
  .produto-tab:hover{background:var(--panel2);}
  .produto-tab.active{background:var(--panel2);border-bottom-color:var(--blue);}
  .produto-tab .nome{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--white);}
  .produto-tab.active .nome{color:var(--blue);}
  .produto-tab.consolidado{border-right:1px solid var(--blue);}
  .produto-tab.consolidado .nome{color:var(--amber);}
  .produto-tab.consolidado.active .nome{color:var(--blue);}
  .produto-tab .mini{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-top:4px;color:var(--white);}

  .status-bar{font-family:'DM Mono',monospace;font-size:11px;color:var(--white);
    margin-bottom:24px;min-height:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .filtro-ativo{color:var(--amber);cursor:pointer;}
  .filtro-ativo:hover{text-decoration:underline;}

  /* ── KPIs ── */
  .kpi-strip{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
  .kpi-card{background:var(--panel);padding:13px 12px;}
  .kpi-label{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--white);margin-bottom:8px;}
  .kpi-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--white);}
  .kpi-val.blue{color:var(--blue);}
  .kpi-linha{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;
    font-size:9.5px;color:var(--white);margin-top:5px;}
  .kpi-linha span:last-child{color:var(--white);}
  .kpi-barra{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:7px;}
  .kpi-barra div{height:100%;border-radius:2px;}
  @media(max-width:1200px){.kpi-strip{grid-template-columns:repeat(5,1fr);}}
  @media(max-width:700px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}

  /* ── Grid principal ── */
  .grid-topo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid-meio{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .grid-base{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;}
  @media(max-width:1300px){ .grid-meio{grid-template-columns:1fr 1fr;} }
  @media(max-width:1100px){
    .grid-topo,.grid-base{grid-template-columns:1fr;}
  }
  @media(max-width:700px){ .grid-meio{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--border);padding:16px 18px;
    display:flex;flex-direction:column;min-width:0;}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.04em;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;
    flex-shrink:0;}
  .card-tag{font-family:'DM Mono',monospace;font-size:9px;background:var(--blue);
    color:var(--bg);padding:2px 6px;letter-spacing:.06em;white-space:nowrap;}
  .card-body{flex:1;min-height:0;overflow:auto;}
  .chart-box{position:relative;height:190px;flex-shrink:0;}
  .chart-box.baixo{height:230px;}

  /* ── Cards de rede ── */
  .redes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:900px){.redes-grid{grid-template-columns:1fr;}}
  .rede-card{background:var(--panel);border:1px solid var(--border);padding:14px 16px;
    cursor:pointer;transition:border-color .12s,background .12s;}
  .rede-card:hover{background:var(--panel2);}
  .rede-card.ativo{background:var(--panel2);}
  .rede-card.vazio{cursor:default;opacity:.5;}
  .rede-topo{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border);}
  .rede-nome{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.04em;}
  .rede-inv{font-family:'DM Mono',monospace;font-size:12px;color:var(--white);}
  .rede-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px;}
  .rede-nums div{display:flex;flex-direction:column;gap:2px;}
  .rede-nums span{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--white);
    text-transform:uppercase;letter-spacing:.06em;}
  .rede-nums strong{font-family:'DM Mono',monospace;font-size:12.5px;
    font-weight:500;color:var(--white);}
  .rede-barra{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
  .rede-barra div{height:100%;border-radius:2px;}

  /* ── Tabela ── */
  table{width:100%;border-collapse:collapse;font-size:11px;}
  th{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--white);padding:7px 8px;border-bottom:2px solid var(--blue);text-align:left;
    white-space:nowrap;position:sticky;top:0;background:var(--panel);}
  th.num{text-align:right;}
  th.ordenavel{cursor:pointer;user-select:none;}
  th.ordenavel:hover{color:var(--blue);}
  th.ordenavel.ativa{color:var(--blue);}
  td{padding:7px 8px;border-bottom:1px solid var(--border);}
  td.num{text-align:right;font-family:'DM Mono',monospace;font-size:10px;}
  tr.clicavel{cursor:pointer;}
  tr.clicavel:hover td{background:var(--panel2);}
  tr.selecionado td{background:#16283d;}
  .table-scroll{overflow:auto;max-height:230px;}
  .table-scroll::-webkit-scrollbar,
  .card-body::-webkit-scrollbar{width:6px;}
  .table-scroll::-webkit-scrollbar-track,
  .card-body::-webkit-scrollbar-track{background:var(--bg);}
  .table-scroll::-webkit-scrollbar-thumb,
  .card-body::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
  .table-scroll::-webkit-scrollbar-thumb:hover,
  .card-body::-webkit-scrollbar-thumb:hover{background:#444;}

  /* ── Funil ── */
  .funil{display:flex;flex-direction:column;gap:2px;}
  .funil-step{display:grid;grid-template-columns:118px 1fr 42px;align-items:center;gap:8px;
    cursor:pointer;}
  .funil-step:hover .funil-bar{filter:brightness(1.25);}
  .funil-step.selecionado .funil-label{color:var(--amber);}
  .funil-label{font-size:10.5px;color:var(--white);text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .funil-track{height:17px;background:var(--border);border-radius:2px;overflow:hidden;}
  .funil-bar{height:100%;border-radius:2px;display:flex;align-items:center;
    justify-content:flex-end;padding-right:6px;min-width:22px;transition:filter .12s;}
  .funil-val{font-family:'DM Mono',monospace;font-size:10px;color:#fff;font-weight:500;}
  .funil-pct{font-family:'DM Mono',monospace;font-size:9px;color:var(--white);text-align:right;}

  /* ── Taxas ── */
  .taxas{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
  .taxa{background:var(--panel);padding:12px;text-align:center;}
  .taxa-nome{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--white);margin-bottom:5px;}
  .taxa-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blue);}
  .taxa-detalhe{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--gray);
    margin-top:4px;}
  @media(max-width:700px){.taxas{grid-template-columns:repeat(2,1fr);}}


  /* ── Impressão / PDF ────────────────────────────────────────────────── */
  .print-header{display:none;}

  @media print{
    /* Sem isso o navegador descarta os fundos escuros e o dash sai branco */
    *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}

    @page{ size:A4 landscape; margin:10mm; }

    body{background:var(--bg);}
    .wrap{max-width:100%;padding:0;}

    /* Controles nao fazem sentido no papel */
    .header, .produtos, .status-bar, .btn, .metrica-switch, .date-range{display:none !important;}
    .card-tag{display:none;}

    .print-header{
      display:flex;justify-content:space-between;align-items:flex-end;
      border-bottom:2px solid var(--blue);padding-bottom:10px;margin-bottom:14px;}
    .print-marca{font-family:'DM Mono',monospace;font-size:9px;color:var(--blue);
      letter-spacing:.15em;text-transform:uppercase;}
    .print-titulo h2{font-family:'Bebas Neue',sans-serif;font-size:30px;
      line-height:1;margin-top:3px;}
    .print-meta{font-family:'DM Mono',monospace;font-size:9px;color:var(--gray-light);
      text-align:right;line-height:1.7;}

    /* Cartoes nao podem ser cortados no meio da pagina */
    .card, .rede-card, .taxa, .kpi-card{break-inside:avoid; page-break-inside:avoid;}
    .kpi-strip, .redes-grid, .grid-topo, .grid-meio, .taxas{break-inside:avoid;}

    /* Um pouco mais compacto pra caber melhor na folha */
    .kpi-val{font-size:22px;}
    .chart-box{height:150px;}
    .chart-box.baixo{height:130px;}
    .table-scroll{max-height:none;overflow:visible;}
    .card-body{max-height:none !important;overflow:visible;}

    .grid-topo{page-break-before:auto;}
  }

  .empty{text-align:center;padding:40px 20px;color:var(--gray);
    font-family:'DM Mono',monospace;font-size:12px;}
  .loading{text-align:center;padding:80px 20px;color:var(--gray);
    font-family:'DM Mono',monospace;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="eyebrow">Board Academy · Marketing · Visão Geral</div>
      <h1>PERFORMANCE</h1>
    </div>
    <div class="header-right">
      <div class="metrica-switch">
        <button class="metrica-btn active" data-metrica="leads"
                onclick="trocarMetrica('leads')">Leads</button>
        <button class="metrica-btn" data-metrica="mqls"
                onclick="trocarMetrica('mqls')">MQL</button>
      </div>
      <div class="date-range">
        <span class="date-label">De</span>
        <input type="date" class="date-input" id="dataInicio">
        <span class="date-sep">→</span>
        <span class="date-label">Até</span>
        <input type="date" class="date-input" id="dataFim">
      </div>
      <button class="btn" id="btnAtualizar" onclick="carregar()">⟳ Atualizar</button>
      <button class="btn" onclick="exportarPDF()">↓ PDF</button>
      <span class="user-info" id="userInfo"></span>
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="print-header" id="printHeader"></div>

  <div class="produtos" id="produtoTabs"></div>

  <div class="status-bar">
    <span id="statusTexto">Carregando dados…</span>
    <span class="filtro-ativo" id="filtroAtivo" onclick="limparFiltros()"></span>
  </div>

  <div id="conteudo">
    <div class="loading">Buscando dados da planilha…</div>
  </div>

</div>

<script>
// ── Sessão ──────────────────────────────────────────────────────────────────
const SESSION_TOKEN = sessionStorage.getItem('funil_token');
if (!SESSION_TOKEN) window.location.href = '/login.html';
document.getElementById('userInfo').textContent = sessionStorage.getItem('funil_user') || '';

// Usa a impressao do navegador: o usuario escolhe "Salvar como PDF".
// Sem biblioteca externa, e os graficos saem em vetor no lugar de foto.
function exportarPDF() {
  // O Chart.js reage a mudanca de layout e as vezes limpa o canvas no meio
  // da impressao. Desligamos o resize automatico enquanto a janela esta aberta.
  Object.values(charts).forEach(c => { if (c) c.options.responsive = false; });
  const ini = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const br  = d => d ? d.split('-').reverse().join('/') : '';

  document.getElementById('printHeader').innerHTML = `
    <div class="print-titulo">
      <span class="print-marca">Board Academy · Marketing</span>
      <h2>${produtoAtivo}</h2>
    </div>
    <div class="print-meta">
      <div>Período: ${br(ini)} a ${br(fim)}</div>
      <div>Métrica: ${rotuloMetrica()}</div>
      <div>Gerado em ${new Date().toLocaleString('pt-BR')}</div>
    </div>`;

  window.print();

  // Devolve o comportamento normal depois que o dialogo fecha
  setTimeout(() => {
    Object.values(charts).forEach(c => {
      if (c) { c.options.responsive = true; c.resize(); }
    });
  }, 800);
}

function logout() {
  sessionStorage.removeItem('funil_token');
  sessionStorage.removeItem('funil_user');
  window.location.href = '/login.html';
}

// ── Estado ──────────────────────────────────────────────────────────────────
const CONSOLIDADO = 'CONSOLIDADO';

// Os tres funis de venda direta. Ganham barra propria no grafico principal.
const FUNIS_PRINCIPAIS = ['SNIPER', 'ELITE', 'OLYMPUS'];
const PRODUTOS_REAIS = ['PFCC BRASIL', 'PFCC MÉXICO', 'PFCC CHILE', 'LEAN', 'CES'];
const ORDEM_PRODUTOS = [CONSOLIDADO, ...PRODUTOS_REAIS];

// Metas do mes. Deixe null no que ainda nao tem meta definida — o card
// simplesmente nao mostra a linha de meta nesse caso.
// Metas do mes. Deixe null no que ainda nao tem meta — o card simplesmente
// nao mostra a linha, e o grafico nao desenha a linha de ritmo.
const METAS = {
  [CONSOLIDADO]:  { leads: 5894, mqls: null, faturamento: null,
                    vendas: null, cac: null, roas: null, cpmql: null },
  'PFCC BRASIL':  { leads: null, mqls: 3303, faturamento: 1310000,
                    vendas: 73,  cac: 4479, roas: 3,   cpmql: 99 },
  'PFCC MÉXICO':  { leads: null, mqls: null, faturamento: null,
                    vendas: null, cac: null, roas: null, cpmql: null },
  'PFCC CHILE':   { leads: null, mqls: null, faturamento: null,
                    vendas: null, cac: null, roas: null, cpmql: null },
  'LEAN':         { leads: null, mqls: null, faturamento: null,
                    vendas: null, cac: null, roas: null, cpmql: null },
  'CES':          { leads: null, mqls: null, faturamento: null,
                    vendas: null, cac: null, roas: null, cpmql: null },
};
const CORES_REDE = { Meta: '#4a6dd4', Google: '#2980b9', LinkedIn: '#0e76a8' };

// Ordem em que as etapas aparecem no funil. O que não estiver aqui vai pro fim.
// Etapas que existem no Pipedrive mas nao fazem parte do funil de venda.
// Ficam de fora do card e nao entram no calculo do percentual.
const ETAPAS_IGNORADAS = ['reabertura'];

// Etapas que significam "houve conexao com o lead" — base da taxa de conexao.
// Comparadas sem acento, entao 'validacao' pega 'VALIDAÇÃO DE REUNIÃO'.
const ETAPAS_CONECTADAS = [
  'contatado', 'oportunidade', 'agendados', 'no show', 'noshow',
  'validacao', 'negociacao', 'inscricao',
];

// Ordem real do processo. Contatado vem depois das Etapas 1-3, nao logo
// apos a Aplicacao — as etapas numeradas sao as tentativas de contato.
const ORDEM_ETAPAS = [
  'aplicacao', 'em agendamento',
  'etapa 1', 'etapa 2', 'etapa 3',
  'contatado', 'oportunidade', 'proposta',
  'agendados', 'no show', 'validacao de reuniao', 'reuniao',
  'em negociacao', 'negociacao', 'inscricao em andamento', 'futuro'
];

// Fontes que nao sao midia paga: evento, hotseat, summit. Entram no volume
// de leads mas ficam fora do rateio por rede, senao poluem o CPL.
const FONTES_FORA = ['summit', 'hotseat', 'workshop', 'evento'];

// Descobre a rede de um lead pela utm_source (valores reais do Pipedrive:
// FBads, LKDNAds, googleads) com a utm_campaign como reforco.
function redeDoLead(b) {
  const s = (b.source || '').toLowerCase().trim();
  const c = (b.campanha || '').toUpperCase();

  if (FONTES_FORA.some(f => s.includes(f))) return 'Eventos';

  if (s.includes('lkdn') || s.includes('linkedin') ||
      c.includes('[LKDN]') || c.includes('LINKEDIN')) return 'LinkedIn';

  if (s.includes('googleads') || s.includes('google') || s.includes('adwords') ||
      c.includes('[GOOGLE]') || /^\d{10,}$/.test((b.campanha || '').trim())) return 'Google';

  if (s.includes('fbads') || s.includes('facebook') || s.includes('meta') ||
      s.includes('instagram') || s === 'fb' || s === 'ig' ||
      c.includes('[META]')) return 'Meta';

  if (!s) return 'Sem origem';
  return 'Outros';
}

// Os cargos vem digitados de mil formas. Aqui agrupamos nos grandes blocos
// pra tabela nao virar uma lista de 200 variacoes com 1 lead cada.
//
// Cada grupo e' uma regex, nao um "includes" simples: siglas curtas como CEO
// e COO precisam de limite de palavra, senao "Coordenador" vira C-Level
// (contem "coo") e "Director" tambem (contem "cto").
// A ordem importa — Vice-Presidente e' testado antes de Presidente.
const GRUPOS_CARGO = [
  ['Vice-Presidente',      /\b(vice[- ]?presidente|vice[- ]?president|\bvp\b)/],
  ['Presidente / CEO',     /\b(presidente|president|ceo|chief executive)\b/],
  ['Sócio / Fundador',     /\b(socio|sócio|partner|founder|fundador|propriet[aá]rio|owner|empres[aá]rio|entrepreneur)/],
  ['C-Level',              /\b(cmo|cto|coo|cfo|cpo|ciso|chro|cro|cio|c-level|c level)\b|\bchief\b/],
  ['Conselheiro',          /\b(conselh|advisor|board member)/],
  ['Diretor',              /\b(diretor|director|head)\b|\bdiretor/],
  ['Gerente',              /\b(gerente|manager|gestor)/],
  ['Coordenador',          /\b(coordenador|coordinator|supervisor)/],
  ['Consultor',            /\b(consultor|consultant|assessor)/],
  ['Profissional Liberal', /\b(profissional liberal|m[eé]dico|advogado|engenheiro|professor|dentista)/],
  ['Analista / Técnico',   /\b(analista|analyst|t[eé]cnico|assistente|estagi[aá]rio)/],
];

function normalizarCargo(cargo) {
  const c = (cargo || '').toLowerCase().trim();
  if (!c || c === 'outro' || c === 'outros') return 'Não informado';
  for (const [rotulo, regex] of GRUPOS_CARGO) {
    if (regex.test(c)) return rotulo;
  }
  return 'Outros';
}

const semAcento = s => (s || '').toLowerCase().trim()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function ordenarEtapas(etapas) {
  return etapas
    .filter(e => !ETAPAS_IGNORADAS.some(x => semAcento(e.etapa).includes(x)))
    .sort((a, b) => {
    const ia = ORDEM_ETAPAS.findIndex(e => semAcento(a.etapa).includes(e));
    const ib = ORDEM_ETAPAS.findIndex(e => semAcento(b.etapa).includes(e));
    if (ia === -1 && ib === -1) return b.qtd - a.qtd;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

let dados = null;            // resposta crua da API
let produtoAtivo = CONSOLIDADO;
let filtros = { rede: null, etapa: null, proprietario: null, funil: null, cargo: null };

// 'leads' ou 'mqls' — define o que as barras dos cards medem
let metrica = 'leads';

// Ordenacao da tabela de proprietarios. Tem coluna propria, separada do
// seletor Leads/MQL do topo — da pra ver quem tem mais lead e quem tem
// mais MQL sem trocar a metrica do dashboard inteiro.
let ordemProp    = 'desc';
let ordemPropCol = 'mqls';
const rotuloMetrica = () => metrica === 'mqls' ? 'MQL' : 'Leads';
let charts = {};

// ── Formatação ──────────────────────────────────────────────────────────────
const fmtNum = v => (v || 0).toLocaleString('pt-BR');
const fmtBRL = v => (v || 0).toLocaleString('pt-BR',
  { style:'currency', currency:'BRL', minimumFractionDigits:0, maximumFractionDigits:0 });
const fmtRoas = v => (v || 0).toFixed(2) + 'x';

// Data DD/MM → objeto Date do ano corrente, pra comparar com o range
function paraData(ddmm) {
  const [d, m] = ddmm.split('/');
  return new Date(new Date().getFullYear(), Number(m) - 1, Number(d));
}

function dentroDoPeriodo(ddmm) {
  const ini = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  if (!ini || !fim) return true;
  const d = paraData(ddmm);
  return d >= new Date(ini + 'T00:00:00') && d <= new Date(fim + 'T00:00:00');
}

// ── Carga ───────────────────────────────────────────────────────────────────
async function carregar() {
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.textContent = 'Carregando…';
  document.getElementById('statusTexto').textContent = 'Buscando dados da planilha…';

  try {
    const r = await fetch('/api/dashboard', { headers: { Authorization: `Bearer ${SESSION_TOKEN}` } });
    if (r.status === 401) { logout(); return; }
    const json = await r.json();
    if (!r.ok) throw new Error(json.error || 'Erro ao carregar');

    dados = json;
    jaDiagnosticou = false;
    renderTabs();
    render();

    const qtd = Object.keys(dados.produtos).length;
    document.getElementById('statusTexto').textContent =
      `${qtd} produtos · ${fmtNum(dados.backlog.length)} leads no backlog`;
  } catch (err) {
    document.getElementById('conteudo').innerHTML =
      `<div class="empty">Não foi possível carregar: ${err.message}</div>`;
    document.getElementById('statusTexto').textContent = 'Erro ao carregar';
  } finally {
    btn.disabled = false; btn.textContent = '⟳ Atualizar';
  }
}

// ── Abas de produto ─────────────────────────────────────────────────────────
function renderTabs() {
  const totalGeral = PRODUTOS_REAIS
    .reduce((s, n) => s + (dados.produtos[n]?.kpis.leads || 0), 0);

  document.getElementById('produtoTabs').innerHTML = ORDEM_PRODUTOS.map(p => {
    const ehConsol = p === CONSOLIDADO;
    const leads = ehConsol ? totalGeral : (dados.produtos[p]?.kpis.leads ?? 0);
    return `<div class="produto-tab ${p === produtoAtivo ? 'active' : ''} ${ehConsol ? 'consolidado' : ''}"
              onclick="trocarProduto('${p}')">
      <div class="nome">${ehConsol ? '★ ' + p : p}</div>
      <div class="mini">${fmtNum(leads)}</div>
    </div>`;
  }).join('');
}

function ordenarProp(coluna) {

function trocarMetrica(m) {

function trocarProduto(p) {

// ── Filtros cruzados ────────────────────────────────────────────────────────
// JSON.stringify usa aspas duplas, que fecham o atributo onclick="..." antes
// da hora e matam o clique. Escapamos pra entidade HTML.
const attr = v => JSON.stringify(String(v)).replace(/"/g, '&quot;');

function toggleFiltro(tipo, valor) {
  filtros[tipo] = filtros[tipo] === valor ? null : valor;
  render();
}

function limparFiltros(silencioso) {
  filtros = { rede: null, etapa: null, proprietario: null, funil: null, cargo: null };
  if (!silencioso) render();
}

// Qual filtro esta redesenhando o funil, pra mostrar no titulo do card
function labelFiltroFunil() {
  return filtros.proprietario || filtros.funil || filtros.cargo || filtros.rede || '';
}

function labelFiltros() {
  const ativos = Object.entries(filtros).filter(([, v]) => v);
  if (!ativos.length) return '';
  return `Filtrando: ${ativos.map(([, v]) => v).join(' · ')} — limpar ×`;
}

// ── Dados derivados do produto ativo, já com filtros aplicados ──────────────
function dadosVisiveis() {
  const ehConsolidado = produtoAtivo === CONSOLIDADO;
  const nomes = ehConsolidado ? PRODUTOS_REAIS : [produtoAtivo];

  // Junta os produtos: no consolidado sao os cinco, senao e' so um.
  const leadsMap = {};      // data → {leads, mqls}
  const investPorRede = {};
  const investPorDia  = {};
  let ganhos = [];

  for (const nome of nomes) {
    const p = dados.produtos[nome];
    if (!p) continue;

    for (const d of p.leadsPorDia) {
      if (!dentroDoPeriodo(d.data)) continue;
      if (!leadsMap[d.data]) leadsMap[d.data] = { data: d.data, leads: 0, mqls: 0 };
      leadsMap[d.data].leads += d.leads;
      leadsMap[d.data].mqls  += d.mqls;
    }

    for (const [rede, total] of Object.entries(p.investPorRede)) {
      if (filtros.rede && filtros.rede !== rede) continue;
      investPorRede[rede] = (investPorRede[rede] || 0) + total;
    }
    // Com filtro de rede, o investimento diario vem so daquela rede
    const fonteDia = filtros.rede
      ? ((p.investDiaRede || {})[filtros.rede] || {})
      : p.investPorDia;
    for (const [dia, val] of Object.entries(fonteDia)) {
      investPorDia[dia] = (investPorDia[dia] || 0) + val;
    }

    ganhos = ganhos.concat(p.ganhos.filter(g => dentroDoPeriodo(g.data)));

  }

  let leadsPorDia = Object.values(leadsMap).sort((a, b) => paraData(a.data) - paraData(b.data));
  const investimento = Object.values(investPorRede).reduce((s, v) => s + v, 0);

  // ── Backlog do(s) produto(s), ja com os filtros aplicados ────────────
  // Comparamos sem acento porque a planilha grava "PFCC MEXICO" e a aba
  // se chama "PFCC MÉXICO".
  const alvos = nomes.map(semAcento);
  let backlog = dados.backlog.filter(b => alvos.includes(semAcento(b.produto)));

  if (filtros.etapa)        backlog = backlog.filter(b => b.etapa === filtros.etapa);
  if (filtros.proprietario) backlog = backlog.filter(b => b.proprietario === filtros.proprietario);
  if (filtros.funil)        backlog = backlog.filter(b => b.funil === filtros.funil);
  if (filtros.cargo)        backlog = backlog.filter(b => normalizarCargo(b.cargo) === filtros.cargo);
  if (filtros.rede)         backlog = backlog.filter(b => redeDoLead(b) === filtros.rede);

  // ── Etapas do funil ──────────────────────────────────────────────────
  // Sai sempre do backlog, nao da aba ETAPA. A aba traz todos os deals
  // abertos de qualquer periodo, enquanto o backlog e' so o mes corrente —
  // usar as duas fontes deixava o funil sem bater com os proprietarios.
  //
  // O filtro de etapa fica de fora do proprio funil, senao ele viraria
  // uma barra unica ao clicar numa etapa.
  const etapas = (() => {
    let base = dados.backlog.filter(b => alvos.includes(semAcento(b.produto)));
    if (filtros.proprietario) base = base.filter(b => b.proprietario === filtros.proprietario);
    if (filtros.funil)        base = base.filter(b => b.funil === filtros.funil);
    if (filtros.cargo)        base = base.filter(b => normalizarCargo(b.cargo) === filtros.cargo);
    if (filtros.rede)         base = base.filter(b => redeDoLead(b) === filtros.rede);

    const contagem = {};
    for (const b of base) {
      if (metrica === 'mqls' && !b.mql) continue;
      const e = (b.etapa || '').trim() || '—';
      contagem[e] = (contagem[e] || 0) + 1;
    }
    return Object.entries(contagem).map(([etapa, qtd]) => ({ etapa, qtd }));
  })();

  const filtraFunil = !!(filtros.proprietario || filtros.funil || filtros.cargo || filtros.rede);

  // Leads e MQL por rede saem do backlog — a aba LEADS so tem o total
  const porRede = {};
  for (const rede of Object.keys(investPorRede)) {
    porRede[rede] = { leads: 0, mqls: 0, investimento: investPorRede[rede] };
  }
  for (const b of backlog) {
    const rede = redeDoLead(b);
    if (!porRede[rede]) porRede[rede] = { leads: 0, mqls: 0, investimento: 0 };
    porRede[rede].leads++;
    if (b.mql) porRede[rede].mqls++;
  }
  // CPL so existe onde ha investimento. Eventos e leads sem origem entram
  // no volume, mas ficam sem CPL — senao a linha despenca pra zero.
  // MQL e' subconjunto de leads, entao o denominador e' so leads.
  for (const r of Object.values(porRede)) {
    r.cpl = (r.investimento > 0 && r.leads)
      ? r.investimento / r.leads
      : null;
  }

  // MQL dos tres funis principais, dia a dia. A aba LEADS so tem o total,
  // entao isso sai do backlog usando a data da ultima aplicacao.
  const mqlTresFunisPorDia = {};
  for (const b of backlog) {
    if (!b.mql) continue;
    if (!FUNIS_PRINCIPAIS.includes((b.funil || '').toUpperCase())) continue;
    const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
    if (!dia.includes('/')) continue;
    mqlTresFunisPorDia[dia] = (mqlTresFunisPorDia[dia] || 0) + 1;
  }
  const mqlTresFunis = Object.values(mqlTresFunisPorDia).reduce((s, v) => s + v, 0);

  // Filtros vindos do backlog reescrevem a contagem de leads e MQL:
  // com filtro ativo, contar da aba LEADS daria o total do produto inteiro.
  const filtrandoBacklog = !!(filtros.etapa || filtros.proprietario
    || filtros.funil || filtros.cargo || filtros.rede);

  // Com filtro ativo o grafico tambem passa a sair do backlog. A aba LEADS
  // so tem o total do dia, sem quebra por rede/dono/etapa — se ela continuasse
  // alimentando as barras, elas ficariam paradas enquanto o resto filtrava.
  if (filtrandoBacklog) {
    const porDia = {};
    for (const b of backlog) {
      const dia = (b.aplicacao || '').trim().slice(0, 5);   // DD/MM
      if (!dia.includes('/')) continue;
      if (!dentroDoPeriodo(dia)) continue;
      if (!porDia[dia]) porDia[dia] = { data: dia, leads: 0, mqls: 0 };
      porDia[dia].leads++;
      if (b.mql) porDia[dia].mqls++;
    }
    leadsPorDia = Object.values(porDia).sort((a, b) => paraData(a.data) - paraData(b.data));
  }

  const leads = filtrandoBacklog
    ? backlog.length
    : leadsPorDia.reduce((s, d) => s + d.leads, 0);
  const mqls = filtrandoBacklog
    ? backlog.filter(b => b.mql).length
    : leadsPorDia.reduce((s, d) => s + d.mqls, 0);

  // ── Reunioes agendadas no mes, do(s) produto(s) em foco ─────────────
  let reunioes = (dados.reunioes || [])
    .filter(r => alvos.includes(semAcento(r.produto)));
  if (filtros.proprietario) reunioes = reunioes.filter(r => r.proprietario === filtros.proprietario);
  if (filtros.funil)        reunioes = reunioes.filter(r => r.funil === filtros.funil);
  if (filtros.cargo)        reunioes = reunioes.filter(r => normalizarCargo(r.cargo) === filtros.cargo);
  if (filtros.rede)         reunioes = reunioes.filter(r => redeDoLead(r) === filtros.rede);

  const ganhosValidos = ganhos.filter(g => g.vale === 'sim');
  const faturamento   = ganhosValidos.reduce((s, g) => s + g.valor, 0);
  const qtdGanhos     = ganhosValidos.length;

  // ── Taxas ────────────────────────────────────────────────────────────
  // Conexao: dos MQLs criados, quantos chegaram a Contatado ou alem.
  const mqlsBacklog = backlog.filter(b => b.mql);
  const conectados  = mqlsBacklog.filter(b =>
    ETAPAS_CONECTADAS.some(e => semAcento(b.etapa).includes(e)));

  const taxas = {
    // Que % dos leads vira MQL
    qualificacao: leads ? mqls / leads * 100 : null,
    // Que % dos MQLs teve algum contato
    conexao: mqlsBacklog.length
      ? conectados.length / mqlsBacklog.length * 100 : null,
    // Que % dos MQLs virou reuniao agendada
    agendamento: mqls ? reunioes.length / mqls * 100 : null,
    // Que % das reunioes virou venda
    vendasCall: reunioes.length ? qtdGanhos / reunioes.length * 100 : null,
  };

  return {
    leadsPorDia, ganhos, backlog, investPorRede, investPorDia, porRede, etapas,
    ehConsolidado, mqlTresFunisPorDia, mqlTresFunis, filtraFunil,
    reunioes, taxas,
    kpis: {
      leads, mqls, investimento,
      ganhos: qtdGanhos, faturamento,
      roas:  investimento ? faturamento / investimento : 0,
      // MQL ja esta contido em leads — dividir so por leads
      cpl:   leads ? investimento / leads : 0,
      cpmql: mqls      ? investimento / mqls      : 0,
      cac:   qtdGanhos ? investimento / qtdGanhos : 0,
    },
  };
}

// Quanto deveria estar a esta altura do mes, no ritmo da meta
function metaAteHoje(meta) {
  if (!meta) return null;
  const hoje = new Date();
  const fim  = document.getElementById('dataFim').value;
  const dia  = fim ? new Date(fim + 'T00:00:00').getDate() : hoje.getDate();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
  return Math.round(meta / diasNoMes * dia);
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  if (!dados) return;
  const v = dadosVisiveis();
  if (!v) {
    document.getElementById('conteudo').innerHTML = '<div class="empty">Sem dados para este produto.</div>';
    return;
  }

  document.getElementById('filtroAtivo').textContent = labelFiltros();

  const k = v.kpis;
  const metas = METAS[produtoAtivo] || {};

  // Um KPI pode ter meta. Quando tem, mostramos o alvo do mes, quanto
  // deveria estar hoje e uma barra de progresso.
  //
  // CAC e CPMQL sao "quanto menor, melhor": pra eles nao existe ritmo
  // acumulado, so a comparacao direta com o teto.
  function kpiCard(label, valor, opts = {}) {
    const { meta, fmt = fmtNum, azul = false, bruto = null,
            menorMelhor = false, semRitmo = false } = opts;

    if (!meta) {
      return `<div class="kpi-card">
        <div class="kpi-label">${label}</div>
        <div class="kpi-val ${azul ? 'blue' : ''}">${valor}</div>
      </div>`;
    }

    if (menorMelhor || semRitmo) {
      const dentro = menorMelhor ? bruto <= meta : bruto >= meta;
      const cor = bruto ? (dentro ? 'var(--green)' : 'var(--red)') : 'var(--gray)';
      const pct = meta ? Math.min(bruto / meta * 100, 100) : 0;
      return `<div class="kpi-card">
        <div class="kpi-label">${label}</div>
        <div class="kpi-val ${azul ? 'blue' : ''}">${valor}</div>
        <div class="kpi-linha"><span>${menorMelhor ? 'Teto' : 'Meta'}</span>
          <span style="color:${cor}">${fmt(meta)}</span></div>
        <div class="kpi-barra"><div style="width:${pct}%;background:${cor}"></div></div>
      </div>`;
    }

    const alvoHoje = metaAteHoje(meta);
    const pct = Math.min(bruto / meta * 100, 100);
    const noRitmo = alvoHoje === null || bruto >= alvoHoje;
    const cor = noRitmo ? 'var(--green)' : 'var(--red)';
    return `<div class="kpi-card">
      <div class="kpi-label">${label}</div>
      <div class="kpi-val ${azul ? 'blue' : ''}">${valor}</div>
      <div class="kpi-linha"><span>Projeção</span>
        <span style="color:${cor}">${fmt(alvoHoje)}</span></div>
      <div class="kpi-linha"><span>Meta</span><span>${fmt(meta)}</span></div>
      <div class="kpi-barra"><div style="width:${pct}%;background:${cor}"></div></div>
    </div>`;
  }

  const kpisHtml = [
    kpiCard('Leads', fmtNum(k.leads),
      { azul:true, meta: metas.leads, bruto: k.leads }),
    kpiCard('MQL', fmtNum(k.mqls),
      { azul:true, meta: metas.mqls, bruto: k.mqls }),
    kpiCard('Investimento', fmtBRL(k.investimento),
      { fmt: fmtBRL }),
    kpiCard('Vol. Ganhos', fmtNum(k.ganhos),
      { meta: metas.vendas, bruto: k.ganhos }),
    kpiCard('Faturamento', fmtBRL(k.faturamento),
      { meta: metas.faturamento, bruto: k.faturamento, fmt: fmtBRL }),
    kpiCard('ROAS', fmtRoas(k.roas),
      { meta: metas.roas, bruto: k.roas, fmt: fmtRoas, semRitmo: true }),
    kpiCard('CPL', fmtBRL(k.cpl), { fmt: fmtBRL }),
    kpiCard('CPMQL', fmtBRL(k.cpmql),
      { meta: metas.cpmql, bruto: k.cpmql, fmt: fmtBRL, menorMelhor: true }),
    kpiCard('CAC', fmtBRL(k.cac),
      { meta: metas.cac, bruto: k.cac, fmt: fmtBRL, menorMelhor: true }),
  ].join('');

  document.getElementById('conteudo').innerHTML = `
    <div class="kpi-strip">${kpisHtml}</div>

    <div class="redes-grid">${cardsRedes(v)}</div>

    <div class="grid-topo">
      <div class="card">
        <div class="card-title">
          Investimento · Leads · MQL
          <span class="card-tag" style="background:#7ee0a8;color:#0a0a0a">
            ${fmtNum(v.mqlTresFunis)} nos 3 funis</span>
        </div>
        <div class="chart-box"><canvas id="chartLeads"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          ${v.filtraFunil ? 'Funil · ' + labelFiltroFunil() : 'Funil · em aberto'}
          <span class="card-tag" ${v.filtraFunil ? 'style="background:var(--amber);color:#0a0a0a"' : ''}>
            ${v.filtraFunil ? rotuloMetrica().toLowerCase() + ' filtrados' : '% do total'}</span>
        </div>
        <div class="card-body">${funilHtml(v)}</div>
      </div>
    </div>

    <div class="grid-meio">
      <div class="card">
        <div class="card-title">
          Leads · MQL · CPL por rede
          <span class="card-tag">clique pra filtrar</span>
        </div>
        <div class="chart-box baixo"><canvas id="chartRedes"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          Funis
          <span class="card-tag">leads → mql</span>
        </div>
        <div class="card-body" style="max-height:230px">${tabelaFunis(v)}</div>
      </div>
      <div class="card">
        <div class="card-title">
          Cargos
          <span class="card-tag">% dos leads</span>
        </div>
        <div class="card-body" style="max-height:230px">${tabelaCargos(v)}</div>
      </div>
      <div class="card">
        <div class="card-title">
          Proprietários
          <span class="card-tag">${qtdProprietarios(v)} · ${fmtNum(v.backlog.length)} leads</span>
        </div>
        <div class="table-scroll" style="max-height:230px">${tabelaProprietarios(v)}</div>
      </div>
    </div>

    <div class="grid-topo">
      <div class="card">
        <div class="card-title">
          Faturamento acumulado
          ${(METAS[produtoAtivo] || {}).faturamento
            ? `<span class="card-tag">meta ${fmtBRL(METAS[produtoAtivo].faturamento)}</span>`
            : ''}
        </div>
        <div class="chart-box baixo"><canvas id="chartGanhos"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          Comparativo entre produtos
          <span class="card-tag">clique para trocar</span>
        </div>
        <div class="table-scroll">${tabelaProdutos()}</div>
      </div>
    </div>

    <div class="taxas">
      ${[
        ['Tx. Qualificação',   v.taxas.qualificacao, `${fmtNum(v.kpis.mqls)} de ${fmtNum(v.kpis.leads)} leads`],
        ['Tx. Conexão',        v.taxas.conexao,      'MQLs que chegaram a Contatado+'],
        ['Tx. Agendamento',    v.taxas.agendamento,  `${fmtNum(v.reunioes.length)} reuniões`],
        ['Tx. Vendas s/ Call', v.taxas.vendasCall,   `${fmtNum(v.kpis.ganhos)} vendas`],
      ].map(([nome, valor, detalhe]) => `
        <div class="taxa">
          <div class="taxa-nome">${nome}</div>
          <div class="taxa-val" style="color:${valor === null ? 'var(--gray)' : 'var(--blue)'}">${
            valor === null ? '—' : valor.toFixed(1) + '%'}</div>
          <div class="taxa-detalhe">${detalhe}</div>
        </div>`).join('')}
    </div>

  `;

  desenharGraficos(v);
  diagnosticarOutros(v.backlog);
}

// ── Tabela comparativa ──────────────────────────────────────────────────────
function tabelaProdutos() {
  const linhas = ORDEM_PRODUTOS.map(nome => {
    const p = dados.produtos[nome];
    if (!p) return '';
    const k = p.kpis;
    const backlogProduto = dados.backlog.filter(b => b.produto === nome);
    const reaplicacoes   = backlogProduto.filter(b => b.reaplicacao).length;
    const pctLeads = k.leads ? (k.ganhos / k.leads * 100) : 0;
    const pctMqls  = k.mqls  ? (k.ganhos / k.mqls  * 100) : 0;

    return `<tr class="clicavel ${nome === produtoAtivo ? 'selecionado' : ''}" onclick="trocarProduto('${nome}')">
      <td style="font-weight:600">${nome}</td>
      <td class="num">${fmtBRL(k.investimento)}</td>
      <td class="num">${fmtNum(k.leads)}</td>
      <td class="num">${fmtNum(reaplicacoes)}</td>
      <td class="num">${fmtNum(k.ganhos)}</td>
      <td class="num">${pctLeads.toFixed(1)}%</td>
      <td class="num">${pctMqls.toFixed(1)}%</td>
      <td class="num">${fmtBRL(k.cpl)}</td>
      <td class="num">${fmtBRL(k.cpmql)}</td>
      <td class="num" style="color:var(--blue)">${fmtRoas(k.roas)}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th>Produto</th><th class="num">Investimento</th><th class="num">Leads</th>
      <th class="num">Reaplicação</th><th class="num">Ganhos</th>
      <th class="num">% Leads</th><th class="num">% MQL</th>
      <th class="num">CPL</th><th class="num">CPMQL</th><th class="num">ROAS</th>
    </tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;
}

// ── Funil ───────────────────────────────────────────────────────────────────
function funilHtml(v) {
  if (!v.etapas.length) return '<div class="empty">Sem etapas para exibir.</div>';
  const etapas = ordenarEtapas(v.etapas);
  const maior  = Math.max(...etapas.map(e => e.qtd), 1);
  // % sobre o total em aberto — as etapas sao um retrato, nao um funil
  // sequencial, entao comparar com a primeira daria numeros acima de 100%
  const total  = etapas.reduce((s, e) => s + e.qtd, 0) || 1;

  return '<div class="funil">' + etapas.map((e, i) => {
    const larg = Math.max(e.qtd / maior * 100, 3);
    const pct  = (e.qtd / total * 100).toFixed(0);
    const cor  = `hsl(${210 - i * 6}, ${62 - i * 3}%, ${58 - i * 2}%)`;
    const sel  = filtros.etapa === e.etapa;
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('etapa', ${attr(e.etapa)})">
      <div class="funil-label">${e.etapa}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : cor}">
          <span class="funil-val">${fmtNum(e.qtd)}</span>
        </div>
      </div>
      <div class="funil-pct" title="${fmtNum(e.qtd)} negócios">${pct}%</div>
    </div>`;
  }).join('') + '</div>';
}

// ── Cards de rede ───────────────────────────────────────────────────────────
function cardsRedes(v) {
  const PAGAS = ['Meta', 'Google', 'LinkedIn'];
  const CORES = { Meta: '#4a6dd4', Google: '#2980b9', LinkedIn: '#0e76a8' };

  return PAGAS.map(rede => {
    const d = v.porRede[rede];
    const sel = filtros.rede === rede;
    const cor = CORES[rede];

    if (!d || (!d.leads && !d.investimento)) {
      return `<div class="rede-card vazio">
        <div class="rede-nome" style="color:${cor}">${rede}</div>
        <div class="empty" style="padding:18px 0">Sem dados</div>
      </div>`;
    }

    const taxa = d.leads ? (d.mqls / d.leads * 100) : 0;
    const cpmql = d.mqls ? d.investimento / d.mqls : null;

    return `<div class="rede-card ${sel ? 'ativo' : ''}"
              style="${sel ? `border-color:${cor}` : ''}"
              onclick="toggleFiltro('rede', ${attr(rede)})">
      <div class="rede-topo">
        <span class="rede-nome" style="color:${cor}">${rede}</span>
        <span class="rede-inv">${fmtBRL(d.investimento)}</span>
      </div>
      <div class="rede-nums">
        <div><span>Leads</span><strong>${fmtNum(d.leads)}</strong></div>
        <div><span>MQL</span><strong style="color:${cor}">${fmtNum(d.mqls)}</strong></div>
        <div><span>Taxa MQL</span><strong>${taxa.toFixed(0)}%</strong></div>
      </div>
      <div class="rede-nums">
        <div><span>CPL</span><strong>${d.cpl === null ? '—' : fmtBRL(d.cpl)}</strong></div>
        <div><span>CPMQL</span><strong>${cpmql === null ? '—' : fmtBRL(cpmql)}</strong></div>
        <div><span>Share</span><strong>${
          v.kpis.investimento ? (d.investimento / v.kpis.investimento * 100).toFixed(0) : 0
        }%</strong></div>
      </div>
      <div class="rede-barra"><div style="width:${
        v.kpis.leads ? Math.min(d.leads / v.kpis.leads * 100, 100) : 0
      }%;background:${cor}"></div></div>
    </div>`;
  }).join('');
}

// ── Funis (pipelines onde os leads estão) ───────────────────────────────────
function tabelaFunis(v) {
  const agg = {};
  for (const b of v.backlog) {
    const f = b.funil || '—';
    if (!agg[f]) agg[f] = { leads: 0, mqls: 0 };
    agg[f].leads++;
    if (b.mql) agg[f].mqls++;
  }

  const lista = Object.entries(agg).sort((a, b) => b[1][metrica] - a[1][metrica]);
  if (!lista.length) return '<div class="empty">Sem funis para os filtros atuais.</div>';

  const maior = Math.max(...lista.map(([, d]) => d[metrica]), 1);
  const outra = metrica === 'mqls' ? 'leads' : 'mqls';

  return '<div class="funil">' + lista.map(([nome, d]) => {
    const sel  = filtros.funil === nome;
    const larg = Math.max(d[metrica] / maior * 100, 3);
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('funil', ${attr(nome)})">
      <div class="funil-label">${nome}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : '#3a7ca8'}">
          <span class="funil-val">${fmtNum(d[metrica])}</span>
        </div>
      </div>
      <div class="funil-pct">${fmtNum(d[outra])}</div>
    </div>`;
  }).join('') + '</div>';
}

// ── Cargos ──────────────────────────────────────────────────────────────────
function tabelaCargos(v) {
  const agg = {};
  for (const b of v.backlog) {
    const c = normalizarCargo(b.cargo);
    if (!agg[c]) agg[c] = { leads: 0, mqls: 0 };
    agg[c].leads++;
    if (b.mql) agg[c].mqls++;
  }

  const lista = Object.entries(agg).sort((a, b) => b[1][metrica] - a[1][metrica]);
  if (!lista.length) return '<div class="empty">Sem cargos para os filtros atuais.</div>';

  const total = lista.reduce((s, [, d]) => s + d[metrica], 0) || 1;
  const maior = Math.max(...lista.map(([, d]) => d[metrica]), 1);

  return '<div class="funil">' + lista.map(([nome, d]) => {
    const sel  = filtros.cargo === nome;
    const larg = Math.max(d[metrica] / maior * 100, 3);
    const pct  = (d[metrica] / total * 100).toFixed(0);
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('cargo', ${attr(nome)})">
      <div class="funil-label">${nome}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : '#5b6f9e'}">
          <span class="funil-val">${fmtNum(d[metrica])}</span>
        </div>
      </div>
      <div class="funil-pct" title="${fmtNum(d[metrica === 'mqls' ? 'leads' : 'mqls'])} ${metrica === 'mqls' ? 'leads' : 'MQL'}">${pct}%</div>
    </div>`;
  }).join('') + '</div>';
}

// ── Proprietários ───────────────────────────────────────────────────────────
const qtdProprietarios = v =>
  new Set(v.backlog.map(b => b.proprietario || '—')).size;

function tabelaProprietarios(v) {
  const agg = {};
  for (const b of v.backlog) {
    const dono = b.proprietario || '—';
    if (!agg[dono]) agg[dono] = { leads: 0, mqls: 0 };
    agg[dono].leads++;
    if (b.mql) agg[dono].mqls++;
  }

  // Sem corte — a lista rola dentro do card. Cortar escondia proprietarios
  // que estao na planilha, e ai o total nao fechava com o que se ve.
  const sinal = ordemProp === 'asc' ? 1 : -1;
  const linhas = Object.entries(agg)
    .sort((a, b) => sinal * (a[1][ordemPropCol] - b[1][ordemPropCol]))
    .map(([dono, d]) => {
      const sel = filtros.proprietario === dono;
      const cor = c => ordemPropCol === c ? 'color:var(--blue);font-weight:600' : '';
      return `<tr class="clicavel ${sel ? 'selecionado' : ''}"
                onclick="toggleFiltro('proprietario', ${attr(dono)})">
        <td>${dono}</td>
        <td class="num" style="${cor('leads')}">${fmtNum(d.leads)}</td>
        <td class="num" style="${cor('mqls')}">${fmtNum(d.mqls)}</td>
      </tr>`;
    }).join('');

  if (!linhas) return '<div class="empty">Nenhum lead para os filtros atuais.</div>';

  const seta = ordemProp === 'asc' ? '↑' : '↓';
  const col = c => {
    const nome = c === 'leads' ? 'Leads' : 'MQL';
    const ativa = ordemPropCol === c;
    return `<th class="num ordenavel ${ativa ? 'ativa' : ''}"
              onclick="ordenarProp('${c}')">${nome}${ativa ? ' ' + seta : ''}</th>`;
  };

  return `<table>
    <thead><tr><th>Proprietário</th>${col('leads')}${col('mqls')}</tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;
}

// ── Gráficos ────────────────────────────────────────────────────────────────
// O plugin de rotulos e' registrado global, mas desligado por padrao:
// cada grafico decide como quer exibir o valor.
if (window.ChartDataLabels) {
  Chart.register(ChartDataLabels);
  Chart.defaults.set('plugins.datalabels', { display: false });
}

function opcoesBase() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1,
        titleFont: { family: 'DM Mono', size: 11 },
        bodyFont:  { family: 'DM Mono', size: 11 },
      },
    },
    scales: {
      x: { ticks: { color: '#c8c8c8', font: { family: 'DM Mono', size: 9 }, maxRotation: 45 },
           grid: { color: '#1a1a1a' } },
      y: { ticks: { color: '#c8c8c8', font: { family: 'DM Mono', size: 9 } },
           grid: { color: '#1c1c1c' }, beginAtZero: true },
    },
  };
}

// Roda o desenho de um grafico isolado: se um quebrar, os outros continuam
function comCanvas(id, fn) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return fn(el); }
  catch (err) { console.error(`Falha no gráfico ${id}:`, err); return null; }
}

// Quando "Outros" cresce demais e' porque alguma utm_source nova apareceu.
// Em vez de caçar no console, o dashboard mesmo aponta o que nao classificou.
let jaDiagnosticou = false;

function diagnosticarOutros(backlog) {
  // Uma vez por carga — antes rodava a cada render e inundava o console
  if (jaDiagnosticou) return;
  jaDiagnosticou = true;

  const soltos = backlog.filter(b => {
    const r = redeDoLead(b);
    return r === 'Outros' || r === 'Sem origem';
  });
  if (!soltos.length) return;

  const porFonte = {};
  for (const b of soltos) {
    const k = (b.source || '(vazio)').trim();
    porFonte[k] = (porFonte[k] || 0) + 1;
  }
  const lista = Object.entries(porFonte).sort((a, b) => b[1] - a[1]);

  console.groupCollapsed(
    `⚠️ ${soltos.length} leads sem rede definida — utm_source encontradas:`);
  lista.forEach(([fonte, qtd]) => console.log(`${String(qtd).padStart(5)} × ${fonte}`));
  console.groupEnd();
}

function desenharGraficos(v) {
  Object.values(charts).forEach(c => c?.destroy());
  charts = {};

  // Tudo vem de v: no Consolidado nao existe dados.produtos['CONSOLIDADO']
  // Sem dados o Chart.js desenha um retangulo vazio sem explicacao —
  // melhor dizer o que aconteceu.
  const aviso = (id, texto) => {
    const box = document.getElementById(id)?.parentElement;
    if (box) box.innerHTML = `<div class="empty">${texto}</div>`;
  };
  if (!v.leadsPorDia.length) aviso('chartLeads', 'Sem leads no período selecionado.');
  if (!v.ganhos.length)      aviso('chartGanhos', 'Nenhum ganho no período.');

  const labels  = v.leadsPorDia.map(d => d.data);
  const invDias = labels.map(l => v.investPorDia[l] || 0);

  // Investimento x Leads x MQL
  charts.leads = comCanvas('chartLeads', el => new Chart(el, {
    data: {
      labels,
      datasets: [
        { type:'bar', label:'Leads', data: v.leadsPorDia.map(d => d.leads),
          backgroundColor:'#2c5f8a', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-2, color:'#9dc4e8',
            font:{ family:'DM Mono', size:8 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL', data: v.leadsPorDia.map(d => d.mqls),
          backgroundColor:'#4a9eed', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-2, color:'#cfe4f7',
            font:{ family:'DM Mono', size:8 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL · Sniper/Elite/Olympus',
          data: labels.map(l => v.mqlTresFunisPorDia[l] || 0),
          backgroundColor:'#7ee0a8', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-2, color:'#7ee0a8',
            font:{ family:'DM Mono', size:8 }, formatter: v => fmtNum(v) } },
        { type:'line', label:'Investimento', data: invDias,
          borderColor:'#d9a441', borderWidth:2, pointRadius:0, tension:.3, yAxisID:'y1',
          datalabels: { display: ctx => {
              // So o pico e o ultimo ponto, senao a linha vira uma parede de numeros
              const d = ctx.dataset.data, i = ctx.dataIndex;
              return d[i] > 0 && (i === d.length - 1 || d[i] === Math.max(...d));
            },
            anchor:'end', align:'top', color:'#d9a441',
            font:{ family:'DM Mono', size:8 },
            formatter: v => 'R$ ' + (v/1000).toFixed(1) + 'k' } },
      ],
    },
    options: {
      ...opcoesBase(),
      plugins: { ...opcoesBase().plugins, legend: { display:true,
        labels:{ color:'#e8e8e8', font:{ family:'DM Mono', size:10 }, boxWidth:10 } } },
      scales: {
        ...opcoesBase().scales,
        y1: { position:'right', beginAtZero:true, grid:{ display:false },
              ticks:{ color:'#d9a441', font:{ family:'DM Mono', size:9 },
                      callback: val => 'R$ ' + (val/1000).toFixed(0) + 'k' } },
      },
    },
  }));

  // Leads por rede — barras de volume, linha de CPL (mesma leitura do gráfico acima)
  // Midia paga primeiro (tem CPL), depois eventos e origens soltas
  const PAGAS = ['Meta', 'Google', 'LinkedIn'];
  const redes = Object.keys(v.porRede)
    .filter(r => v.porRede[r].leads > 0 || v.porRede[r].investimento > 0)
    .sort((a, b) => {
      const pa = PAGAS.includes(a), pb = PAGAS.includes(b);
      if (pa !== pb) return pa ? -1 : 1;
      return v.porRede[b].leads - v.porRede[a].leads;
    });

  const opaco = r => !filtros.rede || filtros.rede === r;

  charts.redes = comCanvas('chartRedes', el => new Chart(el, {
    data: {
      labels: redes,
      datasets: [
        { type:'bar', label:'Leads', yAxisID:'y',
          data: redes.map(r => v.porRede[r].leads),
          backgroundColor: redes.map(r =>
            !opaco(r) ? '#242424' : (PAGAS.includes(r) ? '#2c5f8a' : '#4a4a52')),
          borderRadius: 2,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:0, color:'#9dc4e8',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL', yAxisID:'y',
          data: redes.map(r => v.porRede[r].mqls),
          backgroundColor: redes.map(r =>
            !opaco(r) ? '#2e2e2e' : (PAGAS.includes(r) ? '#4a9eed' : '#7a7a86')),
          borderRadius: 2,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:0, color:'#cfe4f7',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'line', label:'CPL', yAxisID:'y1',
          data: redes.map(r => v.porRede[r].cpl === null ? null : Math.round(v.porRede[r].cpl)),
          borderColor:'#d9a441', borderWidth:2, pointRadius:3,
          pointBackgroundColor:'#d9a441', tension:.3, spanGaps:true,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'bottom', color:'#d9a441',
            font:{ family:'DM Mono', size:9 },
            formatter: v => 'R$ ' + fmtNum(v) } },
      ],
    },
    options: {
      ...opcoesBase(),
      onClick: (_, els) => { if (els.length) toggleFiltro('rede', redes[els[0].index]); },
      plugins: {
        ...opcoesBase().plugins,
        legend: { display:true, labels:{ color:'#e8e8e8',
          font:{ family:'DM Mono', size:9 }, boxWidth:9 } },
        tooltip: { ...opcoesBase().plugins.tooltip, callbacks: {
          label: ctx => ctx.dataset.label === 'CPL'
            ? ' CPL ' + fmtBRL(ctx.raw)
            : ` ${ctx.dataset.label}: ${fmtNum(ctx.raw)}`,
          afterBody: items => {
            const r = redes[items[0].dataIndex];
            return 'Investimento ' + fmtBRL(v.porRede[r].investimento);
          },
        } },
      },
      scales: {
        x: { ticks:{ color:'#e8e8e8', font:{ family:'DM Mono', size:10 } }, grid:{ display:false } },
        y: { beginAtZero:true, ticks:{ color:'#c8c8c8', font:{ family:'DM Mono', size:9 } },
             grid:{ color:'#1c1c1c' } },
        y1:{ position:'right', beginAtZero:true, grid:{ display:false },
             ticks:{ color:'#d9a441', font:{ family:'DM Mono', size:9 },
                     callback: val => 'R$ ' + fmtNum(val) } },
      },
    },
  }));

  // Ganhos acumulados. Se ninguém marcou "sim" ainda, mostra todos os ganhos
  // pra tela não ficar vazia — o aviso fica no título do card.
  const validados = v.ganhos.filter(x => x.vale === 'sim');
  const usarTodos = validados.length === 0 && v.ganhos.length > 0;
  const base = usarTodos ? v.ganhos : validados;

  const tituloGanhos = document.querySelector('#chartGanhos')
    ?.closest('.card')?.querySelector('.card-title');
  if (tituloGanhos && usarTodos) {
    tituloGanhos.innerHTML = 'Faturamento acumulado <span class="card-tag" ' +
      'style="background:var(--amber)">sem validação</span>';
  }

  const ganhosPorDia = {};
  for (const g of base) {
    ganhosPorDia[g.data] = (ganhosPorDia[g.data] || 0) + g.valor;
  }
  const diasGanhos = Object.keys(ganhosPorDia).sort((a, b) => paraData(a) - paraData(b));
  let acum = 0;
  const acumulado = diasGanhos.map(d => acum += ganhosPorDia[d]);

  // Faturamento acumulado, com a linha de ritmo da meta ao lado
  const metaFat = (METAS[produtoAtivo] || {}).faturamento;
  const diasNoMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();

  // A meta cresce linear ao longo do mes: no dia N deveria estar em
  // meta/dias * N. Assim a distancia entre as duas linhas e' o atraso.
  const linhaMeta = metaFat
    ? diasGanhos.map(d => Math.round(metaFat / diasNoMes * Number(d.split('/')[0])))
    : null;

  charts.ganhos = comCanvas('chartGanhos', el => new Chart(el, {
    type: 'line',
    data: {
      labels: diasGanhos,
      datasets: [
        {
          label: 'Realizado', data: acumulado,
          borderColor:'#4ade80', borderWidth:2.5,
          pointRadius:3, pointBackgroundColor:'#4ade80', fill:false, tension:.3,
          datalabels: {
            display: ctx => ctx.dataIndex === ctx.dataset.data.length - 1,
            anchor:'end', align:'left', color:'#4ade80',
            font:{ family:'DM Mono', size:10, weight:500 },
            formatter: v => fmtBRL(v),
          },
        },
        ...(linhaMeta ? [{
          label: 'Projeção', data: linhaMeta,
          borderColor:'#d9a441', borderWidth:2, borderDash:[6,4],
          pointRadius:0, fill:false, tension:0,
          datalabels: {
            display: ctx => ctx.dataIndex === ctx.dataset.data.length - 1,
            anchor:'end', align:'left', offset:6, color:'#d9a441',
            font:{ family:'DM Mono', size:10 },
            formatter: v => fmtBRL(v),
          },
        }] : []),
      ],
    },
    options: {
      ...opcoesBase(),
      plugins: {
        ...opcoesBase().plugins,
        legend: linhaMeta
          ? { display:true, labels:{ color:'#e8e8e8',
              font:{ family:'DM Mono', size:9 }, boxWidth:9 } }
          : { display:false },
        tooltip: { ...opcoesBase().plugins.tooltip,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtBRL(ctx.raw)}` } },
      },
      scales: {
        ...opcoesBase().scales,
        y: { ...opcoesBase().scales.y,
             ticks: { ...opcoesBase().scales.y.ticks,
                      callback: val => 'R$ ' + (val/1000).toFixed(0) + 'k' } },
      },
    },
  }));
}

// ── Início ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const hoje = new Date();
  const ano  = hoje.getFullYear();
  const mes  = String(hoje.getMonth() + 1).padStart(2, '0');
  const dia  = String(hoje.getDate()).padStart(2, '0');
  document.getElementById('dataInicio').value = `${ano}-${mes}-01`;
  document.getElementById('dataFim').value    = `${ano}-${mes}-${dia}`;

  document.getElementById('dataInicio').addEventListener('change', render);
  document.getElementById('dataFim').addEventListener('change', render);

  carregar();
});
</script>
