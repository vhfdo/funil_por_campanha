<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visão Geral — Board Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --panel:#111; --panel2:#1a1a1a; --border:#222;
    --blue:#4a9eed; --gray:#666; --gray-light:#999; --white:#f0f0f0;
    --amber:#d9a441; --red:#c0392b; --green:#4ade80;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1500px;margin:0 auto;padding:26px 22px 50px;}

  /* ── Cabeçalho ── */
  .header{display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--blue);padding-bottom:20px;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,4vw,52px);line-height:1;}
  .eyebrow{font-family:'DM Mono',monospace;font-size:11px;color:var(--blue);
    letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px;}
  .header-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .btn{font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    padding:9px 18px;border:1px solid var(--blue);background:transparent;color:var(--blue);
    cursor:pointer;transition:all .15s;}
  .btn:hover{background:var(--blue);color:var(--bg);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ativo{background:var(--blue);color:var(--bg);}
  .user-info{font-family:'DM Mono',monospace;font-size:11px;color:var(--white);
    text-transform:uppercase;letter-spacing:.06em;}

  /* Idade do dado: discreto, mas com o ponto colorido que denuncia atraso */
  .atualizacao{display:inline-flex;align-items:center;gap:7px;
    font-family:'DM Mono',monospace;font-size:10px;color:var(--gray);
    padding:6px 12px;border:1px solid var(--border);background:var(--panel);
    white-space:nowrap;cursor:default;}
  .atualizacao .ponto{width:6px;height:6px;border-radius:50%;
    background:var(--green);flex-shrink:0;}
  .atualizacao.velho{border-color:var(--amber);color:var(--amber);}
  .atualizacao.velho .ponto{background:var(--amber);}
  .atualizacao .idade{color:var(--gray-light);}
  .atualizacao.velho .idade{color:var(--amber);}
  @media(max-width:900px){ .atualizacao{display:none;} }
  @media print{ .atualizacao{display:none;} }

  /* TME no cabecalho: bloco proprio, alinhado com os controles */
  .tme-box{display:flex;align-items:center;gap:14px;padding:7px 16px;
    background:var(--panel);border:1px solid var(--border);
    border-left:3px solid var(--blue);}
  .tme-principal{display:flex;flex-direction:column;line-height:1.15;}
  .tme-rot{font-family:'DM Mono',monospace;font-size:9px;color:var(--white);
    text-transform:uppercase;letter-spacing:.12em;display:flex;
    align-items:center;}
  .tme-val{font-family:'Bebas Neue',sans-serif;font-size:26px;
    color:var(--blue);letter-spacing:.02em;}
  /* Qual recorte o numero cobre — sem isso alguem compara com o total */
  .tme-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--gray);
    letter-spacing:.08em;margin-top:-2px;}
  .tme-quebra{display:flex;flex-direction:column;gap:3px;
    padding-left:14px;border-left:1px solid var(--border);}
  .tme-linha{display:flex;justify-content:space-between;gap:12px;
    font-family:'DM Mono',monospace;font-size:10px;color:var(--gray-light);}
  .tme-linha b{color:var(--white);font-weight:500;}
  .tme-linha.mql b{color:var(--blue);}
  @media(max-width:1100px){ .tme-box{display:none;} }
  @media print{ .tme-box{display:none;} }

  .metrica-switch{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);}
  .metrica-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 16px;background:var(--panel);color:var(--white);
    border:none;cursor:pointer;transition:all .12s;}
  .metrica-btn:hover{color:var(--gray-light);}
  .metrica-btn.active{background:var(--blue);color:var(--bg);}

  .date-range{display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--border);padding:8px 14px;}
  .date-range:focus-within{border-color:var(--blue);}
  .date-label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--white);}
  .date-sep{font-family:'DM Mono',monospace;font-size:12px;color:var(--blue);padding:0 4px;}
  .date-input{font-family:'DM Mono',monospace;font-size:12px;background:transparent;
    border:none;color:var(--white);outline:none;cursor:pointer;width:118px;}
  .date-input::-webkit-calendar-picker-indicator{
    filter:invert(.4) sepia(1) saturate(3) hue-rotate(190deg);cursor:pointer;opacity:.7;}

  /* ── Abas de produto ── */
  .produtos{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:8px;}
  .produto-tab{flex:1;background:var(--panel);padding:14px 12px;cursor:pointer;
    transition:background .12s;border-bottom:2px solid transparent;text-align:center;}
  .produto-tab:hover{background:var(--panel2);}
  .produto-tab.active{background:var(--panel2);border-bottom-color:var(--blue);}
  .produto-tab .nome{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--white);}
  .produto-tab.active .nome{color:var(--blue);}
  .produto-tab.consolidado{border-right:1px solid var(--blue);}
  .produto-tab.consolidado .nome{color:var(--amber);}
  .produto-tab.consolidado.active .nome{color:var(--blue);}
  .produto-tab .mini{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-top:4px;color:var(--white);}

  .status-bar{font-family:'DM Mono',monospace;font-size:11px;color:var(--white);
    margin-bottom:24px;min-height:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .filtro-ativo{color:var(--amber);cursor:pointer;}
  /* Comparacao de tamanhos diferentes: o numero sai sem significado, e o
     usuario nao tem como perceber so olhando os selos */
  .aviso-comp{color:var(--red);font-family:'DM Mono',monospace;
    font-size:10.5px;margin-left:12px;white-space:nowrap;}
  .rotulo-comp{color:var(--gray-light);font-family:'DM Mono',monospace;
    font-size:10.5px;margin-left:12px;white-space:nowrap;}
  .filtro-ativo:hover{text-decoration:underline;}

  /* ── KPIs ── */
  .kpi-strip{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
  .kpi-card{background:var(--panel);padding:13px 12px;}
  .kpi-label{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--white);margin-bottom:8px;
    /* Rotulo em duas linhas desalinha o card inteiro da fileira */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi-val{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--white);}
  .kpi-val.blue{color:var(--blue);}
  .kpi-linha{display:flex;justify-content:space-between;gap:8px;
    font-family:'DM Mono',monospace;font-size:9.5px;color:var(--white);
    margin-top:5px;white-space:nowrap;}
  /* Complemento do valor, tipo o % ao lado do R$: menor e apagado, pra
     nao competir com o numero principal */
  .kpi-sub{color:var(--gray);margin-left:5px;font-size:8.5px;}
  .kpi-linha span:last-child{color:var(--white);}
  .kpi-barra{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:7px;}
  .kpi-barra div{height:100%;border-radius:2px;}

  /* Variação contra o período de comparação */
  .kpi-delta{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;
    font-weight:600;margin-top:4px;letter-spacing:.02em;}
  .kpi-delta.neutro{color:var(--gray-light);font-weight:400;}
  td .kpi-delta{display:block;font-size:9px;margin-top:1px;}
  /* Barra dividida: o preenchido sao os leads novos, o fundo a reaplicacao */
  .reapl-barra{height:4px;background:var(--amber);border-radius:2px;
    overflow:hidden;margin-top:7px;}
  .reapl-barra div{height:100%;background:var(--blue);border-radius:2px 0 0 2px;}
  @media(max-width:1200px){.kpi-strip{grid-template-columns:repeat(5,1fr);}}
  @media(max-width:700px){.kpi-strip{grid-template-columns:repeat(3,1fr);}}

  /* ── Grid principal ── */
  .grid-topo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .grid-meio{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .grid-base{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;}
  @media(max-width:1300px){ .grid-meio{grid-template-columns:1fr 1fr;} }
  @media(max-width:1100px){
    .grid-topo,.grid-base{grid-template-columns:1fr;}
  }
  @media(max-width:700px){ .grid-meio{grid-template-columns:1fr;} }

  .card{background:var(--panel);border:1px solid var(--border);padding:16px 18px;
    display:flex;flex-direction:column;min-width:0;}
  .card-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.04em;
    margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;
    flex-shrink:0;}
  .card-tag{font-family:'DM Mono',monospace;font-size:9px;background:var(--blue);
    color:var(--bg);padding:2px 6px;letter-spacing:.06em;white-space:nowrap;}
  .card-body{flex:1;min-height:0;overflow:auto;}
  .chart-box{position:relative;height:190px;flex-shrink:0;}
  .chart-box.baixo{height:230px;}

  /* ── Cards de rede ── */
  .redes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  @media(max-width:1200px){.redes-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:700px){.redes-grid{grid-template-columns:1fr;}}
  .rede-card{background:var(--panel);border:1px solid var(--border);padding:14px 16px;
    cursor:pointer;transition:border-color .12s,background .12s;}
  .rede-card:hover{background:var(--panel2);}
  .rede-card.ativo{background:var(--panel2);}
  .rede-card.vazio{cursor:default;opacity:.5;}
  .rede-topo{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border);}
  .rede-nome{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.04em;}
  .rede-inv{font-family:'DM Mono',monospace;font-size:12px;color:var(--white);}
  .rede-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px;}
  .rede-nums div{display:flex;flex-direction:column;gap:2px;}
  .rede-nums span{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--white);
    text-transform:uppercase;letter-spacing:.06em;}
  .rede-nums strong{font-family:'DM Mono',monospace;font-size:12.5px;
    font-weight:500;color:var(--white);}
  .rede-barra{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
  .rede-barra div{height:100%;border-radius:2px;}

  /* ── Mapa de calor ── */
  .calor-wrap{overflow-x:auto;}
  .calor{display:grid;gap:2px;min-width:880px;}
  .calor-canto{}
  .calor-hora{font-family:'DM Mono',monospace;font-size:8px;color:var(--gray-light);
    text-align:center;padding-bottom:3px;}
  .calor-dia{font-family:'DM Mono',monospace;font-size:9px;color:var(--white);
    display:flex;align-items:center;padding-right:7px;justify-content:flex-end;}
  .calor-cel{border-radius:2px;height:26px;
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Mono',monospace;font-size:9px;font-weight:500;
    transition:outline .1s;cursor:pointer;}
  .calor-cel:hover{outline:1px solid var(--blue);}
  /* Selecionado ganha contorno ambar, o mesmo sinal dos outros filtros */
  .calor-cel.sel{outline:2px solid var(--amber);}
  /* Fora do recorte escolhido: apaga sem sumir, pra manter a leitura do mapa */
  .calor-cel.apagada{opacity:.25;}
  .calor-dia,.calor-hora{cursor:pointer;}
  .calor-dia:hover,.calor-hora:hover{color:var(--blue);}
  .calor-dia.sel,.calor-hora.sel{color:var(--amber);font-weight:500;}
  .calor-total{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--gray-light);
    display:flex;align-items:center;justify-content:center;}
  .calor-nota{font-family:'DM Mono',monospace;font-size:9px;color:var(--gray);
    margin-top:8px;}

  /* ── Tabela ── */
  table{width:100%;border-collapse:collapse;font-size:11px;}
  th{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--white);padding:7px 8px;border-bottom:2px solid var(--blue);text-align:left;
    white-space:nowrap;position:sticky;top:0;background:var(--panel);}
  th.num{text-align:right;}
  th.ordenavel{cursor:pointer;user-select:none;}
  th.ordenavel:hover{color:var(--blue);}
  th.ordenavel.ativa{color:var(--blue);}
  td{padding:7px 8px;border-bottom:1px solid var(--border);}
  td.num{text-align:right;font-family:'DM Mono',monospace;font-size:10px;}
  tr.clicavel{cursor:pointer;}
  tr.clicavel:hover td{background:var(--panel2);}
  tr.selecionado td{background:#16283d;}
  .table-scroll{overflow:auto;max-height:230px;}
  /* Tabela de rastreio: muitas colunas, entao fonte menor e sem quebra */
  .busca-wrap{position:relative;display:inline-flex;align-items:center;flex:1;
    min-width:150px;max-width:320px;margin:0 12px;}
  .campo-busca{width:100%;padding:5px 26px 5px 10px;background:var(--bg);
    border:1px solid var(--border);color:var(--white);
    font-family:'DM Mono',monospace;font-size:10.5px;outline:none;
    transition:border-color .12s;}
  .campo-busca:focus{border-color:var(--blue);}
  .campo-busca::placeholder{color:var(--gray);text-transform:none;
    letter-spacing:0;}
  .busca-limpar{position:absolute;right:4px;background:none;border:none;
    color:var(--gray);font-size:15px;line-height:1;cursor:pointer;padding:0 4px;}
  .busca-limpar:hover{color:var(--white);}

  .agrupa-switch{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);}
  .agrupa-btn{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.05em;
    text-transform:uppercase;padding:4px 8px;background:var(--panel);
    color:var(--gray-light);border:none;cursor:pointer;transition:all .12s;}
  .agrupa-btn:hover{color:var(--white);}
  .agrupa-btn.ativo{background:var(--blue);color:var(--bg);}

  /* Botao pequeno pro cabecalho dos cards — o .btn padrao e' grande demais */
  .btn-mini{font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:5px 12px;border:1px solid var(--blue);
    background:transparent;color:var(--blue);cursor:pointer;transition:all .15s;
    white-space:nowrap;}
  .btn-mini:hover{background:var(--blue);color:var(--bg);}

  .link-pipe{color:var(--blue);text-decoration:none;font-family:'DM Mono',monospace;
    border-bottom:1px dotted transparent;transition:border-color .12s;}
  .link-pipe:hover{border-bottom-color:var(--blue);}

  .tabela-utm{font-size:10.5px;white-space:nowrap;}
  .tabela-utm th{font-size:8px;}
  .tabela-utm td.utm{font-family:'DM Mono',monospace;font-size:9px;
    color:var(--gray-light);}
  .table-scroll::-webkit-scrollbar,
  .card-body::-webkit-scrollbar{width:6px;}
  .table-scroll::-webkit-scrollbar-track,
  .card-body::-webkit-scrollbar-track{background:var(--bg);}
  .table-scroll::-webkit-scrollbar-thumb,
  .card-body::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
  .table-scroll::-webkit-scrollbar-thumb:hover,
  .card-body::-webkit-scrollbar-thumb:hover{background:#444;}

  /* ── Funil ── */
  .funil{display:flex;flex-direction:column;gap:2px;}
  .funil-step{display:grid;grid-template-columns:118px 1fr 42px;align-items:center;gap:8px;
    cursor:pointer;}
  .funil-step:hover .funil-bar{filter:brightness(1.25);}
  .funil-step.selecionado .funil-label{color:var(--amber);}
  .funil-label{font-size:10.5px;color:var(--white);text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .funil-track{height:17px;background:var(--border);border-radius:2px;overflow:hidden;}
  .funil-bar{height:100%;border-radius:2px;display:flex;align-items:center;
    justify-content:flex-end;padding-right:6px;min-width:22px;transition:filter .12s;}
  .funil-val{font-family:'DM Mono',monospace;font-size:10px;color:#fff;font-weight:500;}
  .funil-pct{font-family:'DM Mono',monospace;font-size:9px;color:var(--white);text-align:right;}
  /* Variacao nas barras: menor que o selo dos KPIs, pra caber na linha */
  .mini-delta{font-family:'DM Mono',monospace;font-size:8.5px;
    margin-left:5px;white-space:nowrap;}

  /* ── Taxas ── */
  .taxas{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
  .taxa{background:var(--panel);padding:12px;text-align:center;}
  .taxa-nome{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--white);margin-bottom:5px;}
  .taxa-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blue);}
  .taxa-detalhe{font-family:'DM Mono',monospace;font-size:8.5px;color:var(--gray);
    margin-top:4px;}
  @media(max-width:1200px){.taxas{grid-template-columns:repeat(3,1fr) !important;}}
  @media(max-width:700px){.taxas{grid-template-columns:repeat(2,1fr) !important;}}



  /* ── Report (one page) ──────────────────────────────────────────────── */
  .report-kpis{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;
    background:var(--border);border:1px solid var(--border);margin-bottom:16px;}
  @media(max-width:1300px){.report-kpis{grid-template-columns:repeat(5,1fr);}}
  @media(max-width:900px){.report-kpis{grid-template-columns:repeat(3,1fr);}}
  /* align-items:start impede o card de esticar ate a altura da linha —
     era dai que vinha aquele vazio embaixo do grafico. */
  .report-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
  @media(max-width:1000px){.report-grid{grid-template-columns:1fr;}}
  /* Mesma altura na tela e na impressao: assim o Chart.js nao precisa
     redimensionar no meio do print, que e' onde o layout quebrava. */
  .chart-box.report-chart{height:250px;}
  .report-funil{height:250px;overflow:hidden;}
  .report-grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px;align-items:start;}
  .report-taxas{margin-top:16px;}
  .report-comparativo{margin-top:16px;}
  @media(max-width:1000px){.report-grid-2{grid-template-columns:1fr;}}
  .chart-box.report-chart-2{height:190px;}
  .report-funis{height:190px;overflow:hidden;}
  .report-funis .funil{gap:1px;}
  .report-funis .funil-step{grid-template-columns:96px 1fr 30px;gap:6px;}
  .report-funis .funil-track{height:13px;}
  .report-funis .funil-label{font-size:8.5px;}
  .report-funis .funil-val{font-size:8px;}
  .report-funis .funil-pct{font-size:7.5px;}
  /* 12 etapas em 250px: barras e fontes menores pra caber sem cortar */
  .report-funil .funil{gap:1px;}
  .report-funil .funil-step{grid-template-columns:108px 1fr 30px;gap:6px;}
  .report-funil .funil-track{height:14px;}
  .report-funil .funil-label{font-size:9px;}
  .report-funil .funil-val{font-size:8.5px;}
  .report-funil .funil-pct{font-size:8px;}

  /* ── Impressão / PDF ────────────────────────────────────────────────── */
  .print-header{display:none;}

  @media print{
    /* Sem isso o navegador descarta os fundos escuros e o dash sai branco */
    *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}

    @page{ size:A4 portrait; margin:10mm; }

    body{background:var(--bg);}
    .wrap{max-width:100%;padding:0;}

    /* Controles nao fazem sentido no papel */
    .header, .produtos, .status-bar, .btn, .btn-mini,
    .metrica-switch, .date-range{display:none !important;}
    .card-tag{display:none;}

    /* Faixa de cabecalho: fundo proprio e borda azul, como uma capa */
    .print-header{
      display:flex;justify-content:space-between;align-items:center;
      background:var(--panel);border:1px solid var(--border);
      border-left:4px solid var(--blue);
      padding:10px 14px;margin-bottom:10px;}
    .print-marca{font-family:'DM Mono',monospace;font-size:8px;color:var(--blue);

      line-height:1;margin-top:3px;letter-spacing:.02em;}
    .print-meta{font-family:'DM Mono',monospace;font-size:8px;color:var(--gray-light);
      text-align:right;line-height:1.7;}

    /* So os cartoes individuais nao podem partir. Se os grids tambem
       tivessem essa regra, cada bloco pularia pra uma pagina propria e
       sobrariam faixas enormes em branco. */
    .card, .rede-card, .taxa, .kpi-card{

    /* Tudo mais compacto pra caber em 2-3 paginas */

    .kpi-card{padding:8px 9px;}
    .kpi-val{font-size:19px;}
    .kpi-linha{font-size:8px;margin-top:3px;}

    /* Alturas fixas: o resize no beforeprint faz o canvas acompanhar */
    .chart-box{height:135px !important;}
    .chart-box.baixo{height:115px !important;}
    /* O report ja nasce no tamanho certo — nada de mexer em altura aqui,
       senao o canvas e o funil saem de sincronia e se sobrepoem. */
    .report-kpis{margin-bottom:10px !important;}
    .report-grid, .report-grid-2{display:grid !important;
      grid-template-columns:1.35fr 1fr !important;
      gap:8px;align-items:start !important;

    .report-grid-2{margin-top:8px !important;}
    .report-taxas{margin-top:8px !important;break-inside:avoid;}
    .report-comparativo{margin-top:8px !important;break-inside:avoid;}

    .report-grid .card, .report-grid-2 .card{break-inside:avoid;page-break-inside:avoid;}

    /* A4 retrato: 194mm de largura por 277mm de altura. Sobra altura e
       falta largura, entao os KPIs vao em duas fileiras de cinco. */
    .report-kpis{grid-template-columns:repeat(5,1fr) !important;}

    .chart-box.report-chart{height:200px !important;}
    .report-funil{height:200px !important;}
    .chart-box.report-chart-2{height:170px !important;}
    .report-funis{height:170px !important;}

    .print-titulo h2{font-size:22px;}
    .print-header{padding-bottom:8px;margin-bottom:10px;}
    .kpi-card{padding:7px 9px;}
    .kpi-val{font-size:17px;}
    .kpi-label{font-size:7.5px;margin-bottom:4px;}
    .kpi-linha{font-size:7px;margin-top:2px;}
    .kpi-barra{height:2px;margin-top:4px;}
    .card-title{font-size:13px;margin-bottom:7px;}

    /* Barras mais finas pra 13 etapas caberem em 180px e 18 funis em 140px */
    .report-funil .funil-step{grid-template-columns:90px 1fr 26px;gap:5px;}
    .report-funil .funil-track{height:11px;}
    .report-funil .funil-label{font-size:8px;}
    .report-funil .funil-val{font-size:7px;}
    .report-funil .funil-pct{font-size:6.5px;}

    .report-funis .funil-step{grid-template-columns:78px 1fr 24px;gap:5px;}
    .report-funis .funil-track{height:11px;}
    .report-funis .funil-label{font-size:7.5px;}
    .report-funis .funil-val{font-size:6px;}
    .report-funis .funil-pct{font-size:6px;}

    /* Listas inteiras, sem rolagem */
    .table-scroll, .card-body{max-height:none !important;overflow:visible !important;}
    table{font-size:9px;}
    th{font-size:7.5px;padding:4px 6px;}
    td{padding:4px 6px;}
    td.num{font-size:8.5px;}

    /* Vale so pro funil do dashboard; o do report ja vem dimensionado */
    .card-body:not(.report-funil) .funil-step{grid-template-columns:100px 1fr 34px;}
    .card-body:not(.report-funil) .funil-label{font-size:8.5px;}
    .card-body:not(.report-funil) .funil-track{height:13px;}
    .card-body:not(.report-funil) .funil-val{font-size:8px;}
    .card-body:not(.report-funil) .funil-pct{font-size:7.5px;}

    .rede-card{padding:9px 11px;}
    .rede-nome{font-size:15px;}
    .rede-nums strong{font-size:10.5px;}
    .rede-nums span{font-size:7px;}

    .taxa{padding:8px;}
    .taxa-val{font-size:18px;}
    .taxa-nome{font-size:7.5px;}
    .taxa-detalhe{font-size:7px;}
  }

  /* Faixa de aviso pra tela que ainda nao e' fonte oficial de numero */
  .aviso-validacao{background:#2a1f0a;border:1px solid var(--amber);
    border-left:4px solid var(--amber);padding:12px 16px;margin-bottom:16px;
    display:flex;align-items:flex-start;gap:12px;}
  .aviso-validacao .icone{font-size:18px;line-height:1;flex-shrink:0;}
  .aviso-validacao .texto{font-family:'DM Mono',monospace;font-size:11px;
    line-height:1.7;color:var(--white);}
  .aviso-validacao .titulo{color:var(--amber);font-weight:500;
    text-transform:uppercase;letter-spacing:.08em;display:block;
    margin-bottom:3px;}
  @media print{ .aviso-validacao{break-inside:avoid;} }

  /* Ponto que pulsa enquanto o dado esta fresco. A animacao para quando
     o dado envelhece — indicador animado sobre numero velho engana. */
  .pulso{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--green);margin-right:6px;vertical-align:middle;
    animation:bate 1.6s ease-in-out infinite;}
  .pulso.parado{background:var(--amber);animation:none;}
  @keyframes bate{
    0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,.55);}
    70%{opacity:.75;box-shadow:0 0 0 7px rgba(74,222,128,0);}
  }
  @media print{ .pulso{animation:none;} }

  .empty{text-align:center;padding:40px 20px;color:var(--gray);
    font-family:'DM Mono',monospace;font-size:12px;}
  .loading{text-align:center;padding:80px 20px;color:var(--gray);
    font-family:'DM Mono',monospace;font-size:13px;}
</style>

<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="eyebrow">Board Academy · Marketing · Visão Geral</div>
      <h1>PERFORMANCE</h1>
    </div>
    <div class="header-right">
      <span id="tmeHeader"></span>
      <div class="metrica-switch">
        <button class="metrica-btn active" data-metrica="leads"
                onclick="trocarMetrica('leads')">Leads</button>
        <button class="metrica-btn" data-metrica="mqls"
                onclick="trocarMetrica('mqls')">MQL</button>
      </div>
      <div class="date-range">
        <span class="date-label">De</span>
        <input type="date" class="date-input" id="dataInicio">
        <span class="date-sep">→</span>
        <span class="date-label">Até</span>
        <input type="date" class="date-input" id="dataFim">
      </div>
      <button class="btn" id="btnComparar" onclick="alternarComparar()"
              title="Comparar com outro período: mostra a variação % em cada número">⇄ Comparar</button>
      <div class="date-range" id="compareRange" style="display:none">
        <span class="date-label" style="color:var(--amber)">vs</span>
        <input type="date" class="date-input" id="compInicio">
        <span class="date-sep">→</span>
        <input type="date" class="date-input" id="compFim">
      </div>
      <button class="btn" id="btnAtualizar" onclick="carregar()">⟳ Atualizar</button>
      <button class="btn" id="btnBase" onclick="alternarBase()">Base</button>
      <button class="btn" id="btnGanhos" onclick="alternarGanhos()">Ganhos</button>
      <button class="btn" id="btnDescartes" onclick="alternarDescartes()">Descartes</button>
      <button class="btn" id="btnCampanhas" onclick="alternarCampanhas()"
              title="Em validação — os números ainda estão sendo conferidos"
              style="border-style:dashed">Campanhas ⚠</button>
      <button class="btn" id="btnReport" onclick="alternarReport()">Report</button>
      <button class="btn" onclick="exportarPDF()">↓ PDF</button>
      <span class="user-info" id="userInfo"></span>
      <span id="statusAtualizacao"></span>
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="print-header" id="printHeader"></div>

  <div class="produtos" id="produtoTabs"></div>

  <div class="status-bar">
    <span id="statusTexto">Carregando dados…</span>
    <span class="filtro-ativo" id="filtroAtivo" onclick="limparFiltros()"></span>
  </div>

  <div id="conteudo">
    <div class="loading">Buscando dados da planilha…</div>
  </div>

</div>

<script>
// ── Sessão ──────────────────────────────────────────────────────────────────
const SESSION_TOKEN = sessionStorage.getItem('funil_token');
if (!SESSION_TOKEN) window.location.href = '/login.html';
document.getElementById('userInfo').textContent = sessionStorage.getItem('funil_user') || '';

// Usa a impressao do navegador: o usuario escolhe "Salvar como PDF".
// Sem biblioteca externa, e os graficos saem em vetor no lugar de foto.
function exportarPDF() {
  rastrear('exportar_pdf', produtoAtivo);
  // O PDF e' sempre do report — a tela cheia nao cabe numa folha
  const voltar = !modoReport;
  if (voltar) alternarReport();

  const ini = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const br  = d => d ? d.split('-').reverse().join('/') : '';

  document.getElementById('printHeader').innerHTML = `
    <div class="print-titulo">
      <span class="print-marca">Board Academy · Marketing</span>
      <h2>${produtoAtivo}</h2>
    </div>
    <div class="print-meta">
      <div>Período: ${br(ini)} a ${br(fim)}</div>
      <div>Métrica: ${rotuloMetrica()}</div>
      <div>Gerado em ${new Date().toLocaleString('pt-BR')}</div>
      ${dados && dados.dadosDe ? `<div>Dados de ${dados.dadosDe}</div>` : ''}
    </div>`;

  // Espera o report montar e os graficos desenharem
  setTimeout(async () => {
    const trocados = await congelarGraficos();
    window.print();
    setTimeout(() => {
      descongelarGraficos(trocados);
      if (voltar) alternarReport();
    }, 500);
  }, 400);
}

// Troca cada <canvas> por um <img> com o mesmo desenho.
//
// A imagem se adapta a qualquer altura via CSS, entao o grafico deixa de
// depender do Chart.js recalcular durante a impressao. O await no decode
// e' essencial: o data URL e' gerado na hora, mas o navegador ainda precisa
// decodificar antes de conseguir pintar. Sem esperar, o print sai com a
// imagem em branco.
async function congelarGraficos() {
  const trocados = [];
  const aguardando = [];

  document.querySelectorAll('.chart-box canvas').forEach(canvas => {
    let dados;
    try { dados = canvas.toDataURL('image/png', 1); }
    catch (e) { console.error('Não consegui capturar o gráfico:', e); return; }

    const img = document.createElement('img');
    img.className = 'chart-img';
    img.style.cssText = 'width:100%;height:100%;object-fit:fill;display:block;';

    aguardando.push(new Promise(resolve => {
      img.onload  = resolve;
      img.onerror = resolve;   // segue mesmo se falhar
      img.src = dados;
    }));

    canvas.style.display = 'none';
    canvas.parentElement.appendChild(img);
    trocados.push({ canvas, img });
  });

  await Promise.all(aguardando);
  // Um frame a mais garante que o layout ja considerou as imagens
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  return trocados;
}

function descongelarGraficos(trocados) {
  (trocados || []).forEach(({ canvas, img }) => {
    img.remove();
    canvas.style.display = '';
  });
  Object.values(charts).forEach(c => {
    try { c && c.resize(); } catch (e) { /* ignora */ }
  });
}

function logout() {
  rastrear('logout');
  enviarFila();
  sessionStorage.removeItem('funil_token');
  sessionStorage.removeItem('funil_user');
  window.location.href = '/login.html';
}

// ── Rastreio de uso ─────────────────────────────────────────────────────────
// Cada acao vira um evento enviado pro /api/track, que grava na aba EVENTOS.
// O contrato e' o do backend: { events: [{ timestamp, type, details }] },
// onde details pode ser objeto — o track.js faz JSON.stringify.
//
// Os eventos vao em lote (a cada 3s ou 15 eventos): sem isso, clicar em
// cinco filtros seguidos dispararia cinco requisicoes.
const filaEventos = [];
let timerFila = null;

function rastrear(type, detalhe = '') {
  filaEventos.push({
    timestamp: new Date().toISOString(),
    type,
    details: {
      // O que o usuario fez
      alvo: String(detalhe).slice(0, 120),
      // Onde ele estava quando fez
      produto: produtoAtivo,
      metrica,
      modo: modoGanhos ? 'ganhos'
          : modoDescartes ? 'descartes'
          : modoCampanhas ? 'campanhas'
          : modoReport ? 'report' : 'dashboard',
      periodo: `${document.getElementById('dataInicio')?.value || ''} a ${
        document.getElementById('dataFim')?.value || ''}`,
      filtros: Object.entries(filtros)
        .filter(([, v]) => v)
        .map(([k, v]) => `${k}=${v}`)
        .join('; ') || null,
    },
  });

  clearTimeout(timerFila);
  timerFila = setTimeout(enviarFila, 3000);

  // Nao deixa a fila crescer se o usuario clicar muito
  if (filaEventos.length >= 15) enviarFila();
}

function enviarFila() {
  if (!filaEventos.length) return;
  const lote = filaEventos.splice(0, filaEventos.length);

  // keepalive faz a requisicao sobreviver ao fechamento da aba — e, ao
  // contrario do sendBeacon, permite mandar o Authorization que o
  // track.js exige.
  fetch('/api/track', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${SESSION_TOKEN}`,
    },
    body: JSON.stringify({ events: lote }),
    keepalive: true,
  }).catch(e => {
    // Rastreio nunca pode atrapalhar o uso do dashboard
    console.debug('rastreio falhou:', e.message);
  });
}

// Ao sair da pagina ou trocar de aba, manda o que ficou pendente
window.addEventListener('pagehide', enviarFila);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') enviarFila();
});

// ── Estado ──────────────────────────────────────────────────────────────────
const CONSOLIDADO = 'CONSOLIDADO';

// Os tres funis de venda direta. Ganham barra propria no grafico principal.
const FUNIS_PRINCIPAIS = ['SNIPER', 'ELITE', 'OLYMPUS'];
const PRODUTOS_REAIS = ['PFCC BRASIL', 'PFCC MÉXICO', 'PFCC CHILE', 'LEAN', 'CES'];

// Lean e CES qualificam MQL por pontuacao, nao por cargo. O corte espelha o
// MQL_SCORE_MINIMO do update_all.py — se mudar la, muda aqui.
// Uma cor por produto, usada nas linhas do CPMQL diario
const CORES_PRODUTO = {
  'PFCC BRASIL': '#4a9eed',
  'PFCC MÉXICO': '#7ee0a8',
  'PFCC CHILE':  '#d9a441',
  'LEAN':        '#b07de0',
  'CES':         '#e07d7d',
};

// Quem entra no TME. E' lista de PESSOAS, nao de funil: o mesmo SDR pode
// atender lead de funis diferentes, e um funil pode ter gente que nao faz
// prospecao. Fora dessa lista, o "primeiro contato" nao tem o mesmo
// significado e diluiria o numero.
//
// Ao alterar: a comparacao e' pelo nome do proprietario no Pipedrive,
// sem acento e sem caixa. Nome escrito diferente simplesmente nao casa e
// a pessoa some do TME sem aviso.
// Meta de atendimento: 5 minutos entre a entrada do lead e o primeiro
// contato. Em horas, porque é a unidade em que o TME é calculado.
const TME_META = 5 / 60;

const SDRS_TME = {
  'Gabriela Turetta':  'Orion',
  'Leonardo Dutra':    'Orion',
  'Ollavo Costa':      'Orion',
  'Alisson Santos':    'Olympus',
  'Bruna Goes':        'Olympus',
  'Marlon Silva':      'Olympus',
  'Raphaela Moutinho': 'Olympus',
  'Vitor Soares':      'Olympus',
  'Priscila Ribeiro':  'Vanguard',
  // LATAM cobre México e Chile juntos: os cinco atendem os dois países,
  // entao nao da pra separar por pais so pelo proprietario
  'Sarah Leite':        'LATAM',
  'Thiago Santos':      'LATAM',
  'Gabriela Morais':    'LATAM',
  'Luanna Martins':     'LATAM',
  'Wellington Andrade': 'LATAM',
};

// Indexado sem acento pra sobreviver a variacao de escrita.
//
// Montado sob demanda, nao aqui: o semAcento e' declarado com const mais
// abaixo no arquivo, e const nao sofre hoisting. Usar ele nesta altura
// dava ReferenceError no carregamento e a pagina inteira ficava em branco.
let _sdrsChave = null;
let _sdrsTime  = null;

function _indexarSDRs() {
  if (_sdrsChave) return;
  _sdrsChave = new Set();
  _sdrsTime  = {};
  for (const [nome, time] of Object.entries(SDRS_TME)) {
    const k = semAcento(nome);
    _sdrsChave.add(k);
    _sdrsTime[k] = time;
  }
}

const ehSDR = b => {
  _indexarSDRs();
  return _sdrsChave.has(semAcento(b && b.proprietario));
};

// Time do SDR, pra comparar Orion e Olympus separados
const timeDoSDR = b => {
  _indexarSDRs();
  return _sdrsTime[semAcento(b && b.proprietario)] || null;
};

// Diz se um nome de proprietario esta na lista — usado na tabela
const nomeEhSDR = nome => {
  _indexarSDRs();
  return _sdrsChave.has(semAcento(nome));
};

const PRODUTOS_COM_SCORE = ['LEAN', 'CES'];
const SCORE_MINIMO = 6;
const ORDEM_PRODUTOS = [CONSOLIDADO, ...PRODUTOS_REAIS];

// Metas do mes. Deixe null no que ainda nao tem meta — o card simplesmente
// nao mostra a linha, e o grafico nao desenha a linha de ritmo.
// Investimento do Brasil = 427.722 total menos os outros quatro produtos.
// Metas em revisão: o planejamento novo vem por aba da planilha, com
// valor por dia e por produto. Enquanto isso os cards mostram só o
// realizado — número de meta desatualizado na tela é pior que nenhum,
// porque ninguém sabe que está velho.
//
// A estrutura fica: quando o previsto chegar, é só preencher de volta.
// Metas de setembro/2026.
//
// O CONSOLIDADO e' a soma dos cinco produtos; CPL, CPMQL, CAC e ROAS dele
// sao recalculados da soma, nao a media dos produtos — media de razao nao
// da a razao do todo.
//
// null = sem meta. O card mostra so o realizado, sem barra nem projecao.
const METAS = {
  [CONSOLIDADO]:  { leads: 6068, mqls: 4247, faturamento: 2473718, investimento: 559850,
                    vendas: 169, cpl: 92,  cpmql: 132, cac: 3313, roas: 4.42 },
  'PFCC BRASIL':  { leads: 4518, mqls: 3162, faturamento: 1929475, investimento: 469850,
                    vendas: 126, cpl: 104, cpmql: 149, cac: 3714, roas: 4.11 },
  'PFCC MÉXICO':  { leads: 500,  mqls: 350,  faturamento: 252000,  investimento: 40000,
                    vendas: 14,  cpl: 80,  cpmql: 114, cac: 2857, roas: 6.30 },
  'PFCC CHILE':   { leads: 250,  mqls: 175,  faturamento: 84000,   investimento: 20000,
                    vendas: 7,   cpl: 80,  cpmql: 110, cac: 2857, roas: 4.20 },
  'LEAN':         { leads: 405,  mqls: 284,  faturamento: 75611,   investimento: 15000,
                    vendas: 11,  cpl: 37,  cpmql: 53,  cac: 1321, roas: 5.04 },
  'CES':          { leads: 395,  mqls: 276,  faturamento: 132632,  investimento: 15000,
                    vendas: 11,  cpl: 38,  cpmql: 54,  cac: 1357, roas: 8.84 },
};
const CORES_REDE = { Meta: '#4a6dd4', Google: '#2980b9', LinkedIn: '#0e76a8' };

// Etapas que existem no Pipedrive mas nao fazem parte do funil de venda.
// Ficam de fora do card e nao entram no calculo do percentual.
const ETAPAS_IGNORADAS = ['reabertura'];

// Etapas que significam "houve conexao com o lead" — base da taxa de conexao.
// Comparadas sem acento, entao 'validacao' pega 'VALIDAÇÃO DE REUNIÃO'.
const ETAPAS_CONECTADAS = [
  'contatado', 'oportunidade', 'agendados', 'no show', 'noshow',
  'validacao', 'negociacao', 'inscricao',
];

// Ordem real do processo. Contatado vem depois das Etapas 1-3, nao logo
// apos a Aplicacao — as etapas numeradas sao as tentativas de contato.
const ORDEM_ETAPAS = [
  'aplicacao', 'em agendamento',
  'etapa 1', 'etapa 2', 'etapa 3',
  'contatado', 'oportunidade', 'proposta',
  'agendados', 'no show', 'validacao de reuniao', 'reuniao',
  'em negociacao', 'negociacao', 'inscricao em andamento', 'futuro'
];

// Existem quatro entradas de lead e mais nenhuma: Meta, LinkedIn, Google
// e Organico. As campanhas que nao sao de aquisicao (eventos, pesquisa,
// coautoria) ja foram descartadas pelo update_all.py antes de chegar aqui —
// entao tudo que nao carrega marca de midia paga e' organico.
function redeDoLead(b) {
  const s = (b.source || '').toLowerCase().trim();
  const bruto = (b.campanha || '').trim();
  const c = bruto.toUpperCase();

  if (s.includes('lkdn') || s.includes('linkedin') ||
      c.includes('[LKDN]') || c.includes('LINKEDIN')) return 'LinkedIn';

  if (s.includes('googleads') || s.includes('google') || s.includes('adwords') ||
      c.includes('[GOOGLE]') || /^\d{10,}$/.test(bruto)) return 'Google';

  if (s.includes('fbads') || s.includes('facebook') || s.includes('meta') ||
      s.includes('instagram') || s === 'fb' || s === 'ig' ||
      c.includes('[META]')) return 'Meta';

  return 'Orgânico';
}

const REDES = ['LinkedIn', 'Google', 'Meta', 'Orgânico'];

// Os cargos vem digitados de mil formas. Aqui agrupamos nos grandes blocos
// pra tabela nao virar uma lista de 200 variacoes com 1 lead cada.
//
// Cada grupo e' uma regex, nao um "includes" simples: siglas curtas como CEO
// e COO precisam de limite de palavra, senao "Coordenador" vira C-Level
// (contem "coo") e "Director" tambem (contem "cto").
// A ordem importa — Vice-Presidente e' testado antes de Presidente.
const GRUPOS_CARGO = [
  ['Vice-Presidente',      /\b(vice[- ]?presidente|vice[- ]?president|\bvp\b)/],
  ['Presidente / CEO',     /\b(presidente|president|ceo|chief executive)\b/],
  ['Sócio / Fundador',     /\b(socio|sócio|partner|founder|fundador|propriet[aá]rio|owner|empres[aá]rio|entrepreneur)/],
  ['C-Level',              /\b(cmo|cto|coo|cfo|cpo|ciso|chro|cro|cio|c-level|c level)\b|\bchief\b/],
  ['Conselheiro',          /\b(conselh|advisor|board member)/],
  ['Diretor',              /\b(diretor|director|head)\b|\bdiretor/],
  ['Gerente',              /\b(gerente|manager|gestor)/],
  ['Coordenador',          /\b(coordenador|coordinator|supervisor)/],
  ['Consultor',            /\b(consultor|consultant|assessor)/],
  ['Profissional Liberal', /\b(profissional liberal|m[eé]dico|advogado|engenheiro|professor|dentista)/],
  ['Analista / Técnico',   /\b(analista|analyst|t[eé]cnico|assistente|estagi[aá]rio)/],
];

function normalizarCargo(cargo) {
  const c = (cargo || '').toLowerCase().trim();
  if (!c || c === 'outro' || c === 'outros') return 'Não informado';
  for (const [rotulo, regex] of GRUPOS_CARGO) {
    if (regex.test(c)) return rotulo;
  }
  return 'Outros';
}

const semAcento = s => (s || '').toLowerCase().trim()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function ordenarEtapas(etapas) {
  return etapas
    .filter(e => !ETAPAS_IGNORADAS.some(x => semAcento(e.etapa).includes(x)))
    .sort((a, b) => {
    const ia = ORDEM_ETAPAS.findIndex(e => semAcento(a.etapa).includes(e));
    const ib = ORDEM_ETAPAS.findIndex(e => semAcento(b.etapa).includes(e));
    if (ia === -1 && ib === -1) return b.qtd - a.qtd;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

let dados = null;            // resposta crua da API
let produtoAtivo = CONSOLIDADO;
// Modo de comparacao: quando ligado, os cards e tabelas mostram a
// variacao % contra o periodo em compInicio/compFim.
let comparando = false;

// Contador de leads mostrado na barra de status. Guardado aqui porque o
// render() reescreve o elemento pra encaixar os avisos de comparacao.
let textoStatus = 'Carregando dados…';

// Marca se o usuario editou as datas de comparacao a mao. Enquanto nao
// editar, elas seguem o filtro principal automaticamente.
let compManual = false;

// Periodo imediatamente anterior, do mesmo tamanho.
//
// Precisa ser recalculado toda vez que o filtro principal muda: sem isso a
// janela de comparacao fica presa no que foi sugerido da primeira vez, e o
// usuario acaba comparando um mes inteiro contra tres dias — foi assim que
// apareceu um "+927%" que nao queria dizer nada.
function periodoAnterior(ini, fim) {
  if (!ini || !fim) return null;
  const a = new Date(ini + 'T00:00:00');
  const b = new Date(fim + 'T00:00:00');
  const dias = Math.round((b - a) / 86400000) + 1;
  const fimC = new Date(a);
  fimC.setDate(fimC.getDate() - 1);
  const iniC = new Date(fimC);
  iniC.setDate(iniC.getDate() - dias + 1);
  const iso = d => `${d.getFullYear()}-${
    String(d.getMonth() + 1).padStart(2, '0')}-${
    String(d.getDate()).padStart(2, '0')}`;
  return { ini: iso(iniC), fim: iso(fimC), dias };
}

// Chamado sempre que o filtro principal muda
function sincronizarComparacao() {
  if (!comparando || compManual) return;
  const p = periodoAnterior(
    document.getElementById('dataInicio').value,
    document.getElementById('dataFim').value);
  if (!p) return;
  document.getElementById('compInicio').value = p.ini;
  document.getElementById('compFim').value    = p.fim;
}

// Aviso quando os dois periodos tem tamanhos diferentes: comparar 31 dias
// com 3 nao e' erro de codigo, mas o numero nao quer dizer nada.
// Qual janela esta sendo comparada, por extenso. Sem isso o usuario ve
// "+20%" e nao sabe contra o que.
function rotuloComparacao() {
  const i = document.getElementById('compInicio').value;
  const f = document.getElementById('compFim').value;
  if (!i || !f) return '';
  const br = d => d.split('-').reverse().join('/');
  return `<span class="rotulo-comp">vs ${br(i)} a ${br(f)}${
    compManual ? '' : ' · período anterior'}</span>`;
}

function avisoComparacao() {
  if (!comparando) return '';
  const iniA = document.getElementById('dataInicio').value;
  const fimA = document.getElementById('dataFim').value;
  const iniC = document.getElementById('compInicio').value;
  const fimC = document.getElementById('compFim').value;
  if (!iniA || !fimA || !iniC || !fimC) return '';
  const dias = (i, f) => Math.round(
    (new Date(f + 'T00:00:00') - new Date(i + 'T00:00:00')) / 86400000) + 1;
  // O backlog guarda a data como DD/MM, sem ano. Um periodo de
  // comparacao em outro ano casaria com as mesmas datas deste — o
  // resultado seria silenciosamente errado, entao avisamos alto.
  const anoAtual = new Date().getFullYear();
  if (Number(iniC.slice(0, 4)) !== anoAtual
      || Number(fimC.slice(0, 4)) !== anoAtual) {
    return `<span class="aviso-comp" title="O dashboard guarda as datas sem o ano, então não consegue separar ${
      iniC.slice(0, 4)} de ${anoAtual}. Escolha um período dentro de ${anoAtual}.">
      ⚠ comparação fora de ${anoAtual} — número não confiável</span>`;
  }

  const dA = dias(iniA, fimA), dC = dias(iniC, fimC);
  if (dA === dC) return '';
  return `<span class="aviso-comp" title="Períodos de tamanhos diferentes deixam a variação sem significado">
    ⚠ comparando ${dA} dia${dA === 1 ? '' : 's'} com ${dC}</span>`;
}

function alternarComparar() {

  document.getElementById('btnComparar').classList.toggle('ativo', comparando);

  if (comparando && !compManual) sincronizarComparacao();
  if (comparando && !document.getElementById('compInicio').value) {
    const p = periodoAnterior(
      document.getElementById('dataInicio').value,
      document.getElementById('dataFim').value);
    if (p) {
      document.getElementById('compInicio').value = p.ini;
      document.getElementById('compFim').value    = p.fim;
    }
  }
  rastrear('comparar_periodo', comparando ? 'ligado' : 'desligado');
  render();
}

// Executa fn() com as datas do periodo PRINCIPAL trocadas temporariamente
// pelas informadas, e devolve o resultado. Reaproveita toda a logica de
// dadosVisiveis() — que le o periodo do DOM — pra calcular qualquer outra
// janela, como a de comparacao, sem duplicar cada funcao.
function comPeriodo(ini, fim, fn) {
  const elIni = document.getElementById('dataInicio');
  const elFim = document.getElementById('dataFim');
  const origIni = elIni.value, origFim = elFim.value;
  elIni.value = ini; elFim.value = fim;
  try { return fn(); } finally { elIni.value = origIni; elFim.value = origFim; }
}

// Variacao % entre o valor atual e o do periodo de comparacao. null quando
// nao da pra calcular — base zero nao informa nada, so gera Infinity.
function deltaPct(atual, anterior) {
  if (anterior === null || anterior === undefined || anterior === 0) return null;
  if (atual === null || atual === undefined) return null;
  return (atual - anterior) / anterior * 100;
}

// HTML pronto do selo de variacao. menorMelhor inverte a cor (CPL, CAC,
// CPMQL: cair e' bom). So aparece com o modo de comparacao ligado.
// Conta por chave, pra comparar a mesma categoria em dois periodos.
// Usado nas barras de funil, cargo e proprietario: cada uma agrupa por um
// campo diferente, mas a comparacao e' sempre "quantos aqui, quantos la".
function contarPor(lista, fn) {
  const agg = {};
  for (const x of (lista || [])) {
    const k = fn(x);
    agg[k] = (agg[k] || 0) + 1;
  }
  return agg;
}

// Selo compacto pras barras. O badgeDelta normal ocupa espaco demais numa
// linha de funil, entao aqui vai so a seta e o numero.
function miniDelta(atual, anterior) {
  if (!comparando || anterior === undefined || anterior === null) return '';
  if (!anterior) {
    return `<span class="mini-delta" style="color:var(--green)"
      title="Não existia no período de comparação">novo</span>`;
  }
  const d = (atual - anterior) / anterior * 100;
  const cor = Math.abs(d) < 5 ? 'var(--gray)'
            : d > 0 ? 'var(--green)' : 'var(--red)';
  return `<span class="mini-delta" style="color:${cor}"
    title="Período de comparação: ${fmtNum(anterior)}">${
    d > 0 ? '+' : ''}${d.toFixed(0)}%</span>`;
}

function badgeDelta(atual, anterior, opts = {}) {
  if (!comparando) return '';
  const { menorMelhor = false, fmt = fmtNum } = opts;
  const d = deltaPct(atual, anterior);
  if (d === null) {
    return `<span class="kpi-delta neutro" title="Sem base de comparação">—</span>`;
  }
  const bom  = menorMelhor ? d < 0 : d > 0;
  const cor  = Math.abs(d) < 1 ? 'var(--gray-light)' : (bom ? 'var(--green)' : 'var(--red)');
  const seta = d > 0.5 ? '▲' : (d < -0.5 ? '▼' : '·');
  return `<span class="kpi-delta" style="color:${cor}"
    title="Período de comparação: ${fmt(anterior)}">${seta} ${Math.abs(d).toFixed(0)}%</span>`;
}

// ── Formatação ──────────────────────────────────────────────────────────────
const fmtNum = v => (v || 0).toLocaleString('pt-BR');
const fmtBRL = v => (v || 0).toLocaleString('pt-BR',
  { style:'currency', currency:'BRL', minimumFractionDigits:0, maximumFractionDigits:0 });
const fmtRoas = v => (v || 0).toFixed(2) + 'x';

// Data DD/MM → objeto Date do ano corrente, pra comparar com o range
function paraData(ddmm) {
  const [d, m] = ddmm.split('/');
  return new Date(new Date().getFullYear(), Number(m) - 1, Number(d));
}

// Le uma data DD/MM e diz se cai entre ini/fim (AAAA-MM-DD) explicitos —
// nao pega o periodo da tela. E' o que permite calcular um produto num
// intervalo qualquer, como o periodo de comparacao.
function noIntervalo(ddmm, ini, fim) {
  if (!ini || !fim) return true;
  const d = paraData(ddmm);
  return d >= new Date(ini + 'T00:00:00') && d <= new Date(fim + 'T00:00:00');
}

function dentroDoPeriodo(ddmm) {
  return noIntervalo(ddmm,
    document.getElementById('dataInicio').value,
    document.getElementById('dataFim').value);
}

// Resumo de UM produto num intervalo de datas explicito. Usado pelas abas
// de produto, pela tabela comparativa e pelo periodo de comparacao — em
// vez de ler dados.produtos[x].kpis (fechado do mes inteiro), soma o
// backlog e o investimento diario dentro da janela pedida.
//
// So respeita o filtro de rede, nao os outros (etapa, proprietario, cargo,
// score): esses fazem sentido olhando um produto de cada vez, e esta
// funcao serve justamente pra comparar varios produtos lado a lado.
function resumoProduto(nome, ini, fim) {
  const vazio = { leads:0, mqls:0, reaplicacoes:0, investimento:0,
                   ganhos:0, faturamento:0, cpl:0, cpmql:0, cac:0, roas:0 };
  const p = dados.produtos[nome];
  if (!p) return vazio;

  const alvo = semAcento(nome);
  let leadsBacklog = dados.backlog
    .filter(b => semAcento(b.produto) === alvo)
    .filter(b => {
      const dia = (b.aplicacao || '').trim().slice(0, 5);
      return dia.includes('/') && noIntervalo(dia, ini, fim);
    });
  if (filtros.rede) leadsBacklog = leadsBacklog.filter(b => redeDoLead(b) === filtros.rede);

  const leads = leadsBacklog.length;
  const mqls  = leadsBacklog.filter(b => b.mql).length;
  const reaplicacoes = leadsBacklog.filter(b => b.reaplicacao).length;

  // Investimento dia a dia, igual dadosVisiveis() faz pro card principal
  let investimento = 0;
  const diaPorRede = p.investDiaRede || {};
  if (Object.keys(diaPorRede).length) {
    for (const [rede, dias] of Object.entries(diaPorRede)) {
      if (filtros.rede && filtros.rede !== rede) continue;
      for (const [dia, val] of Object.entries(dias)) {
        if (noIntervalo(dia, ini, fim)) investimento += val;
      }
    }
  } else {
    // API antiga, sem quebra diaria: total do mes inteiro e' melhor que zero
    for (const [rede, total] of Object.entries(p.investPorRede || {})) {
      if (filtros.rede && filtros.rede !== rede) continue;
      investimento += total;
    }
  }

  let ganhos = (p.ganhos || []).filter(g => noIntervalo(g.data, ini, fim));
  if (filtros.rede) ganhos = ganhos.filter(g => redeDoLead(g) === filtros.rede);
  const validos = ganhos.filter(g => g.vale === 'sim');
  const qtdGanhos = validos.length;
  const faturamento = validos.reduce((s, g) => s + g.valor, 0);

  return {
    leads, mqls, reaplicacoes, investimento,
    ganhos: qtdGanhos, faturamento,
    cpl:   leads ? investimento / leads : 0,
    cpmql: mqls   ? investimento / mqls   : 0,
    cac:   qtdGanhos ? investimento / qtdGanhos : 0,
    roas:  investimento ? faturamento / investimento : 0,
  };
}

// ── Carga ───────────────────────────────────────────────────────────────────
async function carregar() {
  const btn = document.getElementById('btnAtualizar');
  btn.disabled = true; btn.textContent = 'Carregando…';
  document.getElementById('statusTexto').textContent = 'Buscando dados da planilha…';

  try {
    const r = await fetch('/api/dashboard', { headers: { Authorization: `Bearer ${SESSION_TOKEN}` } });
    if (r.status === 401) { logout(); return; }
    const json = await r.json();
    if (!r.ok) throw new Error(json.error || 'Erro ao carregar');

    dados = json;
    rastrear('carregar_dados', `${json.backlog?.length || 0} leads`);
    renderTabs();
    render();

    const qtd = Object.keys(dados.produtos).length;
    textoStatus = `${qtd} produtos · ${fmtNum(dados.backlog.length)} leads no backlog`;
    document.getElementById('statusTexto').textContent = textoStatus;
    mostrarAtualizacao(dados.dadosDe);
  } catch (err) {
    document.getElementById('conteudo').innerHTML =
      `<div class="empty">Não foi possível carregar: ${err.message}</div>`;
    document.getElementById('statusTexto').textContent = 'Erro ao carregar';
  } finally {
    btn.disabled = false; btn.textContent = '⟳ Atualizar';
  }
}

// ── Idade do dado ───────────────────────────────────────────────────────────
// O update_all.py roda 3x ao dia. Se der problema no GitHub Actions, o
// dashboard continua abrindo com os numeros de ontem sem nenhum aviso — foi
// pra isso que o carimbo existe. Acima de 12h a cor vira alerta.
function mostrarAtualizacao(carimbo) {
  const el = document.getElementById('statusAtualizacao');
  if (!el) return;

  if (!carimbo) {
    el.innerHTML = '';
    return;
  }

  // Vem como "20/08/2026 14:32"
  const m = String(carimbo).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (!m) {
    el.innerHTML = `<span class="atualizacao">${carimbo}</span>`;
    return;
  }

  const [, d, mes, a, h, min] = m;
  const quando = new Date(+a, +mes - 1, +d, +h, +min);
  const horas  = (Date.now() - quando.getTime()) / 36e5;

  let idade;
  if (horas < 1)       idade = 'agora';
  else if (horas < 24) idade = `há ${Math.floor(horas)}h`;
  else                 idade = `há ${Math.floor(horas / 24)}d`;

  // 12h e' uma rodada e meia: abaixo disso o atraso e' normal
  const velho = horas >= 12;

  // A data completa fica no title. No cabecalho so a hora e a idade —
  // "31/08/2026 16:45" ao lado dos botoes vira ruido, e o que a pessoa
  // quer saber e' se o numero esta velho.
  el.innerHTML = `<span class="atualizacao ${velho ? 'velho' : ''}"
    title="${velho
      ? 'A planilha não é atualizada há mais de 12h — confira o GitHub Actions'
      : 'Última gravação da planilha pelo update_all.py'}: ${carimbo}">
    <span class="ponto"></span>${h}:${min}
    <span class="idade">${idade}</span>${velho ? ' ⚠' : ''}
  </span>`;
}

// ── Abas de produto ─────────────────────────────────────────────────────────
// Le o periodo da tela e soma cada produto dentro dele — antes usava
// dados.produtos[x].kpis.leads, que e' o total FECHADO do mes inteiro e

function renderTabs() {
  const ini = document.getElementById('dataInicio').value;

  const porProduto = {};

  }).join('');
}
