          <tbody>
            ${linhas.map(l => `
              <tr class="clicavel ${campanhaAberta === l.chave ? 'selecionado' : ''}"
                  onclick="abrirCampanha(${attr(l.chave)})">
                <td title="${l.rotulo}">${
                  campanhaAberta === l.chave ? '▾ ' : ''}${
                  l.rotulo.length > 52 ? l.rotulo.slice(0, 52) + '…' : l.rotulo}</td>
                <td style="color:var(--gray-light)">${l.rede || '—'}</td>
                <td class="num">${fmtBRL(l.investimento)}</td>
                <td class="num">${fmtNum(l.leads)}</td>
                <td class="num" style="color:var(--blue)">${fmtNum(l.mqls)}</td>
                <td class="num">${num(l.txMql, x => x.toFixed(0) + '%')}</td>
                <td class="num">${num(l.cpl, fmtBRL)}</td>
                <td class="num">${num(l.cpmql, fmtBRL)}</td>
                <td class="num">${l.ganhos ? fmtNum(l.ganhos) : '—'}</td>
                <td class="num" style="color:${
                  l.faturamento ? 'var(--green)' : 'var(--gray)'}">${
                  l.faturamento ? fmtBRL(l.faturamento) : '—'}</td>
                <td class="num">${num(l.cac, fmtBRL)}</td>
                <td class="num" style="color:${
                  l.roas === null ? 'var(--gray)'
                  : l.roas >= 1 ? 'var(--green)' : 'var(--red)'}">${
                  num(l.roas, fmtRoas)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  if (aberta) desenharGraficoCampanha(aberta);
}

// ── Grafico do drill-down ───────────────────────────────────────────────────
// Barras de leads e MQL no eixo esquerdo, linha de CPMQL no direito.
// Sao grandezas diferentes: sem o segundo eixo, um CPMQL de 300 achataria
// as barras de 20 leads ate sumirem.
function desenharGraficoCampanha(linha) {
  // O render trocou o innerHTML inteiro, entao os canvas antigos ja sairam
  // do DOM. Destruir aqui evita o Chart.js segurar referencia morta.
  Object.values(charts).forEach(c => {
    try { c && c.destroy(); } catch (e) { /* canvas ja removido */ }
  });
  charts = {};

  // So os dias que existem, ordenados por data de verdade — ordenar
  // "10/08" como texto colocaria ele antes de "09/08"
  const dias = Object.keys(linha.porDia)
    .filter(d => d.includes('/'))
    .sort((a, b) => paraData(a) - paraData(b));

  if (!dias.length) {
    const box = document.getElementById('chartCampanha');
    if (box && box.parentElement) {
      box.parentElement.innerHTML =
        '<div class="empty">Sem movimento diário nesta linha.</div>';
    }
    return;
  }

  const leads = dias.map(d => linha.porDia[d].leads || 0);
  const mqls  = dias.map(d => linha.porDia[d].mqls  || 0);
  const cpmql = dias.map(d => {
    const p = linha.porDia[d];
    // null onde falta investimento ou MQL: o ponto some em vez de cair
    // pra zero e puxar a escala inteira pra baixo
    return p.inv && p.mqls ? Math.round(p.inv / p.mqls) : null;
  });

  charts.campanha = comCanvas('chartCampanha', el => new Chart(el, {
    data: {
      labels: dias,
      datasets: [
        { type:'bar', label:'Leads', data: leads, yAxisID:'y',
          backgroundColor:'#2c5f8a', borderRadius:2, order: 3,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-2, color:'#9dc4e8',
            font:{ family:'DM Mono', size:10 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL', data: mqls, yAxisID:'y',
          backgroundColor:'#4a9eed', borderRadius:2, order: 2,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-2, color:'#cfe4f7',
            font:{ family:'DM Mono', size:10 }, formatter: v => fmtNum(v) } },
        { type:'line', label:'CPMQL', data: cpmql, yAxisID:'y1',
          borderColor:'#d9a441', borderWidth:2.5, tension:.3, spanGaps:true,
          pointRadius:4, pointHoverRadius:6, pointBackgroundColor:'#d9a441',
          order: 1,
          datalabels: {
            display: ctx => ctx.dataset.data[ctx.dataIndex] !== null,
            anchor:'end', align:'top', offset:5, color:'#ffffff',
            font:{ family:'DM Mono', size:11, weight:500 },
            backgroundColor:'rgba(10,10,10,.82)',
            borderRadius:3, padding:{ top:2, bottom:2, left:5, right:5 },
            formatter: v => 'R$ ' + fmtNum(v) } },
      ],
    },
    options: {
      ...opcoesBase(),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        ...opcoesBase().plugins,
        legend: { display:true, labels:{ color:'#e8e8e8',
          font:{ family:'DM Mono', size:11 }, boxWidth:12, padding:14 } },
        tooltip: { ...opcoesBase().plugins.tooltip, callbacks: {
          label: ctx => {
            if (ctx.dataset.label !== 'CPMQL') {
              return ` ${ctx.dataset.label}: ${fmtNum(ctx.raw)}`;
            }
            if (ctx.raw === null) return ' CPMQL: sem MQL no dia';
            return ` CPMQL: ${fmtBRL(ctx.raw)}`;
          },
          afterBody: items => {
            const p = linha.porDia[dias[items[0].dataIndex]] || {};
            return 'Investimento ' + fmtBRL(p.inv || 0);
          },
        } },
      },
      scales: {
        x: { ticks:{ color:'#e8e8e8', font:{ family:'DM Mono', size:11 },
                     maxRotation: 45 },
             grid:{ color:'#1a1a1a' } },
        y: { beginAtZero:true, position:'left', grace:'12%',
             title:{ display:true, text:'Volume', color:'#9dc4e8',
                     font:{ family:'DM Mono', size:10 } },
             ticks:{ color:'#c8c8c8', font:{ family:'DM Mono', size:11 },
                     precision: 0 },
             grid:{ color:'#1c1c1c' } },
        y1:{ beginAtZero:true, position:'right', grace:'15%',
             title:{ display:true, text:'CPMQL', color:'#d9a441',
                     font:{ family:'DM Mono', size:10 } },
             grid:{ display:false },
             ticks:{ color:'#d9a441', font:{ family:'DM Mono', size:11 },
                     callback: val => 'R$ ' + fmtNum(val) } },
      },
    },
  }));
}

// ── Exportar a tabela de campanhas ──────────────────────────────────────────
function exportarCampanhasCSV() {
  const v = dadosVisiveis();
  const { linhas } = dadosCampanhas(v);
  if (!linhas.length) return;

  rastrear('exportar_campanhas', `${nivelCampanha}: ${linhas.length} linhas`);

  const rotuloNivel = { campanha: 'Campanha', conjunto: 'Conjunto', anuncio: 'Anúncio' }[nivelCampanha];
  const cabecalho = [
    rotuloNivel, 'Rede', 'Investimento', 'Leads', 'MQL', 'Taxa MQL',
    'CPL', 'CPMQL', 'Vol. Ganhos', 'Faturamento', 'CAC', 'ROAS',
  ];

  const escapa = t => {
    const s = String(t ?? '').replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };
  // Virgula decimal pro Excel BR reconhecer como numero
  const dec = n => n === null || n === undefined ? '' : String(n.toFixed(2)).replace('.', ',');

  const corpo = linhas.map(l => [
    l.rotulo, l.rede,
    dec(l.investimento), l.leads, l.mqls,
    l.txMql === null ? '' : dec(l.txMql),
    dec(l.cpl), dec(l.cpmql),
    l.ganhos, dec(l.faturamento), dec(l.cac), dec(l.roas),
  ].map(escapa).join(';'));

  // Primeira linha marca a planilha: o arquivo circula solto por e-mail e
  // ninguem lembra de onde veio nem que os numeros eram provisorios
  const marca = 'EM VALIDACAO - conferir antes de reportar;;;;;;;;;;;';
  const csv = '\uFEFF' + [marca, cabecalho.join(';'), ...corpo].join('\n');

  const hoje = new Date().toISOString().slice(0, 10);
  const nome = `campanhas_EM-VALIDACAO_${nivelCampanha}_${produtoAtivo}_${hoje}`
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w-]/g, '_').toLowerCase() + '.csv';

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Previsto de mídia ───────────────────────────────────────────────────────
// Vem da aba PREVISTO, uma linha por dia. O valor de cada produto é diário;
// a recarga é um total do dia, sem quebra por produto — por isso ela só
// aparece no Consolidado.
//
// Só conta dia que já passou: comparar o gasto de hoje com o previsto do
// mês inteiro diria que estamos sempre atrasados.
function previstoNoPeriodo() {
  const prev = (dados && dados.previsto) || {};
  const nomes = produtoAtivo === CONSOLIDADO ? PRODUTOS_REAIS : [produtoAtivo];

  const hoje = new Date();
  const chaveHoje = String(hoje.getDate()).padStart(2, '0') + '/'
                  + String(hoje.getMonth() + 1).padStart(2, '0');

  let ateHoje = 0, doMes = 0, recargaAteHoje = 0, recargaMes = 0;
  const porDia = {};

  for (const [dia, reg] of Object.entries(prev)) {
    if (!dentroDoPeriodo(dia)) continue;
    const v = nomes.reduce((s, n) => s + (reg.produtos[n] || 0), 0);
    porDia[dia] = v;
    doMes += v;
    recargaMes += reg.recarga || 0;
    // paraData compara como Date, entao a virada de mes nao quebra
    if (paraData(dia) <= paraData(chaveHoje)) {
      ateHoje += v;
      recargaAteHoje += reg.recarga || 0;
    }
  }

  return { porDia, ateHoje, doMes, recargaAteHoje, recargaMes,
           temDados: Object.keys(porDia).length > 0 };
}

// ── TME: quanto o lead esperou pelo primeiro contato ────────────────────────
// Sai do backlog, entao ja chega com produto, periodo e todos os filtros da
// tela — clicar num funil ou num proprietario mexe aqui junto.
//
// Mediana, nao media: um lead esquecido por 200 horas puxa a media e some
// na mediana, que descreve o atendimento tipico.
function calcTME(lista) {
  // So os SDRs da lista — ver SDRS_TME
  const base = (lista || []).filter(ehSDR);
  const v = base
    .filter(b => b.tme !== null && b.tme !== undefined)
    .map(b => b.tme);
  if (!v.length) return { med: null, media: null, n: 0, cobertura: 0 };
  const s = [...v].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return {
    med: s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2,
    media: s.reduce((a, b) => a + b, 0) / s.length,
    n: s.length,
    // Sobre os leads dos SDRs, nao sobre a lista inteira: senao a
    // cobertura pareceria baixa so por existir lead de outra gente
    cobertura: base.length ? s.length / base.length * 100 : 0,
  };
}

// Quantas horas desde a ultima gravacao da planilha. Decide se o pulso
// anima ou nao — ver o CSS de .pulso.
function idadeDoDado() {
  const m = String(dados && dados.dadosDe || '')
    .match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, d, mes, a, h, min] = m;
  return (Date.now() - new Date(+a, +mes - 1, +d, +h, +min).getTime()) / 36e5;
}

// Com meta de 5 minutos, o minuto é a unidade que importa: abaixo de uma
// hora mostramos minuto cheio, e só acima disso passamos para horas.
// Acima de 48h o número em horas fica ilegível e viramos para dias.
const fmtHoras = x => {
  if (x === null || x === undefined) return '—';
  const min = x * 60;
  // Abaixo de um minuto vai em segundos: com meta de 5 minutos, "0min"
  // seria lido como erro, e atendimento instantâneo existe.
  if (min < 1)  return Math.round(min * 60) + 's';
  if (x < 1)    return Math.round(min) + 'min';
  if (x < 48)   return x.toFixed(1).replace('.', ',') + 'h';
  return Math.round(x / 24) + 'd';
};

function cardTME(v, vComp) {
  const t = calcTME(v.backlog);
  // TME menor e' melhor: atender rapido e' o objetivo
  const tC = vComp ? calcTME(vComp.backlog) : null;
  const dTME = (tC && tC.n)
    ? badgeDelta(t.med, tC.med, { fmt: fmtHoras, menorMelhor: true }) : '';
  // Separado porque MQL e lead comum costumam ter fila diferente, e a
  // mediana dos dois junto esconde isso
  const tm = calcTME(v.backlog.filter(b => b.mql));
  const tl = calcTME(v.backlog.filter(b => !b.mql));

  // TME de hoje: so os leads que ENTRARAM hoje. E' um retrato parcial por
  // natureza — quem entrou as 18h ainda nao teve tempo de ser atendido, e
  // so aparece aqui quem ja foi. De manha o numero e' pouco confiavel.
  const hoje = new Date();
  const chaveHoje = String(hoje.getDate()).padStart(2, '0') + '/'
                  + String(hoje.getMonth() + 1).padStart(2, '0');
  const td = calcTME(v.backlog.filter(
    b => (b.aplicacao || '').trim().slice(0, 5) === chaveHoje));

  // Por time: e' a comparacao que interessa na reuniao. A mediana de
  // todos juntos esconde diferenca de operacao entre eles.
  //
  // Os times saem da propria lista de SDRs, nao ficam fixos aqui: incluir
  // alguem de um time novo ja passa a mostrar a linha dele.
  const times = [...new Set(Object.values(SDRS_TME))];
  const porTime = times.map(nome => ({
    nome,
    t: calcTME(v.backlog.filter(b => timeDoSDR(b) === nome)),
    // Quem esta nele, pro tooltip. Nome completo: ha duas Gabrielas em
    // times diferentes, e so o primeiro nome as confundiria.
    quem: Object.entries(SDRS_TME)
      .filter(([, tm]) => tm === nome)
      .map(([p]) => p).join(' · '),
  }));

  const horas = idadeDoDado();
  // 3h e' meia rodada: abaixo disso o numero e' recente o bastante pra
  // ser tratado como "agora"
  const fresco = horas !== null && horas < 3;

  if (!t.n) return '';   // sem contato registrado, o bloco nao aparece

  const alerta = t.cobertura < 50;

  // Quantos foram atendidos dentro da meta. É o número que o time
  // persegue — a mediana sozinha não diz se a régua está sendo cumprida.
  const noPrazo = v.backlog.filter(
    b => ehSDR(b) && b.tme !== null && b.tme !== undefined
         && b.tme <= TME_META).length;
  const pctPrazo = t.n ? noPrazo / t.n * 100 : 0;
  const nomes = Object.keys(SDRS_TME).join(', ');
  return `<div class="tme-box" title="Tempo médio de espera: da entrada do lead até a primeira ligação ou mensagem. Conta horas úteis, 8h-20h de segunda a sábado.&#10;&#10;SDRs: ${nomes}">
    <div class="tme-principal">
      <span class="tme-rot"><span class="pulso ${fresco ? '' : 'parado'}"
        title="${horas === null ? 'sem carimbo de atualização'
          : fresco ? 'dado das últimas 3 horas'
          : `planilha atualizada há ${Math.floor(horas)}h`}"></span>TME</span>
      <span class="tme-val">${fmtHoras(t.med)}</span>${dTME}
      <span class="tme-sub">${Object.keys(SDRS_TME).length} SDRs</span>
    </div>
    <div class="tme-quebra">
      <span class="tme-linha"><span>hoje</span>
        <b style="color:${td.n ? 'var(--green)' : 'var(--gray)'}"
          title="${td.n ? fmtNum(td.n) + ' leads que entraram hoje e já foram contatados'
            : 'nenhum lead de hoje foi contatado ainda'}">${
          td.n ? fmtHoras(td.med) : '—'}</b></span>
      <span class="tme-linha mql"><span>MQL</span>
        <b title="${fmtNum(tm.n)} contatados">${
          tm.n ? fmtHoras(tm.med) : '—'}</b></span>
      <span class="tme-linha"><span>Lead</span>
        <b title="${fmtNum(tl.n)} contatados">${
          tl.n ? fmtHoras(tl.med) : '—'}</b></span>
    </div>
    <div class="tme-quebra">
      ${porTime.map(x => `
      <span class="tme-linha"><span>${x.nome}</span>
        <b title="${fmtNum(x.t.n)} contatados · ${x.quem}">${
          x.t.n ? fmtHoras(x.t.med) : '—'}</b></span>`).join('')}
      <span class="tme-linha"><span>≤ 5min</span>
        <b style="color:${pctPrazo >= 50 ? 'var(--green)'
            : pctPrazo >= 20 ? 'var(--amber)' : 'var(--red)'}"
          title="${fmtNum(noPrazo)} de ${fmtNum(t.n)} leads atendidos dentro da meta de 5 minutos">${
          pctPrazo.toFixed(0)}%</b></span>
      <span class="tme-linha"><span>cobertura</span>
        <b style="color:${alerta ? 'var(--amber)' : 'var(--gray-light)'}"
          title="${fmtNum(t.n)} contatados${
            alerta ? ' — abaixo de 50% o TME mede quem registra, não quem atende' : ''}">${
          t.cobertura.toFixed(0)}%</b></span>
    </div>
  </div>`;
}

// ── Descolamento do previsto ────────────────────────────────────────────────
// Compara o gasto real com o planejado ATÉ HOJE, não com o do mês inteiro.
// Contra o mês inteiro, no dia 5 pareceria que falta gastar 80% — o que é
// verdade e não é informação nenhuma.
function cardPrevisto(v, vComp) {
  const p = previstoNoPeriodo();
  if (!p.temDados) {
    return `<div class="kpi-card">
      <div class="kpi-label">Previsto</div>
      <div class="kpi-val" style="color:var(--gray)">—</div>
      <div class="kpi-linha"><span>aba PREVISTO vazia</span></div>
    </div>`;
  }

  const real = v.kpis.investimento;
  const dif = real - p.ateHoje;
  const pct = p.ateHoje ? dif / p.ateHoje * 100 : 0;

  // Gastar acima do previsto é o alerta: o orçamento acaba antes do mês.
  // Abaixo não é vitória — é verba parada —, então fica neutro.
  const acima = dif > 0;
  const forte = Math.abs(pct) >= 10;
  const cor = !forte ? 'var(--gray-light)'
            : acima ? 'var(--red)' : 'var(--amber)';

  // O realizado ganha selo; o previsto nao, porque ele e' o planejamento
  // e nao um resultado que subiu ou caiu.
  const dReal = vComp
    ? badgeDelta(real, vComp.kpis.investimento,
                 { fmt: fmtBRL, menorMelhor: true }) : '';

  // A linha do mes so aparece quando ela diz algo novo. Em periodo ja
  // encerrado o previsto ate hoje E o do mes sao o mesmo numero, e repetir
  // o valor duas vezes so ocupa espaco.
  const mostraMes = Math.abs(p.doMes - p.ateHoje) > 1;

  return `<div class="kpi-card">
    <div class="kpi-label">Previsto</div>
    <div class="kpi-val">${fmtBRL(p.ateHoje)}</div>
    <div class="kpi-linha"><span>realizado</span>
      <span>${fmtBRL(real)}${dReal}</span></div>
    <div class="kpi-linha" title="${
      acima ? 'Gastando mais rápido que o planejado'
            : 'Verba prevista ainda não gasta'}">
      <span>${acima ? 'acima' : 'abaixo'}</span>
      <span style="color:${cor}">${fmtBRL(Math.abs(dif))}<span
        class="kpi-sub">${Math.abs(pct).toFixed(0)}%</span></span></div>
    ${mostraMes ? `<div class="kpi-linha"><span>mês</span>
      <span>${fmtBRL(p.doMes)}</span></div>` : ''}
  </div>`;
}

// ── Reaplicação ─────────────────────────────────────────────────────────────
// Lead que ja tinha entrado antes e voltou. Vale acompanhar porque uma taxa
// alta significa que boa parte do volume nao e' publico novo — a base esta
// sendo reimpactada.
function cardReaplicacao(v, vComp) {
  const total  = v.backlog.length;
  const reapl  = v.backlog.filter(b => b.reaplicacao).length;
  const novos  = total - reapl;
  const pct    = total ? (reapl / total * 100) : 0;

  // Comparacao: volume de reaplicacao, volume de lead novo, e a fatia.
  //
  // A fatia vai em pontos percentuais: sair de 20% pra 25% e' +5 p.p.
  // Dizer "+25%" seria certo na matematica e enganoso na leitura.
  let dReapl = '', dNovos = '', dPct = '';
  if (vComp) {
    const totalC = vComp.backlog.length;
    const reaplC = vComp.backlog.filter(b => b.reaplicacao).length;
    const novosC = totalC - reaplC;
    const pctC   = totalC ? (reaplC / totalC * 100) : 0;

    dReapl = badgeDelta(reapl, reaplC);
    dNovos = badgeDelta(novos, novosC);

    if (totalC) {
      const d = pct - pctC;
      const cor = Math.abs(d) < 0.5 ? 'var(--gray-light)'
                : d > 0 ? 'var(--amber)' : 'var(--green)';
      dPct = `<span class="kpi-delta" style="color:${cor}"
        title="Período de comparação: ${pctC.toFixed(1)}%">${
        d > 0 ? '▲' : d < 0 ? '▼' : '·'} ${Math.abs(d).toFixed(1)} p.p.</span>`;
    }
  }

  // Barra dividida: parte nova e parte que voltou
  return `<div class="kpi-card">
    <div class="kpi-label">Reaplicação</div>
    <div class="kpi-val">${fmtNum(reapl)}${dReapl}</div>
    <div class="kpi-linha"><span>% dos leads</span>
      <span style="color:var(--amber)">${pct.toFixed(1)}%${dPct}</span></div>
    <div class="kpi-linha"><span>Novos</span><span>${fmtNum(novos)}${dNovos}</span></div>
    <div class="reapl-barra" title="${fmtNum(novos)} novos · ${fmtNum(reapl)} reaplicações">
      <div style="width:${100 - pct}%"></div>
    </div>
  </div>`;
}

// ── Tabela comparativa ──────────────────────────────────────────────────────
// Le o periodo da tela e soma cada produto dentro dele, via resumoProduto —
// antes usava p.kpis (fechado do mes inteiro) e o backlog sem filtro de
// data nenhum, entao a tabela inteira ficava parada com o seletor de data.
//
// Com o modo de comparacao ligado, cada numero ganha o selo de variacao
// contra o mesmo produto no periodo de comparacao.
function tabelaProdutos() {
  const ini = document.getElementById('dataInicio').value;
  const fim = document.getElementById('dataFim').value;
  const compIni = comparando ? document.getElementById('compInicio').value : null;
  const compFim = comparando ? document.getElementById('compFim').value : null;

  const linhas = PRODUTOS_REAIS.map(nome => {
    const k = resumoProduto(nome, ini, fim);
    const kC = comparando ? resumoProduto(nome, compIni, compFim) : null;

    const pctReapl = k.leads ? (k.reaplicacoes / k.leads * 100) : 0;
    const pctLeads = k.leads ? (k.ganhos / k.leads * 100) : 0;
    const pctMqls  = k.mqls  ? (k.ganhos / k.mqls  * 100) : 0;

    // Selo de variacao por celula. So aparece com comparando=true — a
    // funcao ja devolve '' sozinha quando desligado.
    const dLeads = kC ? badgeDelta(k.leads, kC.leads) : '';
    // Investimento subindo nao e' bom nem ruim por si so, mas gastar mais
    // sem trazer mais lead e'. Marcamos como "menor melhor" pra a leitura
    // ficar consistente com o card de investimento do topo.
    const dInv   = kC ? badgeDelta(k.investimento, kC.investimento,
                                   { fmt: fmtBRL, menorMelhor: true }) : '';
    const dGan   = kC ? badgeDelta(k.ganhos, kC.ganhos) : '';
    const dRoas  = kC ? badgeDelta(k.roas, kC.roas, { fmt: fmtRoas }) : '';
    const dReapl = kC ? badgeDelta(k.reaplicacoes, kC.reaplicacoes) : '';
    const dCpl   = kC ? badgeDelta(k.cpl, kC.cpl,
                                   { fmt: fmtBRL, menorMelhor: true }) : '';
    const dCpmql = kC ? badgeDelta(k.cpmql, kC.cpmql,
                                   { fmt: fmtBRL, menorMelhor: true }) : '';

    return `<tr class="clicavel ${nome === produtoAtivo ? 'selecionado' : ''}" onclick="trocarProduto('${nome}')">
      <td style="font-weight:600">${nome}</td>
      <td class="num">${fmtBRL(k.investimento)}${dInv}</td>
      <td class="num">${fmtNum(k.leads)}${dLeads}</td>
      <td class="num">${fmtNum(k.reaplicacoes)}<span style="color:var(--gray);font-size:9px"> ${
        pctReapl.toFixed(0)}%</span>${dReapl}</td>
      <td class="num">${fmtNum(k.ganhos)}${dGan}</td>
      <td class="num">${pctLeads.toFixed(1)}%</td>
      <td class="num">${pctMqls.toFixed(1)}%</td>
      <td class="num">${fmtBRL(k.cpl)}${dCpl}</td>
      <td class="num">${fmtBRL(k.cpmql)}${dCpmql}</td>
      <td class="num" style="color:var(--blue)">${fmtRoas(k.roas)}${dRoas}</td>
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th>Produto</th><th class="num">Investimento</th><th class="num">Leads</th>
      <th class="num">Reaplicação</th><th class="num">Ganhos</th>
      <th class="num">% Leads</th><th class="num">% MQL</th>
      <th class="num">CPL</th><th class="num">CPMQL</th><th class="num">ROAS</th>
    </tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;
}

// ── Funil ───────────────────────────────────────────────────────────────────
function funilHtml(v) {
  if (!v.etapas.length) return '<div class="empty">Sem etapas para exibir.</div>';
  const etapas = ordenarEtapas(v.etapas);
  const maior  = Math.max(...etapas.map(e => e.qtd), 1);
  // % sobre o total em aberto — as etapas sao um retrato, nao um funil
  // sequencial, entao comparar com a primeira daria numeros acima de 100%
  const total  = etapas.reduce((s, e) => s + e.qtd, 0) || 1;

  return '<div class="funil">' + etapas.map((e, i) => {
    const larg = Math.max(e.qtd / maior * 100, 3);
    const pct  = (e.qtd / total * 100).toFixed(0);
    const cor  = `hsl(${210 - i * 6}, ${62 - i * 3}%, ${58 - i * 2}%)`;
    const sel  = filtros.etapa === e.etapa;
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('etapa', ${attr(e.etapa)})">
      <div class="funil-label">${e.etapa}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : cor}">
          <span class="funil-val">${fmtNum(e.qtd)}</span>
        </div>
      </div>
      <div class="funil-pct" title="${fmtNum(e.qtd)} negócios">${pct}%</div>
    </div>`;
  }).join('') + '</div>';
}

// ── Mapa de calor: quando os leads chegam ───────────────────────────────────
// Le a data e hora da ultima aplicacao ("01/08/2026 20:48:46") e cruza
// dia da semana com hora do dia. Serve pra dimensionar plantao de SDR e
// programar veiculacao de midia.
const DIAS_SEMANA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

// Le "01/08/2026 20:48:46" e devolve { dia: 5, hora: 20 }, ou null quando
// falta a hora. Usado tanto pra desenhar o mapa quanto pra filtrar por ele
// — uma funcao so evita os dois lados divergirem.
function momentoDoLead(b) {
  const m = (b.aplicacao || '').trim()
    .match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):/);
  if (!m) return null;
  const [, dia, mes, ano, hora] = m;
  const d = new Date(Number(ano), Number(mes) - 1, Number(dia));
  const h = Number(hora);
  if (isNaN(d) || h < 0 || h > 23) return null;
  return { dia: d.getDay(), hora: h };
}

function mapaCalor(v) {
  // grade[dia][hora]
  const grade = Array.from({ length: 7 }, () => new Array(24).fill(0));
  let total = 0;
  let semHora = 0;

  // backlogMapa, nao backlog: ver o comentario em dadosVisiveis()
  for (const b of (v.backlogMapa || v.backlog)) {
    if (metrica === 'mqls' && !b.mql) continue;

    // Mesma leitura que o filtro usa — ver momentoDoLead()
    const m = momentoDoLead(b);
    if (!m) { semHora++; continue; }

    grade[m.dia][m.hora]++;
    total++;
  }

  if (!total) {
    return '<div class="empty">Sem data e hora nos leads do período.</div>';
  }

  const maior = Math.max(...grade.flat());

  // Totais das bordas, pra leitura rapida
  const porDia  = grade.map(linha => linha.reduce((s, x) => s + x, 0));
  const porHora = Array.from({ length: 24 },
    (_, h) => grade.reduce((s, linha) => s + linha[h], 0));

  // Escala cinza → azul com raiz quadrada.
  //
  // A distribuicao e' torta: a maioria das celulas tem 1-9 leads e o pico
  // passa de 30. Numa escala linear (ou pior, quadratica) todas essas
  // celulas baixas caem na mesma faixa de cinza e o mapa vira uma mancha.
  // A raiz expande justamente a parte de baixo, onde estao os dados.
  const cor = qtd => {
    if (!qtd) return 'background:#141414';
    const i = Math.sqrt(qtd / maior);
    const sat = Math.round(i * 75);
    const lum = Math.round(18 + i * 42);
    return `background:hsl(207,${sat}%,${lum}%)`;
  };

  const horas = Array.from({ length: 24 }, (_, h) => h);

  return `
    <div class="calor-wrap">
      <div class="calor" style="grid-template-columns:64px repeat(24,1fr) 42px">
        <div class="calor-canto"></div>
        ${horas.map(h => `<div class="calor-hora ${
          filtros.hora === String(h) ? 'sel' : ''}"
          onclick="filtrarMomento(null, ${h})"
          title="Filtrar só ${String(h).padStart(2, '0')}h">${
          String(h).padStart(2, '0')}</div>`).join('')}
        <div class="calor-hora" style="color:var(--gray-light)">Σ</div>

        ${DIAS_SEMANA.map((nome, d) => `
          <div class="calor-dia ${filtros.diaSemana === String(d) ? 'sel' : ''}"
               onclick="filtrarMomento(${d}, null)"
               title="Filtrar só ${nome}">${nome}</div>
          ${horas.map(h => {
            const qtd = grade[d][h];
            // Todo valor e' rotulado. Em celula clara o texto escurece,
            // senao o numero sumiria no azul.
            const claro = Math.sqrt(qtd / maior) > 0.72;
            const corTexto = !qtd ? '#3a3a3a'
                           : claro ? '#0a1420'
                           : 'rgba(255,255,255,.82)';
            // Com filtro ativo, o que esta fora do recorte apaga em vez de
            // sumir: o mapa continua legivel e da pra ver de onde saiu
            const noDia  = !filtros.diaSemana || filtros.diaSemana === String(d);
            const naHora = !filtros.hora      || filtros.hora      === String(h);
            const dentro = noDia && naHora;
            const exata  = filtros.diaSemana === String(d)
                        && filtros.hora === String(h);
            return `<div class="calor-cel ${exata ? 'sel' : ''} ${
                        dentro ? '' : 'apagada'}"
                      style="${cor(qtd)};color:${corTexto}"
                      onclick="filtrarMomento(${d}, ${h})"
                      title="${nome}, ${String(h).padStart(2,'0')}h — ${qtd} ${
                        metrica === 'mqls' ? 'MQL' : 'leads'} · clique pra filtrar">${
                        qtd || '·'}</div>`;
          }).join('')}
          <div class="calor-total">${fmtNum(porDia[d])}</div>
        `).join('')}

        <div class="calor-dia" style="color:var(--gray-light)">Σ</div>
        ${horas.map(h => `<div class="calor-total">${
          porHora[h] || ''}</div>`).join('')}
        <div class="calor-total" style="color:var(--blue)">${fmtNum(total)}</div>
      </div>
    </div>
    ${(() => {
      // Se o recorte clicado nao tem lead nenhum, avisa aqui: os outros
      // cards ficam vazios e sem isso parece que o dashboard quebrou
      const recorte = filtros.diaSemana || filtros.hora;
      if (recorte && !v.backlog.length) {
        return `<div class="calor-nota" style="color:var(--amber)">
          Nenhum ${metrica === 'mqls' ? 'MQL' : 'lead'} neste horário —
          por isso os outros cards estão vazios.
          Clique na célula de novo (ou em "limpar") para voltar.
        </div>`;
      }
      return semHora
        ? `<div class="calor-nota">${fmtNum(semHora)} sem hora registrada</div>`
        : '';
    })()}
  `;
}

// ── Cards de rede ───────────────────────────────────────────────────────────
function cardsRedes(v, vComp) {
  const CORES = {
    Meta: '#4a6dd4', LinkedIn: '#0e76a8', Google: '#2980b9', 'Orgânico': '#4ade80',
  };

  return REDES.map(rede => {
    const d = v.porRede[rede];
    const sel = filtros.rede === rede;
    const cor = CORES[rede];

    if (!d || (!d.leads && !d.investimento)) {
      return `<div class="rede-card vazio">
        <div class="rede-nome" style="color:${cor}">${rede}</div>
        <div class="empty" style="padding:18px 0">Sem dados</div>
      </div>`;
    }

    const taxa = d.leads ? (d.mqls / d.leads * 100) : 0;
    const cpmql = d.mqls ? d.investimento / d.mqls : null;

    // Mesma rede no periodo de comparacao. Se ela nao existia la, o selo
    // sai como "—" em vez de fingir uma variacao de 100%.
    const c = vComp && vComp.porRede ? vComp.porRede[rede] : null;
    const dl = c ? badgeDelta(d.leads, c.leads) : '';
    const dm = c ? badgeDelta(d.mqls, c.mqls) : '';
    const di = c ? badgeDelta(d.investimento, c.investimento,
                              { fmt: fmtBRL, menorMelhor: true }) : '';
    const dc = c && c.cpl !== null && d.cpl !== null
      ? badgeDelta(d.cpl, c.cpl, { fmt: fmtBRL, menorMelhor: true }) : '';
    const dq = c && cpmql !== null && c.mqls
      ? badgeDelta(cpmql, c.investimento / c.mqls,
                   { fmt: fmtBRL, menorMelhor: true }) : '';

    return `<div class="rede-card ${sel ? 'ativo' : ''}"
              style="${sel ? `border-color:${cor}` : ''}"
              onclick="toggleFiltro('rede', ${attr(rede)})">
      <div class="rede-topo">
        <span class="rede-nome" style="color:${cor}">${rede}</span>
        <span class="rede-inv">${fmtBRL(d.investimento)}${di}</span>
      </div>
      <div class="rede-nums">
        <div><span>Leads</span><strong>${fmtNum(d.leads)}${dl}</strong></div>
        <div><span>MQL</span><strong style="color:${cor}">${fmtNum(d.mqls)}${dm}</strong></div>
        <div><span>Taxa MQL</span><strong>${taxa.toFixed(0)}%</strong></div>
      </div>
      <div class="rede-nums">
        <div><span>CPL</span><strong>${d.cpl === null ? '—' : fmtBRL(d.cpl)}${dc}</strong></div>
        <div><span>CPMQL</span><strong>${cpmql === null ? '—' : fmtBRL(cpmql)}${dq}</strong></div>
        <div><span>Share</span><strong>${
          v.kpis.investimento ? (d.investimento / v.kpis.investimento * 100).toFixed(0) : 0
        }%</strong></div>
      </div>
      <div class="rede-barra"><div style="width:${
        v.kpis.leads ? Math.min(d.leads / v.kpis.leads * 100, 100) : 0
      }%;background:${cor}"></div></div>
    </div>`;
  }).join('');
}

// ── Funis (pipelines onde os leads estão) ───────────────────────────────────
function tabelaFunis(v, limite, vComp) {
  const agg = {};
  for (const b of v.backlog) {
    const f = b.funil || '—';
    if (!agg[f]) agg[f] = { leads: 0, mqls: 0 };
    agg[f].leads++;
    if (b.mql) agg[f].mqls++;
  }

  // Mesmo agrupamento no periodo de comparacao
  const ant = vComp
    ? contarPor(vComp.backlog.filter(b => metrica !== 'mqls' || b.mql),
                b => b.funil || '—')
    : null;

  let lista = Object.entries(agg).sort((a, b) => b[1][metrica] - a[1][metrica]);
  if (!lista.length) return '<div class="empty">Sem funis para os filtros atuais.</div>';

  // No report a lista e' cortada: a cauda de funis com 1-2 leads ocupa
  // espaco e nao muda a leitura. O resto vira uma linha "outros".
  let resto = null;
  if (limite && lista.length > limite) {
    const cortados = lista.slice(limite);
    resto = {
      leads: cortados.reduce((s, [, d]) => s + d.leads, 0),
      mqls:  cortados.reduce((s, [, d]) => s + d.mqls, 0),
      qtd:   cortados.length,
    };
    lista = lista.slice(0, limite);
  }

  const maior = Math.max(...lista.map(([, d]) => d[metrica]), 1);
  const outra = metrica === 'mqls' ? 'leads' : 'mqls';

  return '<div class="funil">' + lista.map(([nome, d]) => {
    const sel  = filtros.funil === nome;
    const larg = Math.max(d[metrica] / maior * 100, 3);
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('funil', ${attr(nome)})">
      <div class="funil-label">${nome}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : '#3a7ca8'}">
          <span class="funil-val">${fmtNum(d[metrica])}</span>
        </div>
      </div>
      <div class="funil-pct">${fmtNum(d[outra])}${
        ant ? miniDelta(d[metrica], ant[nome]) : ''}</div>
    </div>`;
  }).join('') + (resto ? `
    <div class="funil-step" style="opacity:.55;cursor:default">
      <div class="funil-label">+${resto.qtd} outros</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${
          Math.max(resto[metrica] / maior * 100, 3)}%;background:#3a4a55">
          <span class="funil-val">${fmtNum(resto[metrica])}</span>
        </div>
      </div>
      <div class="funil-pct">${fmtNum(resto[outra])}</div>
    </div>` : '') + '</div>';
}

// ── Leads em aberto: o que ainda esta vivo no funil ─────────────────────────
// Sai do v.backlog, entao ja chega com produto, periodo e todos os filtros
// da tela aplicados — clicar num funil ou numa etapa mexe aqui junto.
//
// So status "open": ganho e perdido tem tela propria (Ganhos e Descartes),
// e misturar os tres aqui faria a contagem nao bater com o funil ao lado.
function leadsAbertos(v) {
  const soMql = metrica === 'mqls';
  const termo = semAcento(buscaAbertos);

  return v.backlog
    .filter(b => b.status === 'open')
    .filter(b => !soMql || b.mql)
    .filter(b => !termo || [
      b.nome, b.cargo, b.etapa, b.funil, b.proprietario,
      b.campanha, b.source, b.medium, b.content, b.term,
      b.nomeProduto, redeDoLead(b), String(b.id),
    ].some(campo => semAcento(campo).includes(termo)))
    // Mais recente primeiro: a aplicacao vem "DD/MM/AAAA hh:mm:ss", entao
    // comparar como texto ordena certo dentro do mesmo mes
    .sort((a, b) => (b.aplicacao || '').localeCompare(a.aplicacao || ''));
}

function tabelaAbertos(v) {
  const leads = leadsAbertos(v);
  const soMql = metrica === 'mqls';

  if (!leads.length) {
    return `<div class="empty">
      ${buscaAbertos
        ? `Nada encontrado para "${buscaAbertos}".<br><br>
           <button class="btn" onclick="buscarAbertos('')">Limpar busca</button>`
        : `Nenhum ${soMql ? 'MQL' : 'lead'} em aberto para os filtros atuais.`}
    </div>`;
  }

  const corta = (t, n) => {
    const s = (t || '').trim();
    if (!s) return '<span style="color:var(--gray)">—</span>';
    return s.length > n ? s.slice(0, n) + '…' : s;
  };

  return `
    <div class="table-scroll" style="max-height:520px">
      <table class="tabela-utm">
        <thead><tr>
          <th class="num">ID</th><th>Aplicação</th><th>Nome</th><th>Cargo</th>
          <th>MQL</th><th>Funil</th><th>Etapa</th><th>Proprietário</th>
          <th class="num" title="Horas úteis entre a entrada do lead e o primeiro contato (ligação ou mensagem). Só para os SDRs.">TME</th>
          <th>Rede</th>
          <th>utm_campaign</th><th>utm_source</th><th>utm_medium</th>
          <th>utm_content</th><th>utm_term</th>
        </tr></thead>
        <tbody>
          ${leads.map(b => `
            <tr>
              <td class="num">
                <a class="link-pipe" href="${URL_PIPEDRIVE}${b.id}"
                   target="_blank" rel="noopener"
                   onclick="rastrear('abrir_pipedrive', '${b.id}')">${b.id}</a>
              </td>
              <td class="utm">${(b.aplicacao || '').slice(0, 10) || '—'}</td>
              <td>${corta(b.nome, 24)}</td>
              <td style="color:var(--gray-light)">${corta(b.cargo, 22)}</td>
              <td style="text-align:center">${
                b.mql ? '<span style="color:var(--blue)">✓</span>' : ''}</td>
              <td>${corta(b.funil, 13)}</td>
              <td>${corta(b.etapa, 18)}</td>
              <td>${corta(b.proprietario, 18)}</td>
              <td class="num" title="${
                b.tme === null || b.tme === undefined
                  ? (nomeEhSDR(b.proprietario)
                      ? 'Sem contato registrado ainda'
                      : 'Fora da lista de SDRs — o TME não se aplica')
                  : 'Primeiro contato em ' + (b.atendidoEm || '—')}"
                style="color:${
                  b.tme === null || b.tme === undefined ? 'var(--gray)'
                  : b.tme <= TME_META ? 'var(--green)'
                  : b.tme <= TME_META * 6 ? 'var(--amber)'
                  : 'var(--red)'}">${
                b.tme === null || b.tme === undefined ? '—'
                  : fmtHoras(b.tme)}</td>
              <td>${redeDoLead(b)}</td>
              <td class="utm" title="${b.campanha || ''}">${corta(b.campanha, 30)}</td>
              <td class="utm" title="${b.source || ''}">${corta(b.source, 12)}</td>
              <td class="utm" title="${b.medium || ''}">${corta(b.medium, 14)}</td>
              <td class="utm" title="${b.content || ''}">${corta(b.content, 22)}</td>
              <td class="utm" title="${b.term || ''}">${corta(b.term, 18)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

// ── Exportar os leads em aberto ─────────────────────────────────────────────
function exportarAbertosCSV() {
  const v = dadosVisiveis();
  const leads = leadsAbertos(v);
  if (!leads.length) return;

  rastrear('exportar_abertos', `${leads.length} leads`);

  const cabecalho = [
    'ID', 'Produto', 'Aplicação', 'Nome', 'Email', 'Cargo', 'MQL', 'Score',
    'Funil', 'Etapa', 'Proprietário', 'TME (h úteis)', 'Atendido em',
    'Rede', 'Reaplicação', 'Valor',
    'utm_campaign', 'utm_source', 'utm_medium', 'utm_content', 'utm_term',
  ];

  const escapa = t => {
    const s = String(t ?? '').replace(/"/g, '""');
    return /[";\n]/.test(s) ? `"${s}"` : s;
  };

  const linhas = leads.map(b => [
    b.id, b.produto, b.aplicacao, b.nome, b.email, b.cargo,
    b.mql ? 'Sim' : 'Não',
    // Virgula decimal pro Excel BR reconhecer como numero
    b.score === null || b.score === undefined
      ? '' : String(b.score).replace('.', ','),
    b.funil, b.etapa, b.proprietario,
    // Vírgula decimal pro Excel BR reconhecer como número
    b.tme === null || b.tme === undefined
      ? '' : String(b.tme).replace('.', ','),
    b.atendidoEm || '',
    redeDoLead(b),
    b.reaplicacao ? 'Sim' : 'Não',
    String(b.valor || 0).replace('.', ','),
    b.campanha, b.source, b.medium, b.content, b.term,
  ].map(escapa).join(';'));

  const csv = '\uFEFF' + [cabecalho.join(';'), ...linhas].join('\n');

  const hoje = new Date().toISOString().slice(0, 10);
  const filtro = Object.values(filtros).filter(Boolean).join('-') || 'completa';
  const nome = `abertos_${produtoAtivo}_${filtro}_${hoje}`
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w-]/g, '_').toLowerCase() + '.csv';

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Venda nova x venda de reaplicacao ───────────────────────────────────────
// A aba GANHOS nao sabe se o comprador era reaplicacao — essa marca esta no
// BACKLOG MQL. Cruzamos pelo ID do negocio, como no card de cargo.
//
// O cruzamento e' parcial e isso importa aqui mais do que em qualquer outro
// lugar: quem comprou este mes mas entrou em outro NAO esta no backlog do
// periodo, e reaplicacao e' justamente o caso de quem ja tinha entrado
// antes. So que a marca do Pipedrive olha se a APLICACAO e' posterior a
// criacao — entao um lead antigo que reaplicou este mes aparece no backlog
// deste mes, com a marca ligada. Quem nao casa e' quem nao reaplicou.
function vendasPorOrigem(v) {
  const ganhos = v.ganhos.filter(g => g.vale === 'sim');
  if (!ganhos.length) {
    return '<div class="empty">Nenhuma venda validada no período.</div>';
  }

  // A marca de reaplicacao vem do proprio ganho agora, calculada no
  // update_all.py com a mesma regra do backlog. O join com o backlog fica
  // so de reserva, pra planilha que ainda nao tenha a coluna nova.
  const porId = {};
  for (const b of dados.backlog) porId[String(b.id)] = b;

  // Comparar DD/MM/AAAA como texto ordena o dia antes do ano; inverter
  // resolve. Isso importa aqui: "01/03/2026" tem que vir DEPOIS de
  // "28/07/2025", e como texto cru viria antes.
  const chaveData = s => {
    const p = String(s || '').trim().slice(0, 10).split('/');
    return p.length === 3 ? `${p[2]}-${p[1]}-${p[0]}` : '';
  };
  const iniPer = document.getElementById('dataInicio').value;   // AAAA-MM-DD

  const grupos = {
    'Reaplicação':   { qtd: 0, valor: 0, cor: '#d9a441', dias: [] },
    'Lead do período':{ qtd: 0, valor: 0, cor: '#2f6b46', dias: [] },
    'Lead anterior': { qtd: 0, valor: 0, cor: '#5b6f9e', dias: [] },
    'Sem data':      { qtd: 0, valor: 0, cor: '#4a4a52', dias: [] },
  };
  const antigos = {};   // mes de entrada -> {qtd, valor}

  for (const g of ganhos) {
    const b = porId[String(g.id)];
    const ka = chaveData(g.aplicacao);

    // Prefere a marca do proprio ganho; cai no backlog so se a coluna
    // ainda nao existir na planilha
    const ehReapl = g.reaplicacao !== undefined
      ? g.reaplicacao
      : !!(b && b.reaplicacao);

    let k;
    if (ehReapl) {
      // Ja tinha entrado antes e voltou — isso manda, venha de que mes vier
      k = 'Reaplicação';
    } else if (!ka) {
      k = 'Sem data';
    } else if (iniPer && ka < iniPer) {
      // Entrou antes do periodo selecionado
      k = 'Lead anterior';
      const mes = ka.slice(0, 7);
      if (!antigos[mes]) antigos[mes] = { qtd: 0, valor: 0 };
      antigos[mes].qtd++;
      antigos[mes].valor += g.valor;
    } else {
      k = 'Lead do período';
    }

    grupos[k].qtd++;
    grupos[k].valor += g.valor;
    if (g.dias > 0) grupos[k].dias.push(g.dias);
  }

  const totalValor = ganhos.reduce((s, g) => s + g.valor, 0);
  const lista = Object.entries(grupos).filter(([, d]) => d.qtd);
  const maior = Math.max(...lista.map(([, d]) => d.valor), 1);

  // Mediana, nao media: um negocio de 400 dias puxaria a media e daria a
  // impressao de um ciclo que nao e' o tipico
  const mediana = arr => {
    if (!arr.length) return null;
    const s = [...arr].sort((a, b) => a - b);
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
  };

  const linhas = lista.map(([nome, d]) => {
    const med = mediana(d.dias);
    return `
    <div class="funil-step" style="cursor:default">
      <div class="funil-label" title="${fmtNum(d.qtd)} venda(s)${
        med !== null ? ` · ciclo típico de ${med} dias` : ''}">${nome}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${
          Math.max(d.valor / maior * 100, 3)}%;background:${d.cor}">
          <span class="funil-val">${fmtBRL(d.valor)}</span>
        </div>
      </div>
      <div class="funil-pct" title="${
        (d.valor / totalValor * 100).toFixed(0)}% do faturamento">${
        fmtNum(d.qtd)}</div>
    </div>`;
  }).join('');

  // Ciclo de venda geral
  const todosDias = ganhos.filter(g => g.dias > 0).map(g => g.dias);
  const medGeral = mediana(todosDias);

  // De que meses vieram os leads antigos
  const MES_CURTO = ['jan','fev','mar','abr','mai','jun',
                     'jul','ago','set','out','nov','dez'];
  const detalhe = Object.entries(antigos)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([mes, d]) => {
      const [ano, m] = mes.split('-');
      return `${MES_CURTO[Number(m) - 1]}/${ano.slice(2)}: ${
        fmtNum(d.qtd)} (${fmtBRL(d.valor)})`;
    }).join(' · ');

  return `<div class="funil">${linhas}</div>
    <div class="calor-nota">
      Barra = faturamento · número à direita = volume${
        medGeral !== null
          ? ` · da aplicação até a venda, ${medGeral} dias no típico` : ''}
    </div>
    ${detalhe ? `<div class="calor-nota" style="color:var(--gray-light)">
      <b style="color:#5b6f9e">Leads anteriores entraram em:</b> ${detalhe}
    </div>` : ''}`;
}

// ── Perfil de quem comprou ──────────────────────────────────────────────────
// A aba GANHOS nao tem cargo — so nome, valor e as utms. O cargo mora no
// BACKLOG MQL, entao cruzamos os dois pelo ID do negocio.
//
// O cruzamento e' parcial de proposito: quem comprou agora mas entrou em
// outro mes nao esta no backlog do periodo, e nao tem como saber o cargo.
// Por isso o card mostra quantos casaram — sem isso, a distribuicao pareceria
// completa quando na verdade e' de um pedaco.
function perfilDosGanhos(v, campo) {
  const ganhos = v.ganhos.filter(g => g.vale === 'sim');
  if (!ganhos.length) {
    return '<div class="empty">Nenhuma venda validada no período.</div>';
  }

  const agg = {};
  let semDado = 0;

  if (campo === 'cargo') {
    // Indexa o backlog por ID pra achar o cargo de cada comprador
    const porId = {};
    for (const b of dados.backlog) porId[String(b.id)] = b;

    for (const g of ganhos) {
      const b = porId[String(g.id)];
      if (!b || !(b.cargo || '').trim()) { semDado++; continue; }
      const c = normalizarCargo(b.cargo);
      if (!agg[c]) agg[c] = { qtd: 0, valor: 0 };
      agg[c].qtd++;
      agg[c].valor += g.valor;
    }
  } else {
    for (const g of ganhos) {
      const c = (g.campanha || '').trim();
      if (!c) { semDado++; continue; }
      if (!agg[c]) agg[c] = { qtd: 0, valor: 0 };
      agg[c].qtd++;
      agg[c].valor += g.valor;
    }
  }

  const lista = Object.entries(agg).sort((a, b) => b[1].qtd - a[1].qtd);
  if (!lista.length) {
    return `<div class="empty">
      Nenhuma venda com ${campo === 'cargo' ? 'cargo' : 'campanha'} identificado.
      ${semDado ? `<br><br><span style="font-size:11px">${
        fmtNum(semDado)} venda(s) sem esse dado</span>` : ''}
    </div>`;
  }

  const maior = Math.max(...lista.map(([, d]) => d.qtd), 1);
  const total = lista.reduce((s, [, d]) => s + d.qtd, 0);

  // So o cargo tem filtro no dashboard; campanha nao e' dimensao de filtro
  const clicavel = campo === 'cargo';

  const linhas = lista.slice(0, 12).map(([nome, d]) => {
    const sel = clicavel && filtros.cargo === nome;
    const rotulo = nome.length > 40 ? nome.slice(0, 40) + '…' : nome;
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              ${clicavel
                ? `onclick="toggleFiltro('cargo', ${attr(nome)})"`
                : 'style="cursor:default"'}>
      <div class="funil-label" title="${nome} · ${fmtBRL(d.valor)}">${rotulo}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${
          Math.max(d.qtd / maior * 100, 3)}%;background:${sel ? 'var(--amber)' : '#2f6b46'}">
          <span class="funil-val">${fmtNum(d.qtd)}</span>
        </div>
      </div>
      <div class="funil-pct" title="${fmtBRL(d.valor)}">${
        (d.qtd / total * 100).toFixed(0)}%</div>
    </div>`;
  }).join('');

  const nota = semDado
    ? `<div class="calor-nota">${fmtNum(total)} de ${fmtNum(ganhos.length)} vendas com ${
        campo === 'cargo' ? 'cargo identificado' : 'campanha preenchida'}${
        campo === 'cargo'
          ? ' — o resto entrou em outro mês e não está no backlog do período'
          : ''}</div>`
    : '';

  return `<div class="funil">${linhas}</div>${nota}`;
}

// ── Distribuicao de score (so Lean e CES) ───────────────────────────────────
// Agrupa pela parte inteira: a nota e' decimal e tem mais de cem valores
// distintos, entao a lista crua nao diz nada. Cada faixa mostra quantos
// leads tem e quantos viraram venda.
function tabelaScore(v) {
  const comScore = v.backlog.filter(b => b.score !== null && b.score !== undefined);
  if (!comScore.length) {
    return `<div class="empty">
      Nenhum lead com pontuação no período.<br><br>
      <span style="font-size:11px">A coluna Score é preenchida pelo update_all.py —
      se ela ainda não existe na aba BACKLOG MQL, rode o script.</span>
    </div>`;
  }

  const agg = {};
  for (const b of comScore) {
    const faixa = Math.floor(b.score);
    if (!agg[faixa]) agg[faixa] = { qtd: 0, ganhos: 0 };
    agg[faixa].qtd++;
    if (b.status === 'won') agg[faixa].ganhos++;
  }

  const faixas = Object.keys(agg).map(Number).sort((a, b) => a - b);
  const maior  = Math.max(...faixas.map(f => agg[f].qtd), 1);
  const total  = comScore.length;
  const acima  = comScore.filter(b => b.score >= SCORE_MINIMO).length;
  const semScore = v.backlog.length - total;

  const linhas = faixas.map(f => {
    const d   = agg[f];
    const mql = f >= SCORE_MINIMO;
    const sel = filtros.score === String(f);
    // Verde nas faixas que qualificam, cinza-azulado nas que nao
    const cor = sel ? 'var(--amber)' : (mql ? '#2f6b46' : '#4a4a52');
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('score', '${f}')">
      <div class="funil-label" title="${d.ganhos} vendas nesta faixa">${
        f}.0 – ${f}.9${mql ? ' ✓' : ''}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${
          Math.max(d.qtd / maior * 100, 3)}%;background:${cor}">
          <span class="funil-val">${fmtNum(d.qtd)}</span>
        </div>
      </div>
      <div class="funil-pct">${(d.qtd / total * 100).toFixed(0)}%</div>
    </div>`;
  }).join('');

  return `<div class="funil">${linhas}</div>
    <div class="calor-nota">
      ${fmtNum(acima)} de ${fmtNum(total)} chegam a ${SCORE_MINIMO}
      (${(acima / total * 100).toFixed(0)}%) — são estes que contam como MQL${
      semScore ? ` · ${fmtNum(semScore)} sem pontuação ficam de fora` : ''}
    </div>`;
}

// ── Cargos ──────────────────────────────────────────────────────────────────
function tabelaCargos(v, vComp) {
  const ant = vComp
    ? contarPor(vComp.backlog.filter(b => metrica !== 'mqls' || b.mql),
                b => normalizarCargo(b.cargo))
    : null;
  const agg = {};
  for (const b of v.backlog) {
    const c = normalizarCargo(b.cargo);
    if (!agg[c]) agg[c] = { leads: 0, mqls: 0 };
    agg[c].leads++;
    if (b.mql) agg[c].mqls++;
  }

  const lista = Object.entries(agg).sort((a, b) => b[1][metrica] - a[1][metrica]);
  if (!lista.length) return '<div class="empty">Sem cargos para os filtros atuais.</div>';

  const total = lista.reduce((s, [, d]) => s + d[metrica], 0) || 1;
  const maior = Math.max(...lista.map(([, d]) => d[metrica]), 1);

  return '<div class="funil">' + lista.map(([nome, d]) => {
    const sel  = filtros.cargo === nome;
    const larg = Math.max(d[metrica] / maior * 100, 3);
    const pct  = (d[metrica] / total * 100).toFixed(0);
    return `<div class="funil-step ${sel ? 'selecionado' : ''}"
              onclick="toggleFiltro('cargo', ${attr(nome)})">
      <div class="funil-label">${nome}</div>
      <div class="funil-track">
        <div class="funil-bar" style="width:${larg}%;background:${sel ? 'var(--amber)' : '#5b6f9e'}">
          <span class="funil-val">${fmtNum(d[metrica])}</span>
        </div>
      </div>
      <div class="funil-pct" title="${fmtNum(d[metrica === 'mqls' ? 'leads' : 'mqls'])} ${metrica === 'mqls' ? 'leads' : 'MQL'}">${pct}%${
        ant ? miniDelta(d[metrica], ant[nome]) : ''}</div>
    </div>`;
  }).join('') + '</div>';
}

// ── Proprietários ───────────────────────────────────────────────────────────
const qtdProprietarios = v =>
  new Set(v.backlog.map(b => b.proprietario || '—')).size;

function tabelaProprietarios(v, vComp) {
  const ant = vComp
    ? contarPor(vComp.backlog, b => b.proprietario || '—')
    : null;
  const antMql = vComp
    ? contarPor(vComp.backlog.filter(b => b.mql), b => b.proprietario || '—')
    : null;
  const agg = {};
  for (const b of v.backlog) {
    const dono = b.proprietario || '—';
    if (!agg[dono]) agg[dono] = { leads: 0, mqls: 0, itens: [] };
    agg[dono].leads++;
    if (b.mql) agg[dono].mqls++;
    agg[dono].itens.push(b);
  }

  // Sem corte — a lista rola dentro do card. Cortar escondia proprietarios
  // que estao na planilha, e ai o total nao fechava com o que se ve.
  const sinal = ordemProp === 'asc' ? 1 : -1;
  const linhas = Object.entries(agg)
    .sort((a, b) => sinal * (a[1][ordemPropCol] - b[1][ordemPropCol]))
    .map(([dono, d]) => {
      const sel = filtros.proprietario === dono;
      const cor = c => ordemPropCol === c ? 'color:var(--blue);font-weight:600' : '';
      const t = calcTME(d.itens);
      // O calcTME ja filtra pela lista de SDRs. Quem nao esta nela
      // aparece com traco — nao e' erro, e' que o TME nao se aplica a
      // esse proprietario.
      //
      // Cobertura baixa deixa o numero cinza: ali o TME mede quem registra
      // atividade, nao quem atende rapido.
      const conf = t.n && t.cobertura >= 50;
      return `<tr class="clicavel ${sel ? 'selecionado' : ''}"
                onclick="toggleFiltro('proprietario', ${attr(dono)})">
        <td>${dono}</td>
        <td class="num" style="${cor('leads')}">${fmtNum(d.leads)}${
          ant ? miniDelta(d.leads, ant[dono]) : ''}</td>
        <td class="num" style="${cor('mqls')}">${fmtNum(d.mqls)}${
          antMql ? miniDelta(d.mqls, antMql[dono]) : ''}</td>
        <td class="num" title="${t.n
            ? fmtNum(t.n) + ' contatados · ' + t.cobertura.toFixed(0) + '% dos leads'
            : (nomeEhSDR(dono)
                ? 'sem contato registrado'
                : 'não é SDR — fora do TME')}"
          style="color:${!t.n ? 'var(--gray)'
            : conf ? 'var(--white)' : 'var(--gray-light)'}">${
          t.n ? fmtHoras(t.med) : '—'}</td>
      </tr>`;
    }).join('');

  if (!linhas) return '<div class="empty">Nenhum lead para os filtros atuais.</div>';

  const seta = ordemProp === 'asc' ? '↑' : '↓';
  const col = c => {
    const nome = c === 'leads' ? 'Leads' : 'MQL';
    const ativa = ordemPropCol === c;
    return `<th class="num ordenavel ${ativa ? 'ativa' : ''}"
              onclick="ordenarProp('${c}')">${nome}${ativa ? ' ' + seta : ''}</th>`;
  };

  return `<table>
    <thead><tr><th>Proprietário</th>${col('leads')}${col('mqls')}
      <th class="num" title="Mediana das horas úteis entre a entrada do lead e o primeiro contato. Só os SDRs.">TME</th>
    </tr></thead>
    <tbody>${linhas}</tbody>
  </table>`;
}

// ── Gráficos ────────────────────────────────────────────────────────────────
// O plugin de rotulos e' registrado global, mas desligado por padrao:
// cada grafico decide como quer exibir o valor.
if (window.ChartDataLabels) {
  Chart.register(ChartDataLabels);
  Chart.defaults.set('plugins.datalabels', { display: false });
}

function opcoesBase() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1a1a1a', borderColor: '#333', borderWidth: 1,
        titleFont: { family: 'DM Mono', size: 11 },
        bodyFont:  { family: 'DM Mono', size: 11 },
      },
    },
    scales: {
      x: { ticks: { color: '#c8c8c8', font: { family: 'DM Mono', size: 9 }, maxRotation: 45 },
           grid: { color: '#1a1a1a' } },
      y: { ticks: { color: '#c8c8c8', font: { family: 'DM Mono', size: 9 } },
           grid: { color: '#1c1c1c' }, beginAtZero: true },
    },
  };
}

// Roda o desenho de um grafico isolado: se um quebrar, os outros continuam
function comCanvas(id, fn) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return fn(el); }
  catch (err) { console.error(`Falha no gráfico ${id}:`, err); return null; }
}

function desenharGraficos(v, vComp) {
  // Ao trocar de modo, os canvas antigos ja sairam do DOM. Se destroy()
  // lancar, a funcao abortaria antes de desenhar o grafico novo — foi o
  // que deixava o report em branco.
  Object.values(charts).forEach(c => {
    try { c && c.destroy(); } catch (e) { /* canvas ja removido */ }
  });
  charts = {};

  // Tudo vem de v: no Consolidado nao existe dados.produtos['CONSOLIDADO']
  // Aviso de "sem dados" sobrepoe o canvas em vez de trocar o innerHTML:
  // trocar apagava o proprio canvas e o grafico nao tinha onde nascer.
  const aviso = (id, texto) => {
    const canvas = document.getElementById(id);
    const box = canvas && canvas.parentElement;
    if (!box) return;
    const msg = document.createElement('div');
    msg.className = 'empty';
    msg.style.cssText = 'position:absolute;inset:0;display:flex;'
      + 'align-items:center;justify-content:center;';
    msg.textContent = texto;
    box.appendChild(msg);
  };
  if (!v.leadsPorDia.length) aviso('chartLeads', 'Sem leads no período selecionado.');
  if (!v.ganhos.length)      aviso('chartGanhos', 'Nenhum ganho no período.');

  const labels  = v.leadsPorDia.map(d => d.data);
  const invDias = labels.map(l => v.investPorDia[l] || 0);

  // Investimento x Leads x MQL
  charts.leads = comCanvas('chartLeads', el => new Chart(el, {
    data: {
      labels,
      datasets: [
        { type:'bar', label:'Leads', data: v.leadsPorDia.map(d => d.leads),
          backgroundColor:'#2c5f8a', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:1, color:'#9dc4e8',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL', data: v.leadsPorDia.map(d => d.mqls),
          backgroundColor:'#4a9eed', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:1, color:'#cfe4f7',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL · Sniper/Elite/Olympus',
          data: labels.map(l => v.mqlTresFunisPorDia[l] || 0),
          backgroundColor:'#7ee0a8', borderRadius:2, yAxisID:'y',
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:1, color:'#7ee0a8',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        // Previsto: acumula dia a dia, pra comparar o ritmo. A linha do
        // realizado e' diaria, entao as duas ficam na mesma escala.
        ...(() => {
          const p = previstoNoPeriodo();
          if (!p.temDados) return [];
          return [{
            type:'line', label:'Previsto', yAxisID:'y1',
            data: labels.map(l => p.porDia[l] || null),
            borderColor:'#7a7a86', borderWidth:1.5, borderDash:[5, 4],
            pointRadius:0, tension:.3, spanGaps:true,
            datalabels:{ display:false },
          }];
        })(),
        { type:'line', label:'Investimento', data: invDias,
          borderColor:'#d9a441', borderWidth:2, pointRadius:2.5, tension:.3,
          pointBackgroundColor:'#d9a441', yAxisID:'y1',
          datalabels: {
            display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            // align 'top' com a caixa escura tapava as barras. Solto e em
            // ambar, o rotulo se le pela cor — a mesma solucao do CPL no
            // grafico por rede.
            anchor:'end', align:'top', offset:4, color:'#d9a441',
            font:{ family:'DM Mono', size:9 },
            // Sem "R$": com um rotulo por dia o espaco e' curto, e o eixo
            // da direita ja diz a unidade
            formatter: v => (v / 1000).toFixed(1) + 'k' } },
      ],
    },
    options: {
      ...opcoesBase(),
      plugins: { ...opcoesBase().plugins, legend: { display:true,
        labels:{ color:'#e8e8e8', font:{ family:'DM Mono', size:10 }, boxWidth:10 } } },
      scales: {
        ...opcoesBase().scales,
        y: { ...opcoesBase().scales.y, grace:'12%' },
        y1: { position:'right', beginAtZero:true, grid:{ display:false },
              // Folga no topo pro rotulo do pico nao ser cortado pela borda
              grace:'18%',
              ticks:{ color:'#d9a441', font:{ family:'DM Mono', size:9 },
                      callback: val => 'R$ ' + (val/1000).toFixed(0) + 'k' } },
      },
    },
  }));

  // Leads por rede — barras de volume, linha de CPL (mesma leitura do gráfico acima)
  // Ordem fixa das quatro entradas; Organico por ultimo, pois nao tem CPL
  const PAGAS = ['Meta', 'LinkedIn', 'Google'];
  const redes = REDES.filter(r =>
    v.porRede[r] && (v.porRede[r].leads > 0 || v.porRede[r].investimento > 0));

  const opaco = r => !filtros.rede || filtros.rede === r;

  charts.redes = comCanvas('chartRedes', el => new Chart(el, {
    data: {
      labels: redes,
      datasets: [
        { type:'bar', label:'Leads', yAxisID:'y',
          data: redes.map(r => v.porRede[r].leads),
          backgroundColor: redes.map(r =>
            !opaco(r) ? '#242424' : (PAGAS.includes(r) ? '#2c5f8a' : '#4a4a52')),
          borderRadius: 2,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:0, color:'#9dc4e8',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'bar', label:'MQL', yAxisID:'y',
          data: redes.map(r => v.porRede[r].mqls),
          backgroundColor: redes.map(r =>
            !opaco(r) ? '#2e2e2e' : (PAGAS.includes(r) ? '#4a9eed' : '#7a7a86')),
          borderRadius: 2,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'top', offset:0, color:'#cfe4f7',
            font:{ family:'DM Mono', size:9 }, formatter: v => fmtNum(v) } },
        { type:'line', label:'CPL', yAxisID:'y1',
          data: redes.map(r => v.porRede[r].cpl === null ? null : Math.round(v.porRede[r].cpl)),
          borderColor:'#d9a441', borderWidth:2, pointRadius:3,
          pointBackgroundColor:'#d9a441', tension:.3, spanGaps:true,
          datalabels: { display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'bottom', color:'#d9a441',
            font:{ family:'DM Mono', size:9 },
            formatter: v => 'R$ ' + fmtNum(v) } },
      ],
    },
    options: {
      ...opcoesBase(),
      onClick: (_, els) => { if (els.length) toggleFiltro('rede', redes[els[0].index]); },
      plugins: {
        ...opcoesBase().plugins,
        legend: { display:true, labels:{ color:'#e8e8e8',
          font:{ family:'DM Mono', size:9 }, boxWidth:9 } },
        tooltip: { ...opcoesBase().plugins.tooltip, callbacks: {
          label: ctx => ctx.dataset.label === 'CPL'
            ? ' CPL ' + fmtBRL(ctx.raw)
            : ` ${ctx.dataset.label}: ${fmtNum(ctx.raw)}`,
          afterBody: items => {
            const r = redes[items[0].dataIndex];
            return 'Investimento ' + fmtBRL(v.porRede[r].investimento);
          },
        } },
      },
      scales: {
        x: { ticks:{ color:'#e8e8e8', font:{ family:'DM Mono', size:10 } }, grid:{ display:false } },
        y: { beginAtZero:true, ticks:{ color:'#c8c8c8', font:{ family:'DM Mono', size:9 } },
             grid:{ color:'#1c1c1c' } },
        y1:{ position:'right', beginAtZero:true, grid:{ display:false },
             ticks:{ color:'#d9a441', font:{ family:'DM Mono', size:9 },
                     callback: val => 'R$ ' + fmtNum(val) } },
      },
    },
  }));

  // ── CPL por dia: investimento do dia dividido pelos leads do dia ─────
  // So existe no modo report. Dias sem lead ficam sem ponto (null), senao
  // a linha despencaria pra zero e distorceria a leitura.
  const cplDia = v.leadsPorDia.map(d => {
    const inv = v.investPorDia[d.data] || 0;
    return d.leads ? Math.round(inv / d.leads) : null;
  });
  const cplMedio = (() => {
    const vals = cplDia.filter(x => x !== null);
    return vals.length ? vals.reduce((s, x) => s + x, 0) / vals.length : 0;
  })();

  charts.cpl = comCanvas('chartCpl', el => new Chart(el, {
    data: {
      labels,
      datasets: [
        { type:'line', label:'CPL', data: cplDia,
          borderColor:'#d9a441', borderWidth:2, tension:.3, spanGaps:true,
          pointRadius:2, pointBackgroundColor:'#d9a441',
          datalabels: {
            display: ctx => {
              const d = ctx.dataset.data, i = ctx.dataIndex;
              if (d[i] === null) return false;
              const validos = d.filter(x => x !== null);
              return i === d.length - 1 || d[i] === Math.max(...validos);
            },
            anchor:'end', align:'top', color:'#d9a441',
            font:{ family:'DM Mono', size:9 },
            formatter: val => 'R$ ' + fmtNum(val) } },
        { type:'line', label:'Média', data: labels.map(() => Math.round(cplMedio)),
          borderColor:'#ffffff44', borderWidth:1.5, borderDash:[5,4],
          pointRadius:0, datalabels:{ display:false } },
      ],
    },
    options: {
      ...opcoesBase(),
      plugins: { ...opcoesBase().plugins,
        legend: { display:true, labels:{ color:'#e8e8e8',
          font:{ family:'DM Mono', size:9 }, boxWidth:9 } },
        tooltip: { ...opcoesBase().plugins.tooltip,
          callbacks: { label: ctx => ctx.raw === null
            ? ' sem leads no dia'
            : ` ${ctx.dataset.label}: ${fmtBRL(ctx.raw)}` } } },
      scales: {
        ...opcoesBase().scales,
        y: { ...opcoesBase().scales.y,
             ticks: { ...opcoesBase().scales.y.ticks,
                      callback: val => 'R$ ' + fmtNum(val) } },
      },
    },
  }));

  // ── CPMQL por dia ────────────────────────────────────────────────────
  // Serie temporal: no Consolidado uma linha por produto, numa aba de
  // produto so a dele. Dia sem investimento ou sem MQL fica sem ponto.
  const cpmqlDia = cpmqlPorDiaProduto();

  if (!cpmqlDia.labels.length) {
    aviso('chartCpmqlProdutos', 'Sem investimento ou MQL no período.');
  }

  charts.cpmqlProdutos = comCanvas('chartCpmqlProdutos', el => new Chart(el, {
    data: {
      labels: cpmqlDia.labels,
      datasets: cpmqlDia.series.map(s => ({
        type: 'line',
        label: s.nome,
        data: s.dados,
        borderColor: CORES_PRODUTO[s.nome] || '#4a9eed',
        backgroundColor: CORES_PRODUTO[s.nome] || '#4a9eed',
        borderWidth: 2.5,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: CORES_PRODUTO[s.nome] || '#4a9eed',
        tension: .3,
        // Sem isso a linha corta em todo dia sem MQL e vira tracejado
        spanGaps: true,
        fill: false,
        datalabels: {
          // Rotulo em todo ponto que tem valor
          display: ctx => ctx.dataset.data[ctx.dataIndex] !== null,
          anchor: 'end', align: 'top', offset: 6,
          color: '#ffffff',
          font: { family: 'DM Mono', size: 12, weight: 500 },
          // Fundo escuro atras do numero: com varias linhas cruzando, o
          // rotulo solto some por cima da grade e das outras series
          backgroundColor: 'rgba(10,10,10,.82)',
          borderRadius: 3,
          padding: { top: 3, bottom: 3, left: 6, right: 6 },
          formatter: v => fmtNum(v),
        },
      })),
    },
    options: {
      ...opcoesBase(),
      interaction: { mode: 'index', intersect: false },
      plugins: {
        ...opcoesBase().plugins,
        legend: { display: cpmqlDia.series.length > 1,
          labels:{ color:'#e8e8e8', font:{ family:'DM Mono', size:11 },
                   boxWidth:12, padding:14 } },
        tooltip: { ...opcoesBase().plugins.tooltip, callbacks: {
          label: ctx => {
            if (ctx.raw === null) return null;   // esconde produto sem dado no dia
            const s = cpmqlDia.series[ctx.datasetIndex];
            const dia = cpmqlDia.labels[ctx.dataIndex];
            const inv = s.invDia[dia] || 0;
            const mql = s.mqlDia[dia] || 0;
            return ` ${ctx.dataset.label}: ${fmtBRL(ctx.raw)}`
                 + `  (${fmtBRL(inv)} / ${fmtNum(mql)} MQL)`;
          },
        } },
      },
      scales: {
        x: { ticks:{ color:'#e8e8e8', font:{ family:'DM Mono', size:11 },
                     maxRotation: 45 },
             grid:{ color:'#1a1a1a' } },
        y: { beginAtZero:true,
             // Folga no topo pro rotulo do ponto mais alto nao encostar
             // na borda do card
             grace: '12%',
             ticks:{ color:'#c8c8c8', font:{ family:'DM Mono', size:11 },
                     callback: val => 'R$ ' + fmtNum(val) },
             grid:{ color:'#1c1c1c' } },
      },
    },
  }));

  // Ganhos acumulados. Se ninguém marcou "sim" ainda, mostra todos os ganhos
  // pra tela não ficar vazia — o aviso fica no título do card.
  const validados = v.ganhos.filter(x => x.vale === 'sim');
  const usarTodos = validados.length === 0 && v.ganhos.length > 0;
  const base = usarTodos ? v.ganhos : validados;

  const tituloGanhos = document.querySelector('#chartGanhos')
    ?.closest('.card')?.querySelector('.card-title');
  if (tituloGanhos && usarTodos) {
    tituloGanhos.innerHTML = 'Vendas e faturamento <span class="card-tag" ' +
      'style="background:var(--amber);color:#0a0a0a">sem validação</span>';
  }

  const ganhosPorDia = {};
  const qtdPorDia    = {};
  for (const g of base) {
    ganhosPorDia[g.data] = (ganhosPorDia[g.data] || 0) + g.valor;
    qtdPorDia[g.data]    = (qtdPorDia[g.data] || 0) + 1;
  }
  const diasGanhos = Object.keys(ganhosPorDia).sort((a, b) => paraData(a) - paraData(b));
  let acum = 0;
  const acumulado = diasGanhos.map(d => acum += ganhosPorDia[d]);

  // Faturamento acumulado, com a linha de ritmo da meta ao lado
  const metaFat = (METAS[produtoAtivo] || {}).faturamento;
  const diasNoMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();

  // A meta cresce linear ao longo do mes: no dia N deveria estar em
  // meta/dias * N. Assim a distancia entre as duas linhas e' o atraso.
  const linhaMeta = metaFat
    ? diasGanhos.map(d => Math.round(metaFat / diasNoMes * Number(d.split('/')[0])))
    : null;

  charts.ganhos = comCanvas('chartGanhos', el => new Chart(el, {
    data: {
      labels: diasGanhos,
      datasets: [
        // Barras: quantas vendas em cada dia. O acumulado sozinho nao
        // mostra em que dia o resultado aconteceu.
        {
          type: 'bar', label: 'Vendas no dia', yAxisID: 'y1',
          data: diasGanhos.map(d => qtdPorDia[d] || 0),
          backgroundColor: '#2f6b46', borderRadius: 2, order: 3,
          datalabels: {
            display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
            anchor:'end', align:'end', offset:-1, color:'#8fd6ab',
            font:{ family:'DM Mono', size:8 }, formatter: v => fmtNum(v),
          },
        },
        {
          type: 'line', label: 'Faturamento acum.', data: acumulado,
          borderColor:'#4ade80', borderWidth:2.5, yAxisID: 'y',
          pointRadius:3, pointBackgroundColor:'#4ade80', fill:false, tension:.3,
          order: 1,
          datalabels: {
            display: ctx => ctx.dataIndex === ctx.dataset.data.length - 1,
            anchor:'end', align:'left', color:'#4ade80',
            font:{ family:'DM Mono', size:10, weight:500 },
            formatter: v => fmtBRL(v),
          },
        },
        ...(linhaMeta ? [{
          type: 'line', label: 'Projeção', data: linhaMeta, yAxisID: 'y',
          borderColor:'#d9a441', borderWidth:2, borderDash:[6,4],
          pointRadius:0, fill:false, tension:0, order: 2,
          datalabels: {
            display: ctx => ctx.dataIndex === ctx.dataset.data.length - 1,
            anchor:'end', align:'left', offset:6, color:'#d9a441',
            font:{ family:'DM Mono', size:10 },
            formatter: v => fmtBRL(v),
          },
        }] : []),
      ],
    },
    options: {
      ...opcoesBase(),
      plugins: {
        ...opcoesBase().plugins,
        legend: { display:true, labels:{ color:'#e8e8e8',
          font:{ family:'DM Mono', size:9 }, boxWidth:9 } },
        tooltip: { ...opcoesBase().plugins.tooltip,
          callbacks: { label: ctx => ctx.dataset.label === 'Vendas no dia'
            ? ` ${fmtNum(ctx.raw)} venda${ctx.raw === 1 ? '' : 's'}`
            : ` ${ctx.dataset.label}: ${fmtBRL(ctx.raw)}` } },
      },
      scales: {
        ...opcoesBase().scales,
        // Eixo esquerdo: faturamento acumulado (cresce sempre)
        y: { ...opcoesBase().scales.y, position: 'left',
             ticks: { ...opcoesBase().scales.y.ticks,
                      callback: val => 'R$ ' + (val/1000).toFixed(0) + 'k' } },
        // Eixo direito: volume de vendas do dia, em escala propria
        y1: { position:'right', beginAtZero:true, grid:{ display:false },
              ticks:{ color:'#8fd6ab', font:{ family:'DM Mono', size:9 },
                      precision: 0 } },
      },
    },
  }));
}

// ── Início ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const hoje = new Date();
  const ano  = hoje.getFullYear();
  const mes  = String(hoje.getMonth() + 1).padStart(2, '0');
  const dia  = String(hoje.getDate()).padStart(2, '0');
  document.getElementById('dataInicio').value = `${ano}-${mes}-01`;
  document.getElementById('dataFim').value    = `${ano}-${mes}-${dia}`;

  // Mudar o periodo principal reposiciona a janela de comparacao junto —
  // ver sincronizarComparacao(). Sem isso a comparacao ficava presa no
  // periodo sugerido da primeira vez.
  for (const id of ['dataInicio', 'dataFim']) {
    document.getElementById(id).addEventListener('change', e => {
      rastrear('mudar_periodo',
               `${id === 'dataInicio' ? 'início' : 'fim'}: ${e.target.value}`);
      sincronizarComparacao();
      renderTabs();   // os cards do topo tem contagem propria, por produto
      render();
    });
  }

  // Editar a comparacao a mao desliga a sincronizacao automatica
  for (const id of ['compInicio', 'compFim']) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.addEventListener('change', e => {
      compManual = true;
      rastrear('mudar_comparacao', `${id}: ${e.target.value}`);
      render();
    });
  }
  document.getElementById('compInicio').addEventListener('change', e => {
    rastrear('mudar_periodo_comparacao', `início: ${e.target.value}`);
    render();
  });
  document.getElementById('compFim').addEventListener('change', e => {
    rastrear('mudar_periodo_comparacao', `fim: ${e.target.value}`);
    render();
  });

  rastrear('abrir_dashboard', navigator.language || '');
  carregar();
});
</script>
</body>
</html>
